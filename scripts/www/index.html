function parseLine(line){line=line.trim();if(!line)return null;var parts;if(line.indexOf('\t')>=0)parts=line.split('\t');else if(line.indexOf('|')>=0)parts=line.split('|');else if(line.indexOf(',')>=0)parts=line.split(',');else if(line.indexOf('，')>=0)parts=line.split('，');else parts=line.split(/\s+/);parts=parts.map(function(x){return x.trim();}).filter(function(x){return x;});if(parts.length<4)return null;var priceRe=/^-?\d+(\.\d+)?$/;var brand='',series='',model='',prices=[];var textParts=[],priceParts=[];for(var i=0;i<parts.length;i++){if(i>0&&priceRe.test(parts[i])&&parseInt(parts[i])<1000000&&priceParts.length<4){priceParts.push(parseInt(parts[i]));}else{textParts.push(parts[i]);}}if(textParts.length<1||priceParts.length<3)return null;var brandFound=false;for(var bi=0;bi<Math.min(textParts.length,3);bi++){for(var bj=0;bj<state.brands.length;bj++){var bn=state.brands[bj].name,tp=textParts[bi];if(tp===bn||tp.indexOf(bn)>=0||bn.indexOf(tp)>=0||(bn==='壹加'&&(tp.indexOf('一加')>=0||tp.indexOf('壹加')>=0))||(bn==='ViVO'&&(tp.toLowerCase().indexOf('vivo')>=0))){brand=bn;textParts=textParts.slice(0,bi).concat(textParts.slice(bi+1));brandFound=true;break;}}if(brandFound)break;}if(!brand)brand=textParts[0];if(textParts.length>=2){series=textParts[0];model=textParts.slice(1).join(' ');}else if(textParts.length===1){model=textParts[0];}while(prices.length<4)prices.push(0);for(var pi=0;pi<Math.min(4,priceParts.length);pi++)prices[pi]=priceParts[pi];return{brand:brand,series:series||'',model:model||'',price1:prices[0],price2:prices[1],price3:prices[2],price4:prices[3]};}

    h+='<col style="width:'+seriesPct+'%"><col style="width:'+modelPct+'%">';
    for(var ci=0;ci<4;ci++)h+='<col style="width:'+pricePct+'%">';
    h+='</colgroup>';
    h+='<thead><tr>';
    if(state.batchMode)h+='<th class="col-check"><input type="checkbox" class="cb" '+(state.selectAll?'checked':'')+' onchange="_togAll()" /></th>';
    if(showBrandCol)h+='<th class="col-brand">品牌</th>';
    h+='<th class="col-series">系列</th><th class="col-model">型号</th><th class="col-price">开机屏坏</th><th class="col-price">不开机</th><th class="col-price">废板</th><th class="col-price">整机</th></tr></thead><tbody>';
    for(var ri=0;ri<fData.length;ri++){
        var r=fData[ri],sel=state.selectedRows.indexOf(r.id)>=0,br=getBrand(r.brand);
        h+='<tr class="'+(sel?'selected':'')+'" ontouchstart="_lp('+r.id+')" ontouchend="_clp()" ontouchmove="_clp()">';
        if(state.batchMode)h+='<td class="col-check"><input type="checkbox" class="cb" '+(state.rowSelected[r.id]?'checked':'')+' onchange="_tog('+r.id+')" /></td>';
        if(showBrandCol)h+='<td class="col-brand" onclick="_obp('+r.id+')" style="color:'+br.color+';font-weight:600;cursor:pointer;">'+esc(r.brand)+'</td>';
        h+='<td class="col-series series-cell" style="background:'+br.darkColor+';" onclick="_ec('+r.id+',\'series\')">';
        if(ec&&ec.rowId===r.id&&ec.field==='series')h+='<input class="cell-edit" type="text" value="'+esc(r.series)+'" style="color:#333;background:white;text-align:center;" oninput="_uf('+r.id+',\'series\',this.value)" onblur="_fe('+r.id+')" onkeyup="_kh(event,'+r.id+')" />';else h+=esc(r.series);h+='</td>';
        h+='<td class="col-model" onclick="_ec('+r.id+',\'model\')">';
        if(ec&&ec.rowId===r.id&&ec.field==='model')h+='<input class="cell-edit" type="text" value="'+esc(r.model)+'" oninput="_uf('+r.id+',\'model\',this.value)" onblur="_fe('+r.id+')" onkeyup="_kh(event,'+r.id+')" />';else h+=esc(r.model);h+='</td>';
        var pfs=[['price1','price-p1'],['price2','price-p2'],['price3','price-p3'],['price4','price-p4']];
        for(var pf=0;pf<pfs.length;pf++){var pfn=pfs[pf][0],pfc=pfs[pf][1];h+='<td class="col-price '+pfc+'" onclick="_ec('+r.id+',\''+pfn+'\')">';if(ec&&ec.rowId===r.id&&ec.field===pfn)h+='<input class="cell-edit" type="tel" value="'+esc(r[pfn])+'" style="color:#333;" oninput="_uf('+r.id+',\''+pfn+'\',this.value)" onblur="_fe('+r.id+')" onkeyup="_kh(event,'+r.id+')" />';else h+=esc(r[pfn]);h+='</td>';}
        h+='</tr>';
    }
    if(fData.length===0){h+='<tr><td colspan="'+(state.batchMode?(showBrandCol?8:7):(showBrandCol?7:6))+'"><div class="empty-state"><div class="empty-state-icon">📱</div><div style="font-size:13px;">暂无数据，点击右上角+添加</div></div></td></tr>';}
    h+='</tbody></table></div></div>';
    if(Math.abs(state.tableScale-1)>0.01)h+='<div class="zoom-indicator">'+Math.round(state.tableScale*100)+'%</div>';
    h+='</div>';
    var tableEl=document.getElementById('table-area');
    var activeIsSearch=document.activeElement&&document.activeElement.classList.contains('search-input');
    if(tableEl)tableEl.innerHTML=h;
    if(activeIsSearch){var ns=document.querySelector('.search-input');if(ns){ns.focus();var len=ns.value.length;ns.setSelectionRange(len,len);}}
    initZoom();
}

// ============ Render: Batch Bar Only ============
function renderBatchBar(){
    var h='<div class="batch-bar"><span>已选 '+state.selectedRows.length+' 项</span><div class="batch-bar-btns"><button class="mini-btn mini-btn-danger" onclick="_batchDel()" '+(state.selectedRows.length===0?'disabled':'')+'>删除</button><button class="mini-btn mini-btn-warning" onclick="_openBP()" '+(state.selectedRows.length===0?'disabled':'')+'>调价</button><button class="mini-btn mini-btn-light" onclick="_exitB()">完成</button></div></div>';
    var bb=document.getElementById('batch-bar-el');
    if(bb)bb.innerHTML=h;
}

// ============ Render: Overlay (modals/action sheets) ============
function renderOverlay(){
    var ol=document.getElementById('overlay-layer');
    if(!ol)return;
    var m=state.selectedModal;
    var h='';
    if(m==='menu'){
        h+='<div class="action-sheet-bg" onclick="_closeAll()"></div><div class="action-sheet">';
        h+='<div class="action-sheet-group"><div class="action-item" onclick="_addRow()">+ 添加一行</div><div class="action-item" onclick="_enterB()">批量管理</div><div class="action-item" onclick="_openImp()">批量导入</div><div class="action-item" onclick="_openBMgr()">品牌管理</div><div class="action-item" onclick="_openSet()">⚙ 设置</div></div>';
        h+='<div class="action-cancel" onclick="_closeAll()">取消</div></div>';
    }else if(m==='brandPicker'){
        h+='<div class="action-sheet-bg" onclick="_closeAll()"></div><div class="action-sheet">';
        h+='<div class="action-sheet-group"><div style="text-align:center;padding:12px;font-weight:600;color:#1e3a8a;border-bottom:1px solid #f3f4f6;">选择品牌</div>';
        for(var i=0;i<state.brands.length;i++){var bb=state.brands[i];h+='<div class="action-item" style="display:flex;align-items:center;justify-content:center;gap:8px;" onclick="_selBName(\''+esc(bb.name).replace(/'/g,"\\'")+'\')"><span style="width:12px;height:12px;border-radius:50%;background:'+bb.color+';display:inline-block;"></span><span style="color:'+bb.color+';font-weight:600;">'+esc(bb.name)+'</span></div>';}
        h+='</div><div class="action-cancel" onclick="_closeAll()">取消</div></div>';
    }else if(m==='settings'){
        h+='<div class="modal-overlay side" onclick="if(event.target===this)_closeAll()"><div class="modal-box side" onclick="event.stopPropagation()"><div class="modal-body" style="padding-top:40px;"><h2 style="margin-bottom:16px;color:#1e3a8a;font-size:20px;">⚙ 设置</h2><div class="setting-item" onclick="_openImp()"><span>批量导入</span><span class="setting-arrow">›</span></div><div class="setting-item" onclick="_openBMgr()"><span>品牌管理</span><span class="setting-arrow">›</span></div><div class="setting-item" onclick="_openVH()"><span>版本历史</span><span class="setting-arrow">›</span></div><div class="setting-item" onclick="_resetZ()"><span>重置缩放</span><span class="setting-arrow">›</span></div><div class="setting-item danger" onclick="_clearAll()"><span>清空所有数据</span><span class="setting-arrow">›</span></div><div class="footer-info">深圳手机回收评估报价单 v1.0<br>数据本地存储 · 离线可用<br>共 '+state.tableData.length+' 条机型数据<br><span style="opacity:0.7;display:block;margin-top:4px;">双指捏合缩放 · 双击重置 · 长按删除</span></div></div></div></div>';
    }else if(m==='import'){
        h+='<div class="modal-overlay" onclick="if(event.target===this)_closeAll()"><div class="modal-box" onclick="event.stopPropagation()"><div class="modal-header">📥 批量导入数据</div><div class="modal-body"><div class="form-hint">支持粘贴从Excel/网页/记事本复制的数据，分隔符支持制表符、逗号、竖线(|)、空格。<br>格式：品牌 系列 型号 开机屏坏 不开机 废板 整机<br><b>无数量限制</b>，自动识别品牌（壹加/一加/ViVO/vivo自动匹配）、排序合并。</div><textarea class="import-area" id="importTextarea" placeholder="粘贴数据...\n示例：\nOPPO Reno Reno9 180 40 15 750\n华为 Mate Mate50 280 60 20 1100\n壹加 Ace Ace3 420 150 40 1200"></textarea></div><div class="modal-footer"><button class="btn btn-default" onclick="_closeAll()">取消</button><button class="btn btn-primary" onclick="_doImp()">开始导入</button></div></div></div>';
    }else if(m==='brandManager'){
        h+='<div class="modal-overlay bottom" onclick="if(event.target===this)_closeAll()"><div class="modal-box bottom" onclick="event.stopPropagation()"><div class="modal-header">🏷 品牌管理</div><div class="modal-body" style="padding:0 16px;">';
        for(var i=0;i<state.brands.length;i++){var br2=state.brands[i];h+='<div class="brand-item"><div class="brand-dot" style="background:'+br2.color+';"></div><input class="brand-name-input" value="'+esc(br2.name)+'" oninput="_uBN(\''+br2.id+'\',this.value)" onblur="_sBrs()" /><input type="color" class="color-picker" value="'+br2.color+'" onchange="_uBC(\''+br2.id+'\',this.value)" /><button class="delete-icon-btn" onclick="_dB(\''+br2.id+'\')">×</button></div>';}
        h+='</div><div class="modal-footer" style="flex-direction:column;"><button class="btn btn-primary" onclick="_addB()">+ 添加新品牌</button><button class="btn btn-default" onclick="_closeAll()" style="margin-top:8px;">关闭</button></div></div></div>';
    }else if(m==='priceAdjust'){
        h+='<div class="modal-overlay" onclick="if(event.target===this)_closeAll()"><div class="modal-box" onclick="event.stopPropagation()"><div class="modal-header">💰 批量价格调整</div><div class="modal-body"><div class="form-hint">将对选中的 <b style="color:#1e40af;">'+state.selectedRows.length+'</b> 条数据进行价格调整</div><div class="form-label">选择价格列：</div><div class="checkbox-row"><label class="checkbox-item"><input type="checkbox" '+(state.adjustCols.price1?'checked':'')+' onchange="_tAC(\'price1\',this.checked)" />开机屏坏</label><label class="checkbox-item"><input type="checkbox" '+(state.adjustCols.price2?'checked':'')+' onchange="_tAC(\'price2\',this.checked)" />不开机</label><label class="checkbox-item"><input type="checkbox" '+(state.adjustCols.price3?'checked':'')+' onchange="_tAC(\'price3\',this.checked)" />废板</label><label class="checkbox-item"><input type="checkbox" '+(state.adjustCols.price4?'checked':'')+' onchange="_tAC(\'price4\',this.checked)" />整机</label></div><div class="form-label">调整百分比（正数上涨，负数下跌）：</div><input class="form-input" type="number" id="adjustPct" placeholder="如：10 表示上涨10%，-15 表示下跌15%" value="'+state.adjustPercent+'" oninput="_uAP(this.value)" /></div><div class="modal-footer"><button class="btn btn-default" onclick="_closeAll()">取消</button><button class="btn btn-primary" onclick="_doPrice()">应用调整</button></div></div></div>';
    }else if(m==='versionHistory'){
        h+='<div class="modal-overlay bottom" onclick="if(event.target===this)_closeAll()"><div class="modal-box bottom" style="height:55%;" onclick="event.stopPropagation()"><div class="modal-header">📜 版本历史（最近5次）</div><div class="modal-body" style="padding:0 16px;">';
        if(state.versionHistory.length===0)h+='<div style="text-align:center;padding:30px;color:#9ca3af;font-size:13px;">暂无历史版本</div>';
        else for(var vi=0;vi<state.versionHistory.length;vi++){var v=state.versionHistory[vi];h+='<div class="version-item"><div><div class="version-label">'+esc(v.label||('快照 '+(state.versionHistory.length-vi)))+'</div><div class="version-meta">'+formatTime(v.timestamp)+' · '+v.count+' 条数据</div></div><button class="restore-btn" onclick="_restoreV('+vi+')">恢复</button></div>';}
        h+='</div><div class="modal-footer"><button class="btn btn-default" onclick="_closeAll()">关闭</button></div></div></div>';
    }else if(m==='datePicker'){
        var dim2=new Date(state.dateY,state.dateM+1,0).getDate();
        h+='<div class="modal-overlay bottom" onclick="if(event.target===this)_closeAll()"><div class="modal-box" style="border-radius:14px 14px 0 0;max-width:100%;" onclick="event.stopPropagation()"><div class="modal-header">选择日期</div><div class="modal-body"><div class="date-picker-wheels"><div class="date-wheel"><select id="dpY" onchange="_uY(this.value)">';
        for(var y=2020;y<=2035;y++)h+='<option value="'+y+'" '+(y===state.dateY?'selected':'')+'>'+y+'年</option>';
        h+='</select></div><div class="date-wheel"><select id="dpM" onchange="_uMo(this.value)">';
        for(var m=1;m<=12;m++)h+='<option value="'+(m-1)+'" '+((m-1)===state.dateM?'selected':'')+'>'+m+'月</option>';
        h+='</select></div><div class="date-wheel"><select id="dpD" onchange="_uD(this.value)">';
        for(var d=1;d<=dim2;d++)h+='<option value="'+d+'" '+(d===state.dateD?'selected':'')+'>'+d+'日</option>';
        h+='</select></div></div></div><div class="modal-footer"><button class="btn btn-default" onclick="_closeAll()">取消</button><button class="btn btn-primary" onclick="_saveDate()">确定</button></div></div></div>';
    }else if(state.confirmDialog){
        var cd=state.confirmDialog;
        h+='<div class="modal-overlay" onclick="if(event.target===this)_cancelC()"><div class="modal-box" style="max-width:300px;" onclick="event.stopPropagation()"><div class="modal-header">'+esc(cd.title)+'</div><div class="modal-body"><div class="confirm-msg">'+esc(cd.msg).replace(/\n/g,'<br>')+'</div></div><div class="modal-footer">';
        if(cd.cancelText)h+='<button class="btn btn-default" onclick="_cancelC()">'+esc(cd.cancelText)+'</button>';
        h+='<button class="btn btn-danger" onclick="_okC()">'+esc(cd.okText)+'</button></div></div></div>';
    }
    if(state.longPressHint)h+='<div class="long-press-hint show">长按删除该行</div>';
    if(state.toast)h+='<div class="toast">'+esc(state.toast)+'</div>';
    ol.innerHTML=h;
    requestAnimationFrame(function(){ol.className='active';});
}
function closeAllOverlays(){state.selectedModal=null;state.brandPickerRow=null;state.confirmDialog=null;var ol=document.getElementById('overlay-layer');if(ol){ol.className='';ol.innerHTML='';}}

// ============ Init App Shell ============
function initApp(){
    var app=document.getElementById('app');
    app.innerHTML='<div class="app-header"><div class="header-title">深圳手机回收评估报价单</div><div class="header-actions"><button class="icon-btn" onclick="_addRow()">+</button><button class="icon-btn menu-btn" onclick="_openMenu()">⋮</button></div></div><div class="date-row" onclick="_editDate()"><span class="date-text" id="date-text-el">'+esc(state.currentDate)+' <span class="date-edit-icon">✎</span></span></div><div id="batch-bar-el"></div><div id="table-area"></div>';
}

// ============ Event Handlers ============
var H={};
H._addRow=addRow;
H._openMenu=function(){state.selectedModal='menu';renderOverlay();};
H._closeAll=closeAllOverlays;
H._selB=function(n){state.selectedBrand=n;state.searchKeyword='';renderTable();};
H._search=onSearchInput;
H._clearSearch=function(){state.searchKeyword='';renderTable();};
H._ec=function(id,f){var r=findRow(id);if(r)editCell(r,f);};
H._uf=function(id,f,v){var r=findRow(id);if(r)r[f]=v;};
H._fe=function(id){var r=findRow(id);if(r)finishEdit(r);};
H._kh=function(e,id){if(e.key==='Enter'){var r=findRow(id);if(r)finishEdit(r);}};
H._lp=function(id){var r=findRow(id);if(r)startLongPress(r);};
H._clp=clearLongPress;
H._obp=function(id){var r=findRow(id);if(r)openBrandPicker(r);};
H._selBName=selectBrand;
H._enterB=enterBatchMode;H._exitB=exitBatchMode;
H._tog=toggleRow;H._togAll=toggleSelectAll;
H._batchDel=batchDelete;H._openBP=openBatchPrice;
H._openImp=openImport;H._doImp=doImport;
H._openBMgr=openBrandManager;
H._addB=addNewBrand;
H._uBN=updateBrandName;
H._uBC=updateBrandColor;
H._sBrs=saveBrands;H._dB=deleteBrand;
H._openSet=openSettings;
H._openVH=openVersionHistory;
H._restoreV=restoreVersion;H._resetZ=resetZoom;H._clearAll=confirmClearAll;
H._editDate=editDate;
H._uY=function(v){state.dateY=parseInt(v);var dim=new Date(state.dateY,state.dateM+1,0).getDate();if(state.dateD>dim)state.dateD=dim;};
H._uMo=function(v){state.dateM=parseInt(v);var dim=new Date(state.dateY,state.dateM+1,0).getDate();if(state.dateD>dim)state.dateD=dim;};
H._uD=function(v){state.dateD=parseInt(v);};
H._saveDate=saveDate;
H._tAC=function(c,v){state.adjustCols[c]=v;};
H._uAP=function(v){state.adjustPercent=Number(v);};
H._doPrice=doPriceAdjust;
H._okC=function(){if(state.confirmDialog&&state.confirmDialog.onOk)state.confirmDialog.onOk();state.confirmDialog=null;renderOverlay();};
H._cancelC=function(){state.confirmDialog=null;renderOverlay();};
for(var k in H)window[k]=H[k];

function init(){
    try{
        loadData();
        initApp();
        var ls=document.getElementById('loadingScreen');
        if(ls)ls.style.display='none';
        renderTable();
    }catch(e){
        console.error(e);
        var app=document.getElementById('app');
        if(app)app.innerHTML='<div style="color:white;padding:30px;text-align:center;background:linear-gradient(135deg,#0d1b3e,#2563eb);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="font-size:16px;margin-bottom:8px;">加载失败</div><div style="font-size:12px;opacity:0.7;">'+esc(e.message)+'</div></div>';
    }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
