<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PPT生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5}
        .container{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative}
        .header{background:#fff;padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .header h1{font-size:20px;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .content{padding:20px}
        .status{background:#ecfdf5;color:#065f46;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:8px}
        .dot{width:8px;height:8px;background:#10b981;border-radius:50%}
        label{font-size:14px;font-weight:600;display:block;margin-bottom:8px;margin-top:16px}
        textarea{width:100%;min-height:120px;padding:14px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-family:inherit;background:#f8fafc;resize:vertical}
        textarea:focus{outline:none;border-color:#6366f1;background:#fff}
        .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
        .chip{padding:6px 12px;background:#eef2ff;color:#6366f1;border-radius:16px;font-size:12px;cursor:pointer}
        .templates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
        .tpl{flex-shrink:0;width:90px;border-radius:12px;border:3px solid #e2e8f0;cursor:pointer;overflow:hidden}
        .tpl.selected{border-color:#6366f1}
        .tpl-prev{height:50px;display:flex;align-items:center;justify-content:center;font-size:22px}
        .tpl-name{padding:4px;text-align:center;font-size:11px;font-weight:600;background:#fff}
        .page-row{display:flex;gap:10px;align-items:center;margin:10px 0}
        .page-input{width:60px;padding:6px;border:2px solid #e2e8f0;border-radius:8px;font-size:18px;font-weight:700;text-align:center;color:#6366f1}
        .page-btns{display:flex;gap:6px;flex-wrap:wrap}
        .page-btn{padding:5px 12px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;color:#64748b;font-size:12px;cursor:pointer}
        .page-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
        .gen-btn{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px;box-shadow:0 4px 12px rgba(99,102,241,.3)}
        .gen-btn:disabled{opacity:.6}
        /* Progress */
        .progress{display:none;flex-direction:column;align-items:center;padding:60px 20px;min-height:100vh;background:linear-gradient(180deg,#eef2ff,#fff)}
        .progress.show{display:flex}
        .pct{font-size:48px;font-weight:700;color:#6366f1;margin:20px 0 10px}
        .p-status{font-size:18px;font-weight:600;margin-bottom:8px}
        .p-detail{font-size:14px;color:#64748b;margin-bottom:30px}
        .p-steps{width:100%;max-width:320px}
        .p-step{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:10px;margin-bottom:6px}
        .p-step.active{background:#eef2ff;border:2px solid #6366f1}
        .p-step.done{opacity:.6}
        .p-ic{width:32px;height:32px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:14px}
        .p-step.active .p-ic{background:#6366f1;color:#fff}
        .p-step.done .p-ic{background:#10b981;color:#fff}
        /* Preview */
        .preview{display:none;flex-direction:column;min-height:100vh;background:#f5f5f5}
        .preview.show{display:flex}
        .prev-header{background:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee}
        .prev-header button{width:36px;height:36px;border:none;border-radius:8px;background:#f1f5f9;font-size:18px;cursor:pointer}
        .prev-title{flex:1;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .prev-page{font-size:12px;color:#64748b;background:#f1f5f9;padding:4px 10px;border-radius:12px}
        .slides-area{flex:1;overflow:hidden}
        .slides-wrap{display:flex;height:100%;transition:transform .3s}
        .slide-page{min-width:100%;height:100%;padding:12px;display:flex;align-items:center;justify-content:center}
        .slide{width:100%;aspect-ratio:16/9;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.15);overflow:hidden;position:relative;display:flex}
        .slide-business{background:linear-gradient(135deg,#1e3a5f,#2d5a87);color:#fff}
        .slide-creative{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .slide-minimal{background:#fff;color:#333}
        .slide-tech{background:linear-gradient(135deg,#0a0a0a,#1a1a2e);color:#00ff88}
        .slide-academic{background:#fff;color:#333;border:3px solid #8b0000}
        .slide-academic .s-title{color:#8b0000;border-bottom:2px solid #8b0000;padding-bottom:4px}
        .s-cover{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
        .s-title{font-size:20px;font-weight:700;margin-bottom:8px}
        .s-cover .s-title{font-size:24px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
        .s-sub{font-size:12px;opacity:.8;margin-bottom:10px}
        .s-cover .s-sub{color:rgba(255,255,255,.9)}
        .s-side{width:38%;height:100%;flex-shrink:0;background:rgba(255,255,255,.1)}
        .s-content{flex:1;padding:14px;display:flex;flex-direction:column;z-index:1;overflow:hidden}
        .s-content .s-title{font-size:16px}
        .s-points{list-style:none;overflow-y:auto;flex:1}
        .s-points li{font-size:11px;line-height:1.5;padding-left:12px;position:relative;margin-bottom:3px}
        .s-points li:before{content:'';position:absolute;left:0;top:5px;width:5px;height:5px;border-radius:50%;background:currentColor}
        .s-footer{position:absolute;bottom:0;left:0;right:0;padding:4px 12px;font-size:8px;opacity:.6;display:flex;justify-content:space-between}
        .thumbs{background:#fff;padding:6px;border-top:1px solid #eee;display:flex;gap:5px;overflow-x:auto}
        .thumb{flex-shrink:0;width:28px;height:16px;border-radius:2px;border:2px solid transparent;background:#f1f5f9;font-size:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600}
        .thumb.active{border-color:#6366f1}
        .prev-actions{background:#fff;padding:8px 14px;display:flex;gap:6px;border-top:1px solid #eee}
        .action-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
        .action-btn.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
        .action-btn.secondary{background:#f1f5f9;color:#1e293b}
        /* Edit */
        .edit-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:100;display:none;flex-direction:column;overflow-y:auto}
        .edit-panel.show{display:flex}
        .edit-header{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee}
        .edit-header button{width:36px;height:36px;border:none;border-radius:8px;background:#f1f5f9;font-size:18px;cursor:pointer}
        .edit-body{padding:14px;flex:1}
        .edit-slide{background:#f8fafc;border-radius:10px;padding:12px;margin-bottom:10px}
        .edit-label{font-size:10px;color:#6366f1;font-weight:600;margin-bottom:6px}
        .edit-field{margin-bottom:8px}
        .edit-field label{font-size:11px;color:#64748b;margin:0 0 3px 0;font-weight:500}
        .edit-field input{width:100%;padding:6px 8px;border:2px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit}
        .point-row{display:flex;gap:4px;margin-bottom:4px}
        .point-del{width:26px;height:26px;border:none;border-radius:6px;background:#fee2e2;color:#ef4444;font-size:14px;cursor:pointer;flex-shrink:0}
        .add-point{width:100%;padding:6px;border:2px dashed #e2e8f0;border-radius:6px;background:none;color:#6366f1;font-size:11px;cursor:pointer;margin-top:4px}
        .edit-footer{position:sticky;bottom:0;background:#fff;padding:10px 14px;border-top:1px solid #eee;display:flex;gap:10px}
        .save-btn{flex:1;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
        .cancel-btn{padding:12px 18px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;color:#64748b;font-size:14px;font-weight:600;cursor:pointer}
        /* Toast */
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;transition:transform .3s}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.ok{background:#10b981}
        .toast.err{background:#ef4444}
        /* Modal */
        .modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:150;padding:16px}
        .modal-bg.show{display:flex}
        .modal{background:#fff;border-radius:14px;width:100%;max-width:340px;padding:18px}
        .modal h3{font-size:18px;text-align:center;margin-bottom:10px}
        .modal p{font-size:13px;color:#64748b;line-height:1.5;margin-bottom:14px}
        .modal-btns{display:flex;gap:10px}
        .modal-btns button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
        .m-cancel{background:#f1f5f9;color:#64748b}
        .m-ok{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
        .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:6px 0}
        .nav-btn{flex:1;background:none;border:none;color:#64748b;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
        .nav-btn.active{color:#6366f1}
        .nav-btn .ic{font-size:20px}
        .page{display:none}
        .page.active{display:block}
    </style>
</head>
<body>
<div class="container">
    <!-- Home Page -->
    <div class="page active" id="pageHome">
        <div class="header"><h1>🤖 AI PPT生成器</h1></div>
        <div class="content">
            <div class="status"><div class="dot"></div><span>✅ 离线智能就绪，无需网络</span></div>
            <label>📝 PPT主题</label>
            <textarea id="promptInput" placeholder="输入主题，例如：&#10;2024年度工作总结&#10;新员工入职培训&#10;项目汇报"></textarea>
            <div class="chips">
                <span class="chip" onclick="setPrompt('2024年度工作总结，业绩回顾、经验总结、问题分析、明年计划')">📋 年度总结</span>
                <span class="chip" onclick="setPrompt('新员工入职培训，公司介绍、企业文化、规章制度')">🎓 入职培训</span>
                <span class="chip" onclick="setPrompt('项目汇报，项目进展、成果展示、下一步计划')">📊 项目汇报</span>
                <span class="chip" onclick="setPrompt('产品介绍，核心功能、产品优势、应用场景')">📦 产品介绍</span>
            </div>
            <label>🎨 模板风格</label>
            <div class="templates" id="templatesBox"></div>
            <label>📄 页数</label>
            <div class="page-row">
                <input type="number" class="page-input" id="pageInput" value="8" min="3" max="30">
                <div class="page-btns">
                    <button class="page-btn" onclick="setPage(5,this)">5页</button>
                    <button class="page-btn active" onclick="setPage(8,this)">8页</button>
                    <button class="page-btn" onclick="setPage(12,this)">12页</button>
                </div>
            </div>
            <button class="gen-btn" id="genBtn" onclick="doGenerate()">🚀 立即生成PPT</button>
        </div>
    </div>

    <!-- Progress Page -->
    <div class="progress" id="pageProgress">
        <div class="pct" id="pctText">0%</div>
        <div class="p-status" id="statusText">准备中...</div>
        <div class="p-detail" id="detailText"></div>
        <div class="p-steps" id="stepsBox"></div>
    </div>

    <!-- Preview Page -->
    <div class="preview" id="pagePreview">
        <div class="prev-header">
            <button onclick="goHome()">←</button>
            <div class="prev-title" id="prevTitle">PPT预览</div>
            <button onclick="openEdit()">✏️</button>
            <div class="prev-page" id="pageIndicator">1/8</div>
        </div>
        <div class="slides-area"><div class="slides-wrap" id="slidesWrap"></div></div>
        <div class="thumbs" id="thumbsBox"></div>
        <div class="prev-actions">
            <button class="action-btn primary" onclick="downloadPPTX()"><span style="font-size:16px">💾</span><span>下载PPTX</span></button>
            <button class="action-btn secondary" onclick="doGenerate()"><span style="font-size:16px">🔄</span><span>重新生成</span></button>
        </div>
    </div>

    <!-- Edit Panel -->
    <div class="edit-panel" id="editPanel">
        <div class="edit-header">
            <button onclick="closeEdit()">←</button>
            <div style="flex:1;text-align:center;font-size:15px;font-weight:600">编辑内容</div>
            <div style="width:36px"></div>
        </div>
        <div class="edit-body" id="editBody"></div>
        <div class="edit-footer">
            <button class="cancel-btn" onclick="closeEdit()">取消</button>
            <button class="save-btn" onclick="saveEdit()">✓ 保存</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modal">
        <div class="modal">
            <h3 id="modalTitle">确认</h3>
            <p id="modalText"></p>
            <div class="modal-btns">
                <button class="m-cancel" onclick="closeModal()">取消</button>
                <button class="m-ok" id="modalOk">确定</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script>
// ===== State =====
var state = {
    tpl: 'business',
    count: 8,
    project: null,
    slideIdx: 0
};

var templates = [
    {id:'business', name:'商务', icon:'💼', cls:'slide-business'},
    {id:'creative', name:'创意', icon:'🎨', cls:'slide-creative'},
    {id:'minimal', name:'简约', icon:'✨', cls:'slide-minimal'},
    {id:'tech', name:'科技', icon:'🚀', cls:'slide-tech'},
    {id:'academic', name:'学术', icon:'🎓', cls:'slide-academic'}
];

// ===== Knowledge Base =====
var contentTemplates = {
    '年度总结|工作总结|年终|述职': [
        {title:'业绩回顾', points:['全年核心业绩指标完成情况', '销售额/营收数据同比增长分析', '重点客户开发与维护成果', '团队建设与人才培养成效']},
        {title:'重点工作', points:['年度重点项目推进交付', '产品迭代与技术升级', '市场拓展与品牌建设', '流程优化与效率提升']},
        {title:'经验总结', points:['核心竞争力持续增强', '团队协作能力提升', '客户满意度稳步提高', '创新驱动发展成效']},
        {title:'问题分析', points:['部分项目进度滞后分析', '团队能力短板分析', '资源配置问题分析', '市场应对不足分析']},
        {title:'改进措施', points:['加强项目进度管控', '完善人才培养体系', '优化资源配置效率', '建立快速响应机制']},
        {title:'明年计划', points:['新年度核心目标设定', '重点业务发展方向', '团队扩充计划', '新产品新业务规划']}
    ],
    '培训|入职|新员工': [
        {title:'公司介绍', points:['公司发展历程与里程碑', '主营业务与核心产品', '市场地位与竞争优势', '未来发展战略']},
        {title:'企业文化', points:['企业愿景使命价值观', '企业精神与工作作风', '行为准则与职业规范', '团队文化建设']},
        {title:'规章制度', points:['考勤管理制度', '请假休假规定', '办公行为规范', '保密合规要求']},
        {title:'岗位职责', points:['岗位说明书解读', '工作目标与KPI', '汇报关系与协作', '职业发展通道']},
        {title:'薪酬福利', points:['薪酬体系说明', '绩效考核制度', '五险一金介绍', '员工福利项目']},
        {title:'注意事项', points:['办公环境安全', '信息安全规范', '应急处理流程', '常用联系方式']}
    ],
    '项目|汇报|项目汇报': [
        {title:'项目背景', points:['项目立项背景', '核心问题定位', '相关方需求', '项目战略意义']},
        {title:'进展情况', points:['整体进度完成率', '各阶段任务完成', '时间节点达成', '资源投入情况']},
        {title:'成果展示', points:['已完成核心成果', '关键指标改善', '亮点工作与创新', '获得的认可']},
        {title:'问题风险', points:['当前主要问题', '潜在风险评估', '已采取应对措施', '需要的支持']},
        {title:'下一步计划', points:['下一阶段重点任务', '时间计划与节点', '资源需求调配', '风险应对预案']},
        {title:'总结展望', points:['阶段性总结', '经验教训反思', '后续工作展望', '感谢团队支持']}
    ],
    '产品|产品介绍|发布': [
        {title:'产品概述', points:['产品定位与理念', '解决的核心问题', '目标用户群体', '价值主张']},
        {title:'核心功能', points:['主要功能模块', '核心功能亮点', '功能演示说明', '技术架构支撑']},
        {title:'产品优势', points:['相比竞品优势', '技术壁垒', '用户体验优势', '性价比优势']},
        {title:'应用场景', points:['典型场景一', '典型场景二', '典型场景三', '客户案例']},
        {title:'使用指南', points:['快速上手步骤', '常见问题解答', '客服支持渠道', '版本更新说明']},
        {title:'发展规划', points:['产品路线图', '即将推出功能', '用户反馈机制', '长期愿景']}
    ]
};

var defaultSections = [
    {title:'背景概述', points:['主题背景与意义', '发展历程与现状', '相关政策环境', '研究目的范围']},
    {title:'现状分析', points:['当前现状梳理', '主要数据展示', '优势劣势分析', '机遇挑战并存']},
    {title:'核心内容', points:['核心概念阐释', '关键要素分析', '逻辑关系梳理', '核心价值提炼']},
    {title:'关键要点', points:['核心要点强调', '注意事项提示', '成功因素分析', '常见问题对策']},
    {title:'实施建议', points:['分阶段实施路径', '资源配置建议', '组织保障措施', '配套支撑体系']},
    {title:'总结展望', points:['主要结论归纳', '未来趋势预判', '长短期目标', '行动倡议']}
];

function findTemplate(topic) {
    for (var key in contentTemplates) {
        var keys = key.split('|');
        for (var i = 0; i < keys.length; i++) {
            if (topic.indexOf(keys[i]) >= 0) {
                return contentTemplates[key];
            }
        }
    }
    return defaultSections;
}

// ===== Init =====
function init() {
    renderTemplates();
}

function renderTemplates() {
    var box = document.getElementById('templatesBox');
    var html = '';
    for (var i = 0; i < templates.length; i++) {
        var t = templates[i];
        html += '<div class="tpl ' + (t.id === state.tpl ? 'selected' : '') + '" data-id="' + t.id + '" onclick="selectTpl(\'' + t.id + '\')">';
        html += '<div class="tpl-prev" style="' + getTplStyle(t.id) + '">' + t.icon + '</div>';
        html += '<div class="tpl-name">' + t.name + '</div></div>';
    }
    box.innerHTML = html;
}

function getTplStyle(id) {
    switch(id) {
        case 'business': return 'background:linear-gradient(135deg,#1e3a5f,#2d5a87);color:#fff';
        case 'creative': return 'background:linear-gradient(135deg,#667eea,#764ba2);color:#fff';
        case 'minimal': return 'background:#fff;color:#333;border:1px solid #eee';
        case 'tech': return 'background:linear-gradient(135deg,#0a0a0a,#1a1a2e);color:#00ff88';
        case 'academic': return 'background:#fff;color:#8b0000;border:1px solid #ddd';
        default: return 'background:#f1f5f9';
    }
}

function selectTpl(id) {
    state.tpl = id;
    var els = document.querySelectorAll('.tpl');
    for (var i = 0; i < els.length; i++) {
        els[i].classList.toggle('selected', els[i].getAttribute('data-id') === id);
    }
}

function setPrompt(t) {
    document.getElementById('promptInput').value = t;
}

function setPage(n, btn) {
    n = Math.max(3, Math.min(30, n));
    state.count = n;
    document.getElementById('pageInput').value = n;
    var btns = document.querySelectorAll('.page-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    if (btn) btn.classList.add('active');
}

// ===== Generate =====
function doGenerate() {
    var prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) {
        showToast('请输入PPT主题', 'err');
        return;
    }
    
    var pageInput = document.getElementById('pageInput');
    state.count = parseInt(pageInput.value) || 8;
    state.count = Math.max(3, Math.min(30, state.count));
    
    // Switch to progress
    document.getElementById('pageHome').classList.remove('active');
    document.getElementById('pageProgress').classList.add('show');
    document.getElementById('genBtn').disabled = true;
    
    // Steps
    var stepsHtml = '';
    var stepNames = ['分析主题', '生成内容', '准备页面', '完成'];
    var stepIcons = ['🧠', '📝', '🖼️', '✅'];
    for (var i = 0; i < 4; i++) {
        stepsHtml += '<div class="p-step" id="step' + i + '"><div class="p-ic">' + stepIcons[i] + '</div><div><div style="font-size:13px;font-weight:600">' + stepNames[i] + '</div></div></div>';
    }
    document.getElementById('stepsBox').innerHTML = stepsHtml;
    
    // Animate progress
    setProgress(5, '分析中...', '');
    setStep(0, 'active');
    
    setTimeout(function() {
        setStep(0, 'done');
        setStep(1, 'active');
        setProgress(30, '生成内容...', '智能组织内容结构');
        
        var sections = findTemplate(prompt);
        var contentCount = state.count - 2; // minus cover and ending
        var slides = [];
        
        // Cover
        slides.push({type:'cover', title:prompt, subtitle:'演示文稿', points:[], tpl:state.tpl});
        
        // Content slides
        for (var i = 0; i < contentCount; i++) {
            var sec = sections[i % sections.length];
            slides.push({
                type: 'content',
                title: sec.title,
                subtitle: '',
                points: sec.points.slice(0, 5),
                tpl: state.tpl
            });
        }
        
        // Ending
        slides.push({type:'ending', title:'感谢观看', subtitle:'Q&A 欢迎交流', points:[], tpl:state.tpl});
        
        setTimeout(function() {
            setStep(1, 'done');
            setStep(2, 'active');
            setProgress(70, '准备页面...', '渲染幻灯片');
            
            state.project = {
                title: prompt,
                slides: slides,
                tpl: state.tpl
            };
            
            setTimeout(function() {
                setStep(2, 'done');
                setStep(3, 'active');
                setProgress(100, '完成！', '');
                
                setTimeout(function() {
                    setStep(3, 'done');
                    showPreview();
                    document.getElementById('genBtn').disabled = false;
                    showToast('生成成功！', 'ok');
                }, 400);
            }, 400);
        }, 400);
    }, 400);
}

function setProgress(pct, status, detail) {
    document.getElementById('pctText').textContent = pct + '%';
    document.getElementById('statusText').textContent = status;
    document.getElementById('detailText').textContent = detail;
}

function setStep(idx, status) {
    for (var i = 0; i < 4; i++) {
        var el = document.getElementById('step' + i);
        el.classList.remove('active', 'done');
        if (i < idx || (i === idx && status === 'done')) {
            el.classList.add('done');
            el.querySelector('.p-ic').textContent = '✓';
        } else if (i === idx && status === 'active') {
            el.classList.add('active');
        }
    }
}

// ===== Preview =====
function showPreview() {
    document.getElementById('pageProgress').classList.remove('show');
    document.getElementById('pagePreview').classList.add('show');
    renderSlides();
    renderThumbs();
    updatePageInd();
    state.slideIdx = 0;
    document.getElementById('slidesWrap').style.transform = 'translateX(0)';
}

function renderSlides() {
    var p = state.project;
    var wrap = document.getElementById('slidesWrap');
    var html = '';
    var cls = 'slide-' + p.tpl;
    for (var i = 0; i < p.slides.length; i++) {
        var s = p.slides[i];
        var isCover = s.type === 'cover' || s.type === 'ending';
        html += '<div class="slide-page"><div class="slide ' + cls + '">';
        if (isCover) {
            html += '<div class="s-cover"><div class="s-title">' + escapeHtml(s.title) + '</div>';
            if (s.subtitle) html += '<div class="s-sub">' + escapeHtml(s.subtitle) + '</div>';
            html += '</div>';
        } else {
            html += '<div class="s-side"></div><div class="s-content">';
            html += '<div class="s-title">' + escapeHtml(s.title) + '</div>';
            if (s.points && s.points.length) {
                html += '<ul class="s-points">';
                for (var j = 0; j < s.points.length; j++) {
                    html += '<li>' + escapeHtml(s.points[j]) + '</li>';
                }
                html += '</ul>';
            }
            html += '</div>';
        }
        html += '<div class="s-footer"><span>' + escapeHtml(p.title.substring(0,12)) + '</span><span>' + (i+1) + '/' + p.slides.length + '</span></div>';
        html += '</div></div>';
    }
    wrap.innerHTML = html;
    
    // Touch swipe
    var startX = 0;
    var area = document.querySelector('.slides-area');
    area.ontouchstart = function(e) { startX = e.touches[0].clientX; };
    area.ontouchend = function(e) {
        var dx = startX - e.changedTouches[0].clientX;
        if (Math.abs(dx) > 40) {
            if (dx > 0 && state.slideIdx < p.slides.length - 1) goSlide(state.slideIdx + 1);
            else if (dx < 0 && state.slideIdx > 0) goSlide(state.slideIdx - 1);
        }
    };
}

function renderThumbs() {
    var p = state.project;
    var box = document.getElementById('thumbsBox');
    var html = '';
    for (var i = 0; i < p.slides.length; i++) {
        html += '<div class="thumb ' + (i === 0 ? 'active' : '') + '" onclick="goSlide(' + i + ')">' + (i+1) + '</div>';
    }
    box.innerHTML = html;
}

function goSlide(idx) {
    state.slideIdx = idx;
    document.getElementById('slidesWrap').style.transform = 'translateX(-' + idx*100 + '%)';
    var thumbs = document.querySelectorAll('.thumb');
    for (var i = 0; i < thumbs.length; i++) {
        thumbs[i].classList.toggle('active', i === idx);
    }
    updatePageInd();
}

function updatePageInd() {
    var p = state.project;
    document.getElementById('pageIndicator').textContent = (state.slideIdx+1) + '/' + p.slides.length;
    document.getElementById('prevTitle').textContent = p.title.length > 14 ? p.title.substring(0,14)+'...' : p.title;
}

function goHome() {
    closeEdit();
    document.getElementById('pagePreview').classList.remove('show');
    document.getElementById('pageProgress').classList.remove('show');
    document.getElementById('pageHome').classList.add('active');
}

// ===== Edit =====
function openEdit() {
    var p = state.project;
    var body = document.getElementById('editBody');
    var html = '';
    for (var i = 0; i < p.slides.length; i++) {
        var s = p.slides[i];
        var label = s.type === 'cover' ? '封面' : (s.type === 'ending' ? '结尾' : '第' + i + '页');
        html += '<div class="edit-slide"><div class="edit-label">' + label + '</div>';
        html += '<div class="edit-field"><label>标题</label><input data-slide="' + i + '" data-field="title" value="' + escapeAttr(s.title) + '"></div>';
        if (s.subtitle !== undefined) {
            html += '<div class="edit-field"><label>副标题</label><input data-slide="' + i + '" data-field="subtitle" value="' + escapeAttr(s.subtitle || '') + '"></div>';
        }
        if (s.points) {
            html += '<div class="edit-field"><label>内容要点</label><div id="pts' + i + '">';
            for (var j = 0; j < s.points.length; j++) {
                html += '<div class="point-row"><input data-slide="' + i + '" data-point="' + j + '" value="' + escapeAttr(s.points[j]) + '"><button class="point-del" onclick="removePoint(' + i + ',' + j + ')">×</button></div>';
            }
            html += '</div><button class="add-point" onclick="addPoint(' + i + ')">+ 添加要点</button></div>';
        }
        html += '</div>';
    }
    body.innerHTML = html;
    document.getElementById('editPanel').classList.add('show');
}

function closeEdit() {
    document.getElementById('editPanel').classList.remove('show');
}

function addPoint(si) {
    if (state.project.slides[si].points.length < 8) {
        state.project.slides[si].points.push('新要点');
        openEdit();
    }
}

function removePoint(si, pi) {
    state.project.slides[si].points.splice(pi, 1);
    openEdit();
}

function saveEdit() {
    var inputs = document.querySelectorAll('#editBody input');
    for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        var si = parseInt(inp.getAttribute('data-slide'));
        var f = inp.getAttribute('data-field');
        var pi = inp.getAttribute('data-point');
        if (pi !== null && pi !== undefined) {
            state.project.slides[si].points[parseInt(pi)] = inp.value;
        } else if (f === 'title') {
            state.project.slides[si].title = inp.value;
            if (si === 0) state.project.title = inp.value;
        } else if (f === 'subtitle') {
            state.project.slides[si].subtitle = inp.value;
        }
    }
    closeEdit();
    renderSlides();
    renderThumbs();
    showToast('已保存', 'ok');
}

// ===== Download =====
function downloadPPTX() {
    if (!state.project) return;
    showToast('生成PPTX中...');
    
    try {
        var pptx = new PptxGenJS();
        var p = state.project;
        pptx.layout = 'LAYOUT_WIDE';
        pptx.title = p.title;
        
        var colors = {
            business: {primary:'1E3A5F', text:'FFFFFF', bg:'1E3A5F'},
            creative: {primary:'667EEA', text:'FFFFFF', bg:'667EEA'},
            minimal: {primary:'333333', text:'333333', bg:'FFFFFF'},
            tech: {primary:'00FF88', text:'00FF88', bg:'0A0A0A'},
            academic: {primary:'8B0000', text:'333333', bg:'FFFFFF'}
        };
        var c = colors[p.tpl] || colors.business;
        var fn = p.title.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '_').substring(0, 40) + '.pptx';
        
        for (var idx = 0; idx < p.slides.length; idx++) {
            var s = p.slides[idx];
            var slide = pptx.addSlide();
            slide.background = {color: c.bg};
            
            if (s.type === 'cover' || s.type === 'ending') {
                slide.addShape(pptx.ShapeType.rect, {x:0,y:0,w:10,h:5.625,fill:{color:c.primary},line:{color:c.primary}});
                slide.addText(s.title, {
                    x:0.5, y:2.0, w:9.0, h:1.2,
                    fontSize: Math.min(36, Math.max(20, 36 - Math.floor(s.title.length/8))),
                    bold:true, color:c.text, align:'center', valign:'middle'
                });
                if (s.subtitle) {
                    slide.addText(s.subtitle, {
                        x:0.5, y:3.4, w:9.0, h:0.5, fontSize:14, color:c.text, align:'center', transparency:20
                    });
                }
            } else {
                slide.addShape(pptx.ShapeType.rect, {x:0,y:0,w:3.5,h:5.625,fill:{color:c.primary,transparency:10},line:{color:c.primary,transparency:100}});
                var titleColor = p.tpl === 'academic' ? c.primary : c.text;
                slide.addText(s.title, {
                    x:0.5, y:0.4, w:9.0, h:0.7,
                    fontSize: Math.min(24, Math.max(16, 24 - Math.floor(s.title.length/10))),
                    bold:true, color:titleColor, valign:'middle'
                });
                var pts = (s.points || []).slice(0, 6);
                var fz = pts.length > 4 ? 11 : 15;
                var lh = pts.length > 4 ? 0.6 : 0.78;
                for (var pi = 0; pi < pts.length; pi++) {
                    var y = 1.1 + pi * lh;
                    if (y + lh <= 5.0) {
                        slide.addText(pts[pi], {x:0.7, y:y, w:8.8, h:lh-0.05, fontSize:fz, color:c.text, valign:'top', bullet:{indent:10}});
                    }
                }
            }
            slide.addText((idx+1) + ' / ' + p.slides.length, {x:8.2,y:5.2,w:1.5,h:0.3,fontSize:8,color:c.text,align:'right',transparency:50});
        }
        
        pptx.writeFile({fileName: fn});
        showToast('已下载: ' + fn, 'ok');
    } catch(e) {
        showToast('导出失败: ' + e.message, 'err');
    }
}

// ===== Utils =====
function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;');
}

function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    setTimeout(function(){t.classList.add('show');}, 10);
    setTimeout(function(){t.classList.remove('show');}, 2500);
}

function showModal(title, text, cb) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modal').classList.add('show');
    document.getElementById('modalOk').onclick = function() {
        closeModal();
        if (cb) cb();
    };
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

// Page input handler
document.addEventListener('DOMContentLoaded', function() {
    init();
    document.getElementById('pageInput').oninput = function() {
        var v = parseInt(this.value) || 3;
        v = Math.max(3, Math.min(30, v));
        state.count = v;
        var btns = document.querySelectorAll('.page-btn');
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    };
});

// Run init immediately
init();
</script>
