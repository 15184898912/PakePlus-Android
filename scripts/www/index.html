",{cx:"8",cy:"10",r:"1.5",fill:"#2dd4bf"}),l("path",{d:"M3 16l5-4 4 3 4-5 5 6",fill:"none",stroke:"#2dd4bf","stroke-width":"1.5","stroke-linejoin":"round"})],-1),l("span",{class:"option-label"},"从相册选择",-1),l("span",{class:"option-hint"},"选择已有视频或照片",-1)])])])])])):fe("",!0)]),_:1})]))}}),Pw=dt(Rw,[["__scopeId","data-v-f092957f"]]),Lw=Object.freeze(Object.defineProperty({__proto__:null,default:Pw},Symbol.toStringTag,{value:"Module"})),Hi=[{id:"persona_1",category:"persona",name:"自我介绍模板",content:"我是在邯郸开湘菜馆的90后老板娘，从一个人到一个小团队，从路边摊到正经门店，走了不少弯路也吃了不少苦头。很多人问我一个女孩子为什么要这么拼？因为我想靠自己的双手闯出一片天，不想依附任何人。每天凌晨五点起来备菜，晚上十一点收档对账，虽然累但心里踏实。关注我，带你看看一个真实的餐饮创业故事。",industryId:"catering",builtin:!0},{id:"persona_2",category:"persona",name:"努力拍视频",content:"大家好，我是邯郸乡野土湘菜的老板，很多人说我一个开饭馆的天天拍视频不务正业。但我想说，这个时代不拍视频才是不务正业！酒香也怕巷子深，我不拍谁知道我的菜好吃？白天营业额能养活一家老小，晚上剪视频就是我的第二条路。不懂就学不会就问，感谢每一个刷到我并支持我的你。",industryId:"catering",builtin:!0},{id:"persona_3",category:"persona",name:"突出认真经营",content:"忙的时候抓服务，闲的时候控卫生，这是我做餐饮的铁律。很多人觉得开饭馆就是炒菜上菜那么简单，背后的付出你看不到。每天检查食材新鲜度，监督后厨卫生标准，培训服务员态度细节，一桩桩一件件都是良心活。做餐饮就是做人品，你把细节做到位了口碑自然就来，回头客自然就多。",industryId:"catering",builtin:!0},{id:"persona_4",category:"persona",name:"真诚笨拙人设",content:"在邯郸还有不认识我的吗？有的话那你一定要来我店里坐坐。我嘴笨不会说漂亮话，但我会把每一道菜用心做好。别人靠营销套路，我靠口碑相传，一桌客人吃了满意带朋友来，这就是我最大的成就感。我不聪明，但我够真诚，够实在，够努力。开店这些年，靠的就是回头客，这就是我的底气。",industryId:"catering",builtin:!0},{id:"persona_5",category:"persona",name:"做生意理念",content:"做生意就得学会三不、三让和三赢。三不：不欺客、不偷工、不减料。三让：让利给顾客、让步给员工、让时间给品质。三赢：顾客吃得满意赢口碑，员工干得开心赢人心，自己赚得安心赢未来。这就是我在邯郸开湘菜馆十年悟出来的道理，没有捷径，只有真心换真心，分享给每一个创业者共勉。",industryId:"catering",builtin:!0},{id:"persona_6",category:"persona",name:"人设1-感恩顾客",content:"今天店里来了一对老夫妻，从开业第一天就吃到现在，三年了风雨无阻。老太太说就爱吃我家的剁椒鱼头，每次来必点。听到这话我眼眶都红了，做餐饮最大的幸福不是赚了多少钱，而是有人记得你的味道，把你的店当成家的延伸。谢谢每一位老顾客，你们就是我坚持下去最大的动力。",industryId:"general",builtin:!0},{id:"persona_7",category:"persona",name:"人设2-创业辛酸",content:"创业第三年，我才敢说自己稍微站稳了脚跟。第一年亏了十几万，第二年勉强保本，第三年才开始有点利润。最难的时候信用卡刷爆，房租交不起，差点关门走人。但我不甘心，咬着牙挺过来了。回头看看，那些最难的日子反而让我成长最快。创业没有容易二字，但只要你撑下去，总能看到光。",industryId:"general",builtin:!0},{id:"persona_8",category:"persona",name:"人设3-夫妻创业",content:"我跟我老公是从一个六平米的小档口开始的，他炒菜我收银，他进货我洗菜。创业前两年我们几乎没红过脸，因为忙得连吵架的时间都没有。有人说夫妻创业容易伤感情，但我觉得恰恰相反，一起扛过来的苦会让你们更懂彼此。现在店大了人多了，但我们还是那个六平米档口的默契搭档，这就是我们的故事。",industryId:"general",builtin:!0},{id:"persona_9",category:"persona",name:"人设4-坚持品质",content:"有人说我家的菜贵了点，但我不打算降品质来降价格。辣椒必须是湖南运过来的，鱼必须是当天活杀的，油绝不用二次油。这些成本省不下来，也不应该省。做餐饮赚的是良心钱，你省的那点成本，最后都会从口碑里扣出来。我宁愿少赚一点，也要让顾客吃到最好的味道，这是我的坚持也是我的底线。",industryId:"catering",builtin:!0},{id:"persona_10",category:"persona",name:"人设5-回馈员工",content:"今年我店里的员工有八个是从农村出来的，最小的才十九岁。我从不把他们当打工人，而是当家人。包吃包住、按时发薪、过年有红包、生日有蛋糕。有人说我太大方了，但我觉得他们把青春交给了我，我就该对他们负责。做餐饮不只是做生意，更是在经营人心，你对员工好，员工自然会对顾客好。",industryId:"general",builtin:!0},{id:"persona_11",category:"persona",name:"人设6-老板娘日常",content:"凌晨五点半，我已经在菜市场挑菜了。别人问我为什么不去超市配送，因为菜市场的东西更新鲜更便宜，我亲手挑的才放心。六点半到店开始备料，七点半员工上班一起干活，十一点开档接客，晚上九点收档打扫，十一点对完账才能躺下。这就是一个餐饮老板娘的日常，日复一日，但每一天都值得。",industryId:"catering",builtin:!0},{id:"persona_12",category:"persona",name:"人设7-从零开始",content:"四年前我还是个朝九晚五的上班族，月薪五千，安稳但看不到未来。辞职开店那天全家都反对，说我一个女孩子折腾什么。但我不想三十岁就看到六十岁的样子，我想给自己一个机会。从不会炒菜到现在的招牌厨师，从不懂经营到月流水十几万，这一路全是硬扛过来的。人生没有白走的路，每一步都算数。",industryId:"general",builtin:!0},{id:"persona_13",category:"persona",name:"人设8-不忘初心",content:"店越做越大，人越来越多，但我永远记得第一天开门时的紧张和期待。那时候只有四张桌子，我一个人又当厨师又当服务员。第一桌客人吃完说好吃的时候，我在后厨偷偷笑了好久。现在一百多桌了，但那份紧张和期待一直都在。不管走多远，别忘了当初为什么出发，这是我一直提醒自己的话。",industryId:"general",builtin:!0},{id:"persona_14",category:"persona",name:"人设9-用心选材",content:"今天凌晨四点我就出发去批发市场了，因为最新鲜的食材都是一大早就到货的。每个辣椒我都要看颜色闻味道，每条鱼我都要看眼睛看鳃色。有人说至于吗？我说至于，因为差一点的食材做出来的菜就是差一点的味道。做餐饮没有差不多，只有最好和不够好。你对食材用心，顾客的舌头会告诉你答案。",industryId:"catering",builtin:!0},{id:"persona_15",category:"persona",name:"人设10-团队管理",content:"带团队这些年我最大的感悟就是：管人先管心。工资按时发是最基本的，更重要的是让每个人有归属感。后厨大哥家孩子上学我帮忙联系学校，前厅小妹生病了我亲自带她去医院。有人说你这是当老板还是当妈？我说都是。你把员工当家人，他们自然把店当家。团队稳了，生意才能稳，这是铁律。",industryId:"general",builtin:!0},{id:"persona_16",category:"persona",name:"人设11-应对差评",content:"昨天收到一个差评说菜太咸了，我没有生气也没有删评，而是亲自打电话过去道歉，请他下次来免费送一道菜。有人说差评影响生意，但我觉得差评是最好的老师。确实咸了我下次就少放盐，服务慢了我下次就加人手。每一个差评都是改进的机会，你认真对待了，差评反而能变成好评，变成忠实顾客。",industryId:"catering",builtin:!0},{id:"persona_17",category:"persona",name:"人设12-节假日坚守",content:"又是一个春节不能回家，这已经是第四年了。除夕夜店里坐满了来吃饭的一家家，他们团圆了，我却在灶台前忙碌。说不想家是假的，但看到顾客满意的笑脸，我觉得一切都值了。做餐饮就是这样，别人放假你最忙，别人团圆你守店。但我不后悔，因为这家店就是我的家，这些顾客就是我的家人。",industryId:"general",builtin:!0},{id:"persona_18",category:"persona",name:"人设13-老顾客故事",content:"有个大叔每周三固定来吃一次小炒肉，雷打不动坚持了两年。后来才知道他老伴生前最爱吃这道菜，老伴走了以后他每周来一次，就为了那个味道。那天我在后厨哭了很久。做餐饮有时候不只是卖饭，你卖的可能是某个人的一段记忆、一份念想。这也让我更加坚定要把每道菜做好，因为你永远不知道这道菜对谁意味着什么。",industryId:"catering",builtin:!0},{id:"persona_19",category:"persona",name:"人设14-传递正能量",content:"经常有年轻人私信问我创业好不好，我的回答是：好，但要做好吃苦的准备。不要看别人赚钱了就冲动，创业九死一生不是说着玩的。但如果你真的想好了，就放手去做，年轻最大的资本就是输得起。失败了爬起来，跌倒了接着走。人生没有白吃的苦，你今天流的汗，都会变成明天的光。加油，每一个追梦人。",industryId:"general",builtin:!0},{id:"persona_20",category:"persona",name:"人设15-老板娘心里话",content:"有时候夜深了一个人坐在店里，看着空荡荡的桌椅，也会觉得孤独。朋友圈里别人旅游度假，我在备菜对账；别人周末休息，我在想新菜品。说不羡慕是假的，但我不后悔。因为这家店是我一砖一瓦搭起来的，每个角落都有我的心血。这就是我选择的路，再苦再累我都会走下去，因为这是我自己的人生。",industryId:"general",builtin:!0},{id:"persona_21",category:"persona",name:"人设16-做餐饮的骄傲",content:"有人看不起做餐饮的，觉得就是炒菜端盘子。但我想说，民以食为天，餐饮是最踏实的行业。你用双手创造美味，用真心服务顾客，赚的是干干净净的钱。我不觉得比谁低一等，反而觉得很骄傲。每一道端上桌的菜都是我的作品，每一个满意的顾客都是我的勋章。做餐饮，我骄傲，我自豪。",industryId:"catering",builtin:!0},{id:"persona_22",category:"persona",name:"人设17-小店大梦想",content:"我的店不大，一百来平米，但我有个大梦想：让全邯郸都知道我家的湘菜。有人说你一个路边小店还想怎样？我说路是一步步走的，从小到大从弱到强。今天一百平米，明年也许两百，后年也许开分店。梦想不怕大，就怕你不敢想不敢做。我不跟别人比，我只跟昨天的自己比，每天进步一点点就够了。",industryId:"general",builtin:!0},{id:"persona_23",category:"persona",name:"人设18-日复一日的坚持",content:"有人问我怎么坚持每天拍视频的？其实我也有想放弃的时候。剪辑到凌晨两点，播放量只有几十，也会怀疑值不值得。但第二天看到一条评论说老板娘加油，我又满血复活了。坚持不是不累，而是累了还能继续。日复一日看似平凡，但所有的不平凡都是平凡坚持出来的。送给每一个还在坚持的你：再撑一下。",industryId:"general",builtin:!0},{id:"persona_24",category:"persona",name:"人设19-感谢同行",content:"昨天隔壁店的老板娘给我送了一碗她自己炖的汤，说看我天天忙辛苦了。同行不是冤家，是战友。这条街上的每一家店都不容易，大家互相搭把手才能把这条街做旺。我经常跟隔壁店分享客源，他们有好食材也分我一些。做生意格局要大，心胸要宽，你帮别人其实也是在帮自己。感谢每一位同行的陪伴和支持。",industryId:"general",builtin:!0},{id:"traffic_1",category:"traffic",name:"流量1-门店获客",content:"为什么你的店没人来？因为你不做宣传！现在不是等着顾客上门的时代了，你不开口没人知道你有什么好。发视频、发朋友圈、搞活动，样样都不能少。别嫌麻烦，你嫌麻烦的时候你的同行已经把你的客人都抢走了。做生意记住一句话：主动出击才有机会，被动等待只能关门。",industryId:"general",builtin:!0},{id:"traffic_2",category:"traffic",name:"流量2-开始拍视频",content:"做短视频最重要的一步是什么？不是设备不是剪辑，是开始！很多人想了一万遍也没按下录制键。别等准备好了再开始，因为你永远准备不好。拿起手机拍下你的第一条视频，哪怕粗糙哪怕不好，那也是你的第一步。所有的大号都是从零播放开始的，你缺的不是技术是勇气。",industryId:"general",builtin:!0},{id:"traffic_3",category:"traffic",name:"流量3-坚持的意义",content:"我见过太多创业者死在了黎明前。开店三个月没生意就放弃，拍视频一个月没流量就停更。但你知不知道，大多数成功都是在坚持了半年以后才看到的。前三个月是扎根期，四到六个月是生长期，半年以后才是收获期。你连根都没扎稳就想摘果子？再坚持一下，也许明天就火了。",industryId:"general",builtin:!0},{id:"traffic_4",category:"traffic",name:"流量4-超出预期",content:"教你一招让顾客主动帮你宣传的方法：超出预期。顾客花一百块预期吃一百块的菜，你给他一百二的品质和体验，他自然觉得值，自然愿意帮你推荐。营销技巧再多不如让顾客真心觉得好。口碑传播的力量比任何广告都强，一桌满意的客人能帮你带来十桌新客。把每一桌都当成最后一桌来做就对了。",industryId:"general",builtin:!0},{id:"traffic_5",category:"traffic",name:"流量5-细节决定成败",content:"为什么有的店天天排队有的店门可罗雀？差距就在细节。门头亮不亮、地面干不干净、服务员笑不笑、上菜快不快、菜品稳不稳，每一个细节都是加分项也是扣分项。顾客不傻，你用不用心他们一进门就感觉到了。别总想着搞大动作，先把细节做到位，生意自然会好起来。",industryId:"general",builtin:!0},{id:"traffic_6",category:"traffic",name:"流量6-打败拖延症",content:"创业最大的敌人不是竞争对手，是你自己的拖延症。今天的事拖到明天，这周的计划拖到下周，想着想着一年就过去了。我每天给自己列三件必须完成的事，不做完不睡觉。就是这股劲让我的店从零做到了现在。别再等明天了，明天还有明天的事，今天能做的现在就做，这就是我跟别人的差距。",industryId:"general",builtin:!0},{id:"traffic_7",category:"traffic",name:"流量7-短视频获客三要点",content:"很多老板问我怎么用短视频获客？记住三个要点：第一内容要真实，别装别演，顾客看得出来；第二更新要稳定，三天打鱼两天晒网等于没做；第三互动要及时，每条评论都回复，每个私信都认真看。做到这三点坚持三个月，你一定能看到效果。不是方法难，是坚持难。",industryId:"general",builtin:!0},{id:"traffic_8",category:"traffic",name:"流量8-信任是本质",content:"做生意的本质是什么？是信任。顾客为什么选你不选别人？因为信你。信任怎么建立？靠每一次真诚的服务，靠每一个靠谱的产品，靠日复一日的口碑积累。别想着走捷径，捷径走多了路就歪了。踏踏实实做人，认认真真做事，信任自然会来，生意自然会长。这就是最笨也最有效的方法。",industryId:"general",builtin:!0},{id:"traffic_9",category:"traffic",name:"流量9-与时俱进",content:"告诉你一个残酷的真相：不是生意难做了，是你的生意方式过时了。十年前开个店等人来就行，现在你不主动出击就会被淘汰。学短视频、学私域、学社群运营，这些都是新时代老板的必修课。不要觉得学不会，只要你想学就没有学不会的。时代在变你要跟着变，不变就只能被淘汰。",industryId:"general",builtin:!0},{id:"traffic_10",category:"traffic",name:"流量10-私域加短视频",content:"今天分享一个让门店营业额翻倍的方法：私域加短视频。短视频负责引流获客，私域负责复购留存。拍视频把人吸引到店里，加微信把人沉淀到私域，定期发朋友圈做活动激活复购。这两套组合拳打好了，你的生意就有了稳定的客流基础。不是方法多高深，是你还没开始做而已。",industryId:"general",builtin:!0},{id:"traffic_11",category:"traffic",name:"流量11-消费者更难",content:"你觉得你卖货很难，其实消费者更难，网上的东西看不见摸不着，人家凭什么信你？凭你的真诚，凭你的品质，凭你的售后。我做生意从来不靠忽悠，靠的是回头客一单接一单。你把客户当家人，客户才会把你当朋友，生意才能长久。别总想着赚快钱，慢就是快，稳就是赢。",industryId:"general",builtin:!0},{id:"traffic_12",category:"traffic",name:"流量12-性价比三原则",content:"第一条：性价比比的是品质、服务、售后，不是比谁便宜。第二条：信誉比的是诚信、担当、靠谱，不是比谁会吹。第三条：做人比的是格局、人品、良心，不是比谁精明。做生意先做人，这三条你做到了，客户自然跟着你走。别本末倒置了，产品不行服务不行，再便宜也没人要。",industryId:"general",builtin:!0},{id:"traffic_13",category:"traffic",name:"流量13-不忽悠不欺骗",content:"我不想忽悠顾客，更不想欺骗客户，因为他们信任我才找我下单。每一单我都当做第一单来做，每一次我都当做最后一次来对待。宁可少赚一点也要让顾客满意，赚该赚的钱睡安稳的觉，这就是我做生意的底线。你坑客户一次，客户记你一辈子，值得吗？",industryId:"general",builtin:!0},{id:"traffic_14",category:"traffic",name:"流量14-不断宣传自己",content:"我每天的工作就是不断地宣传自己，曾经有人说天天发朋友圈发视频烦不烦？我说不烦，因为我不发你根本不知道我在做什么。这个时代不缺好产品，缺的是被看见的机会。我不是在刷存在感，我是在告诉你我一直都在，靠谱地做着每一单生意。你不发声就等于不存在。",industryId:"general",builtin:!0},{id:"traffic_15",category:"traffic",name:"流量15-视频拍火富婆",content:"只要视频拍得火，下个富婆就是我，管他作品优不优秀先发了再说！开玩笑的，其实我拍视频不是为了火，是为了让更多人看到我的产品。流量时代酒香也怕巷子深，我不一定能成为富婆，但我一定能让我的生意越来越好。关注我，见证一个小老板娘的逆袭之路，一起加油！",industryId:"general",builtin:!0},{id:"traffic_16",category:"traffic",name:"流量16-不善言辞却抛头露面",content:"我本不善言辞，却要在抖音抛头露面，我不懂运营，却要天天想文案拍视频。为什么？因为生活没有退路，创业没有捷径。每一个视频背后都是我加班到深夜的努力，每一次出镜都是我鼓起勇气的突破。我不是最优秀的，但我一定是最真实的，也是最努力的。笨鸟先飞，勤能补拙，我相信时间会给我答案。",industryId:"general",builtin:!0},{id:"traffic_17",category:"traffic",name:"流量17-年龄不是借口",content:"二十岁的狂，三十岁的傲，四十岁做啥都嫌早。其实创业不分年龄，拼搏不看阶段。二十岁有二十岁的冲劲，三十岁有三十岁的稳重，四十岁有四十岁的沉淀。只要你敢开始，什么时候都不晚。别让年龄成为你的借口，让它成为你的资本。人生最好的种树时间是十年前，其次是现在。",industryId:"general",builtin:!0},{id:"traffic_18",category:"traffic",name:"流量18-没有好走的路",content:"任何一个行业，从来都没有好走的路，唯有坚持才能看到曙光。刚开店的头三个月我几乎天天亏钱，差点就放弃了。但我想别人能坚持我为什么不能？咬牙撑过来，现在回头看看，那些最难的日子反而让我成长最快。送给每一个正在坚持的创业者：再撑一下，天就亮了，黎明前的黑暗最难熬但也最接近光明。",industryId:"general",builtin:!0},{id:"traffic_19",category:"traffic",name:"流量19-被逼成超人",content:"有人说我是超人，可是我心里清楚，我只是个普通人被生活逼到了没有退路。白天开店做生意，晚上剪视频想文案，凌晨对账盘库存。不是不想休息，是不敢停。每一个看起来光鲜的背后，都是你看不到的咬牙坚持。致敬每一个努力生活的普通人，我们都是自己的超人，都在用力活着。",industryId:"general",builtin:!0},{id:"traffic_20",category:"traffic",name:"流量20-不是富家女",content:"本就不是富家女，何来吃苦这一说，粗活累活我从小干到大。开饭馆后更是什么都自己来，搬货洗菜搞卫生，哪有什么老板娘的架子。别人笑我太拼，我说习惯了就不觉得苦。靠自己双手赚来的每一分钱都踏实，这种底气是任何人都给不了的。没有伞的孩子必须努力奔跑，我就是那个没有伞的人。",industryId:"general",builtin:!0},{id:"traffic_21",category:"traffic",name:"流量21-别怨大环境",content:"别总说大环境不好，大环境再不好也有人赚钱，大环境再好也有人亏钱。关键不在环境在你自己。你有本事什么环境都能活，你没本事什么环境都白搭。与其抱怨大环境不如提升你自己，多学一项技能多一条出路多一份收入。改变不了环境就改变自己，这才是聪明的活法。",industryId:"general",builtin:!0},{id:"traffic_22",category:"traffic",name:"流量22-先完成再完美",content:"做短视频记住一句话：先完成再完美。很多人第一条视频拍了删删了拍，发了三个月还没发出去。你又不是拍电影，差不多就发！第一条烂没关系，第十条会好一点，第一百条就好了。所有的大V第一条视频都很烂，区别在于他们发了你没发。先发出去再优化，这才是正确姿势。",industryId:"general",builtin:!0},{id:"traffic_23",category:"traffic",name:"流量23-创业心态",content:"什么是好的创业心态？就是接受最坏的结果，争取最好的可能。开店前先想好亏了怎么办，能承受多大的亏损，想清楚了再干。不是悲观是理性。最坏的都想好了干起来就没那么怕了。然后全力以赴去拼最好的结果。创业不是赌博，是有准备的冒险，想清楚再上路才能走得稳走得远。",industryId:"general",builtin:!0},{id:"traffic_24",category:"traffic",name:"流量24-内容是活出来的",content:"今天有个同行问我：你怎么做到每天都有内容拍的？我说内容不是想出来的，是活出来的。你每天开店遇到的人、做的事、解决的问题全是素材。顾客的反馈、菜品的改良、员工的成长，哪一个不是故事？别坐那硬想文案了，拿起手机记录你的日常，真实的内容最打动人，生活就是最好的编剧。",industryId:"general",builtin:!0},{id:"traffic_25",category:"traffic",name:"流量25-别发纯广告",content:"为什么你的短视频没流量？因为你发的都是广告。顾客刷短视频是为了放松不是看你打广告的。百分之八十的内容要有价值、有趣、有共鸣，百分之二十才是推广。先让顾客喜欢你这个人，再让顾客买你的产品。人设做起来了卖什么都好卖。记住：先做朋友再做生意，先提供价值再索取回报。",industryId:"general",builtin:!0},{id:"traffic_26",category:"traffic",name:"流量26-前三秒定生死",content:"教你一招短视频开场白：别废话直接上干货。前三秒决定生死，顾客没耐心听你铺垫。直接说痛点、给方案、抛悬念，让人忍不住看下去。比如：别再这样炒菜了，难怪没人来吃！然后讲正确方法。这就是钩子，钩住了观众你就赢了。短视频时代前三秒就是一切，抓住它你就成功了一半。",industryId:"general",builtin:!0},{id:"traffic_27",category:"traffic",name:"流量27-别自满",content:"做生意最怕什么？怕自满。生意好了就觉得稳了，不创新了不努力了，然后慢慢被淘汰。市场在变顾客在变，你不变就等着关门。我每个月都逼自己学一样新东西，新菜品、新营销、新管理方法。保持饥饿感保持学习力，你的生意才能长青。记住：今天的成功是明天最低的要求。",industryId:"general",builtin:!0},{id:"traffic_28",category:"traffic",name:"流量28-员工是招牌",content:"告诉老板们一个秘密：你的员工就是你最好的招牌。服务员笑脸迎人，顾客心情就好；厨师用心做菜，顾客吃得就满意。你对员工好，员工就对顾客好，顾客就对钱包好。这是一条链源头在你。别总抱怨员工不用心，先问问自己用心了没有。带团队就是带人心，人心齐了什么事都好办。",industryId:"general",builtin:!0},{id:"traffic_29",category:"traffic",name:"流量29-内容没好别投流",content:"很多人问我短视频要不要投流？我的建议是：内容没做好之前别投。投流是放大器，内容好投了锦上添花，内容差投了就是烧钱。先把内容打磨好，自然流量能跑起来了，再考虑投流放大。顺序别搞反了，否则钱花了效果没有还打击信心。磨刀不误砍柴工，先把内容这把刀磨快了再说。",industryId:"general",builtin:!0},{id:"traffic_30",category:"traffic",name:"流量30-餐饮三句话",content:"做餐饮有三句话一定要记住：味道是根本，服务是加分，卫生是底线。味道不好一切白搭，服务好能挽回口碑，卫生差一票否决。这三条哪条出了问题都是致命的。每天开门前先问自己三个问题：今天的菜稳不稳？服务到不到位？卫生合不合格？三个都过关了再开门迎客，这是对顾客负责也是对自己负责。",industryId:"catering",builtin:!0},{id:"traffic_31",category:"traffic",name:"流量31-老板该忙什么",content:"为什么有的老板看起来很闲但生意很好？因为他们把时间花在了重要的事上。选品、定价、培训、营销，这些才是老板该干的事。如果你天天在后厨炒菜、前厅端盘子，那你不是老板你是员工。老板的价值在于思考和决策，不是埋头苦干。学会放权学会管理，你才能从忙到闲，从闲到赚。",industryId:"general",builtin:!0},{id:"traffic_32",category:"traffic",name:"流量32-异业合作",content:"今天教大家一个引流小妙招：异业合作。我旁边的理发店老板跟我合作，来我店吃饭的送理发优惠券，来理发店的送我店菜品券。互相引流成本几乎为零，效果却出奇的好。一条街上的店不要各自为战，联合起来才能做大蛋糕。思路打开处处是机会，做生意不能只会埋头干还要会抬头看路。",industryId:"general",builtin:!0},{id:"traffic_33",category:"traffic",name:"流量33-别什么都拍",content:"做短视频最容易犯的一个错：什么都想拍。今天拍菜品明天拍门头后天拍自己，没有主线没有定位。顾客关注你是因为某个点，你要把那个点打透。我定位就是湘菜老板娘的日常，所有内容都围绕这个展开。一个定位做一年你就能在这个领域站稳。什么都拍等于什么都没拍，专注才是力量。",industryId:"general",builtin:!0},{id:"traffic_34",category:"traffic",name:"流量34-别等有钱了",content:"创业路上最大的谎言就是：等我有钱了就怎样怎样。有钱了才做的事情永远做不成。我开店的时候没钱，借钱装修赊账进货照样开起来了。有钱是结果不是前提，你不能等条件完美了再行动，条件永远不会完美。有多少钱办多大事，先干起来再说，在行动中解决问题才是正道。",industryId:"general",builtin:!0},{id:"traffic_35",category:"traffic",name:"流量35-投诉三步走",content:"顾客投诉的时候怎么办？三步走：第一先道歉别解释，第二马上解决别拖延，第三送点小礼物别空手。顾客投诉不是找茬，是给你机会改正。你处理好了他比没投诉的顾客还忠诚，处理不好他不仅不来还会劝别人别来。投诉是金，处理好了就是金矿，处理不好就是地雷，看你怎么办。",industryId:"general",builtin:!0},{id:"traffic_36",category:"traffic",name:"流量36-定价策略",content:"今天聊聊定价策略。很多人定价就是看别人多少自己就多少，这不对。定价要看三样：成本、价值、定位。成本是底线，价值是上限，定位决定你卖什么价。同样是碗面，路边摊卖十块，商场里卖三十，不是因为面不一样，是因为定位不一样。先把定位想清楚价格自然就有了，别盲目跟风定价。",industryId:"general",builtin:!0},{id:"traffic_37",category:"traffic",name:"流量37-别买设备",content:"做短视频要不要买设备？新手别买！手机完全够用。我前一百条视频全是手机拍的，照样有几十万播放。设备不是关键内容才是。你花几千块买设备不如花几百块学剪辑学文案。等你有感觉了有需求了再升级设备也不迟。别陷入设备党的陷阱，记住：最好的设备就是你现在手里的手机。",industryId:"general",builtin:!0},{id:"traffic_38",category:"traffic",name:"流量38-朋友圈怎么发",content:"为什么你的朋友圈没人看？因为你发的全是广告。顾客屏蔽你不是因为不需要你的产品，是因为不想看广告。试试这样发：百分之七十生活加干货，百分之二十顾客反馈，百分之十产品推广。让朋友圈有温度有内容有共鸣，顾客才愿意看。朋友圈不是广告牌是你的个人秀场，先让人喜欢看再让人愿意买。",industryId:"general",builtin:!0},{id:"traffic_39",category:"traffic",name:"流量39-学会放权",content:"创业最大的误区：什么都想自己干。你一个人能干多少事？炒菜是你、收银是你、拍视频是你、对账还是你。累死也做不大。学会分工学会放权学会信任。你把精力放在最重要的决策上，其他的交给专业的人去做。一个人走得快一群人走得远，做老板最该学的不是干活而是找人用人。",industryId:"general",builtin:!0},{id:"traffic_40",category:"traffic",name:"流量40-复购秘诀",content:"今天分享一个让顾客复购的秘诀：会员积分制。不用搞太复杂，消费一元一积分，积分换菜品换折扣。重点是让顾客觉得在你这消费有累积价值，不来就亏了。人性都是怕亏的，你给他一个持续来的理由他自然就来了。复购不是求来的是设计出来的，好机制比好口才管用一百倍。",industryId:"general",builtin:!0},{id:"traffic_41",category:"traffic",name:"流量41-复购是生命线",content:"为什么有的店开了十年还在，有的店三个月就倒了？差距在复购。新客获客成本高，老客复购利润高。一家只靠新客的店迟早撑不住，一家老客稳定复购的店才能长久。怎么留老客？味道稳定、服务用心、时常给点惊喜。不复杂但需要坚持。做餐饮不是百米冲刺是马拉松，跑得久才能赢。",industryId:"general",builtin:!0},{id:"traffic_42",category:"traffic",name:"流量42-时间管理4321",content:"今天聊聊老板的时间管理。一天就那么多小时怎么分配？我的方法是四三二一：四成时间管产品和品质，三成时间管团队和运营，两成时间做营销和引流，一成时间学习提升。按这个比例分配你的店不会差。最怕的是老板一天到晚忙在琐事里，重要的事反而没时间做。时间花在哪结果就在哪。",industryId:"general",builtin:!0},{id:"traffic_43",category:"traffic",name:"流量43-封面标题",content:"做短视频最容易忽略的一点：封面和标题。内容再好封面不好没人点进来。封面要清晰有冲击力有信息量，标题要有悬念有痛点有数字。比如：三天赚了两万，一个餐饮老板娘的秘密。这比今天分享我的创业经历强一百倍。封面标题是门面，门面不好内容再好也白搭，别忽视。",industryId:"general",builtin:!0},{id:"traffic_44",category:"traffic",name:"流量44-顾客说分量少",content:"今天有个顾客说我家的菜分量少了，我二话不说重新做了一份大的端上去。有人说亏了，我说赚了。因为这位顾客以后每次来都会带人，他跟朋友说这家老板娘实在。一盆菜的成本几块钱，一个忠实顾客的价值几万块。算大账别算小账，格局大了生意就大了。吃亏是福，在餐饮业尤其如此。",industryId:"general",builtin:!0},{id:"traffic_45",category:"traffic",name:"流量45-抗挫力",content:"创业最重要的能力是什么？不是技术不是资金，是抗挫力。今天店里没人来你能不能调整心态明天照样开门？视频播放量个位数你能不能继续拍下一条？合伙人撤资了你能不能一个人撑下去？创业路上挫折是常态顺利才是意外。抗挫力强的人不一定成功，但成功的人抗挫力一定强。",industryId:"general",builtin:!0},{id:"traffic_46",category:"traffic",name:"流量46-互动设计",content:"为什么你的短视频没人点赞？因为你没有互动设计。观众看完就划走了没有让他行动的理由。试试在视频结尾加一句：你觉得呢？评论区告诉我。或者：同意的点赞不同意的来辩。给观众一个参与的理由，互动率马上就上来了。短视频不是单向输出是双向交流，你邀请了他才会回应。",industryId:"general",builtin:!0},{id:"traffic_47",category:"traffic",name:"流量47-促销不降价",content:"今天聊一个敏感话题：要不要降价促销？我的建议是：可以促销但别降价。降价容易涨价难，降了就回不去了。用赠品、用套餐、用限时折扣来促销，保住你的价格体系。顾客要的不是便宜是占便宜的感觉。你给他一个优惠的理由他开心你也不亏。降价伤品牌促销建好感，选哪个你自己掂量。",industryId:"general",builtin:!0},{id:"traffic_48",category:"traffic",name:"流量48-菜品稳定性",content:"做餐饮最核心的竞争力是什么？不是位置不是装修不是营销，是菜品稳定性。今天好吃明天难吃，顾客来一次就不来了。每道菜都要有标准：多少克肉多少克盐炒几分钟。按标准来味道就稳定。很多店倒就倒在菜品忽好忽坏上。标准化是餐饮的生命线，没有标准化做再大也是空中楼阁。",industryId:"catering",builtin:!0},{id:"traffic_49",category:"traffic",name:"流量49-选品三条件",content:"今天说说怎么选品。不是什么菜都能当招牌的。好招牌菜要满足三个条件：第一味道有记忆点吃了忘不了，第二出品要稳定谁来炒都一样，第三利润要合理不能赔本赚吆喝。三个条件缺一不可。选对一道招牌菜你的店就成功了一半。别贪多，一道打透比十道平庸强一百倍。",industryId:"catering",builtin:!0},{id:"traffic_50",category:"traffic",name:"流量50-别跟风",content:"创业三年我学到的最重要的一课：别跟风。看别人做什么火就跟着做，永远慢半拍，等跟上了风口早就过了。找到你自己的优势把它做到极致，这就是你的护城河。我专注做湘菜不搞融合菜不搞网红菜，就做正宗湖南味。专注让你成为专家，跟风让你成为分母。别什么都想做，做好一件事就够了。",industryId:"general",builtin:!0},{id:"traffic_51",category:"traffic",name:"流量51-放下面子",content:"为什么有些老板拍短视频总放不开？怕熟人看到笑话，怕员工说闲话，怕顾客觉得不专业。但你想过没有，你不拍视频店关了谁会来同情你？面子值几个钱？放下面子赚钱才是真本事。我刚拍的时候也尴尬，拍了一百条就习惯了。不要脸才能有脸，你越在意别人的看法越什么都做不成。",industryId:"general",builtin:!0},{id:"traffic_52",category:"traffic",name:"流量52-套餐设计",content:"今天分享一个提高客单价的小技巧：套餐设计。把毛利高的菜和毛利低的菜组合成套餐，整体毛利可控顾客也觉得划算。比如小炒肉毛利高配一个毛利低的汤，套餐价三十，顾客觉得赚了你也不亏。套餐设计是门学问，设计好了客单价能提高百分之二十。别只会单点，学会打包卖才能赚更多。",industryId:"general",builtin:!0},{id:"traffic_53",category:"traffic",name:"流量53-坚持最难",content:"做短视频最难的不是拍也不是剪，是坚持。第一个月信心满满，第二个月开始怀疑，第三个月想放弃。但你看看那些做起来的哪个不是坚持了半年以上？量变才能质变，你发了五十条没火不代表第五十一条不火。但你不发了就永远不可能火。坚持是最笨的方法也是最有效的方法，别在黎明前放弃。",industryId:"general",builtin:!0},{id:"traffic_54",category:"traffic",name:"流量54-应对竞争",content:"今天聊聊怎么处理竞争对手。隔壁开了一家跟我一样的店价格还比我便宜，怎么办？降价跟他拼？错！你要做的是把品质和服务做得更好，让顾客知道便宜和好是两码事。跟对手拼价格是最低级的竞争，拼品质拼服务拼口碑才是高级的。竞争对手不可怕，可怕的是你用错了应对方式。做好自己就是最好的竞争策略。",industryId:"general",builtin:!0},{id:"traffic_55",category:"traffic",name:"流量55-什么都想要",content:"创业最大的陷阱：什么都想要。又要品质高又要成本低又要利润多，怎么可能？创业就是在各种限制中做选择。你要品质就得接受高成本，你要低成本就得接受品质打折，你要高利润就得冒高风险。什么都想要的结果是什么都得不到。先想清楚你最看重什么然后接受它的代价，这才是成熟。",industryId:"general",builtin:!0},{id:"traffic_56",category:"traffic",name:"流量56-打卡送菜",content:"今天教你一招零成本引流的办法：顾客打卡送菜。来店里吃饭拍个照发朋友圈或抖音，送一道菜或一份甜品。顾客帮你传播你送一道菜，成本几块钱换来一次免费曝光怎么算都划算。而且顾客发的朋友圈自带信任背书，比你自己发十条都管用。用好顾客的社交网络，这是最低成本的引流方式。",industryId:"general",builtin:!0},{id:"traffic_57",category:"traffic",name:"流量57-员工留不住",content:"为什么你的员工留不住？因为你只给了工资没给了希望。工资是基础，但让员工留下的不只是钱。有没有晋升空间？有没有学习成长？有没有被尊重被认可？我店里每个员工都有明确的晋升路径，干得好就能加薪能升职。给希望比给钱更重要，有奔头的人才会留下来，看不到未来的人迟早会走。",industryId:"general",builtin:!0},{id:"traffic_58",category:"traffic",name:"流量58-要不要代运营",content:"做短视频要不要请人代运营？看阶段。刚起步自己来，因为你自己最懂你的生意。等有了感觉有了方向再请人，这样你才不会被代运营牵着走。最怕的是一上来就外包，内容方向不对花再多钱也白搭。先自己跑通再放大这是铁律。你不懂的事情别人帮你做你永远掌握不了核心，自己先上路再找同行者。",industryId:"general",builtin:!0},{id:"traffic_59",category:"traffic",name:"流量59-定价心理学",content:"今天说说菜品定价的心理学。十九块和二十块差一块钱但顾客感觉差很多。九块九比十块好卖不是因为便宜了一毛是因为感觉便宜了一档。定价用九不用整用八八不用九十，这些小技巧能提升百分之十五的转化率。定价不是拍脑袋是心理学，花点心思研究一下你的利润就上去了。",industryId:"general",builtin:!0},{id:"traffic_60",category:"traffic",name:"流量60-做减法",content:"为什么有的老板越做越累？因为不会做减法。什么品类都想加什么活动都想搞什么渠道都想铺，结果哪样都没做好。少即是多，做减法比做加法难但更有效。砍掉不赚钱的菜品关掉不产出的渠道，集中精力做好最赚钱的那一块。做减法不是退缩是聚焦，聚焦了才能打透，打透了才能赚到钱。",industryId:"general",builtin:!0},{id:"traffic_61",category:"traffic",name:"流量61-错峰优惠",content:"今天分享一个提升翻台率的方法：错峰优惠。中午十二点到一点是高峰期排队长，但两点到四点没人。我推了一个下午茶套餐两点到四点享七折，高峰期的客人分流了一部分到下午，翻台率提升了百分之三十。不是没有客人是你没有给客人一个错峰来的理由。动动脑子问题就是机会。",industryId:"general",builtin:!0},{id:"traffic_62",category:"traffic",name:"流量62-投资学习",content:"创业路上最值得投资的是什么？不是设备不是装修是学习。花钱学管理学营销学财务，回报率比任何投资都高。我每年花在学习上的钱不少于两万，但赚回来的远不止这个数。不学习的老板迟早被淘汰市场不等人。你的认知边界就是你的生意边界，认知上去了生意自然就上去了。",industryId:"general",builtin:!0},{id:"traffic_63",category:"traffic",name:"流量63-追热点",content:"做短视频要不要追热点？可以追但别硬追。热点跟你的行业相关就追，不相关就别凑热闹。强行蹭热点会让你的账号定位混乱粉丝不知道你是干什么的。热点是调味品不是主食，偶尔追一下增加曝光可以，但你的核心内容不能丢。定位稳了偶尔追热点是加分，定位不稳还追热点就是自杀。",industryId:"general",builtin:!0},{id:"traffic_64",category:"traffic",name:"流量64-顾客档案",content:"今天聊聊怎么做好顾客档案。不是让你搞复杂系统，就是记住老顾客的喜好。张哥爱吃辣多放蒜，李姐不吃香菜少放油，王叔每次来要靠窗的位子。你记住了他们来了就像回自己家一样。这种被记住的感觉是任何优惠都替代不了的。用心记住每一个老顾客，他们是你最宝贵的资产。",industryId:"general",builtin:!0},{id:"traffic_65",category:"traffic",name:"流量65-绝活菜",content:"为什么有些店看起来不起眼但天天排队？因为有绝活。一道别人做不出来的招牌菜就是你的护城河。我不怕别人学，因为我的剁椒鱼头用的辣椒是湖南老家寄来的，配方是我婆婆传的，别人学得了做法学不了那个味。找一道你的绝活菜把它做到天花板，它就是你最好的广告和最深的护城河。",industryId:"catering",builtin:!0},{id:"traffic_66",category:"traffic",name:"流量66-学会算账",content:"创业一定要学会算账，不算账的老板早晚要亏。每天算流水每周算毛利每月算净利润。哪道菜赚钱哪道菜赔钱，哪个时段人多哪个时段人少，心里要有数。不靠感觉靠数据，用数据做决策才能少踩坑。我每天花半小时对账复盘这半小时比干活三小时都值。算账不是抠门是精明，不算账才是真糊涂。",industryId:"general",builtin:!0},{id:"traffic_67",category:"traffic",name:"流量67-淡季策略",content:"今天说说怎么应对淡季。每个行业都有淡季，淡季不是等死是练内功。旺季搞营销拉客，淡季搞培训提品质。趁淡季研发新菜品培训员工优化流程升级装修，等旺季来了你比对手强一截。淡季不闲着旺季才能赚钱，那些淡季就躺平的店旺季也起不来。淡季是弯道，弯道超车才是高手。",industryId:"general",builtin:!0},{id:"traffic_68",category:"traffic",name:"流量68-别只拍不说",content:"做短视频最容易犯的错：只拍不说。光画面没有解说，顾客不知道你在表达什么。每条视频都要有口播或字幕，把你想说的说清楚。视频是给眼睛看的文案是给耳朵和脑子听的，两者结合才是完整的。不要假设观众能看懂你的画面，把一切说清楚讲明白这是对观众的基本尊重也是流量的基本要求。",industryId:"general",builtin:!0},{id:"traffic_69",category:"traffic",name:"流量69-别过度装修",content:"今天聊一个老板常犯的错误：过度装修。花了三十万装修开业三个月关门了，装修再好看菜不好吃也白搭。我的建议是装修轻一点设备好一点食材真一点，把装修省下来的钱花在刀刃上。顾客来吃饭不是来看装修的是来吃味道的。别本末倒置了，味道才是根装修只是皮，皮再好根烂了也白搭。",industryId:"general",builtin:!0},{id:"traffic_70",category:"traffic",name:"流量70-活动要传播",content:"为什么你的活动没效果？因为你的活动只对老客有用新客不知道。搞活动要配合传播：线下贴海报线上发视频发朋友圈，还要让员工口头告知每一桌客人。活动再好没人知道等于没搞。活动加传播才是完整闭环，缺了传播这个环节再好的活动也白搭。别只顾着搞活动忘了搞传播，这是最常见的错误。",industryId:"general",builtin:!0},{id:"traffic_71",category:"traffic",name:"流量71-选合伙人",content:"今天说说怎么选合伙人。选合伙人比选对象还重要。一看价值观合不合，二看能力互补不互补，三看利益分配清不清。三点都对了再谈合作。最怕的是只看有钱就合伙，结果经营理念不同天天吵架。合伙前把丑话说前面，退出机制分红比例决策权白纸黑字写清楚。合伙不规范迟早两败俱伤。",industryId:"general",builtin:!0},{id:"traffic_72",category:"traffic",name:"流量72-一定要露脸",content:"做短视频要不要露脸？一定要！不露脸没有辨识度顾客记不住你。你长得不好看？没关系真实就好。你说话不标准？没关系接地气就好。露脸是建立信任最快的方式，顾客看到你的脸才觉得你是活的是真的。别躲在镜头后面了勇敢露脸，你的脸就是你最好的个人品牌也是最不可替代的。",industryId:"general",builtin:!0},{id:"traffic_73",category:"traffic",name:"流量73-SOP标准化",content:"今天聊一个提高效率的方法：SOP标准化。每道菜怎么做写成流程，每个岗位干什么写成手册，新人来了照着做就行。没有SOP你永远离不开店，有了SOP你开了分店也能管。标准化不是限制creativity是保证下限，下限保住了上限才能突破。做餐饮想做大先做标准化，没有标准化规模就是灾难。",industryId:"general",builtin:!0},{id:"traffic_74",category:"traffic",name:"流量74-越忙越穷",content:"为什么有些老板一天到晚忙但赚不到钱？因为忙在了不该忙的地方。天天在后厨帮忙炒菜前厅缺人帮忙端盘子，你当老板的干的是员工的活。老板该忙的是选品定价营销管理这些战略层面的事。你把自己当员工用你的店就永远做不大。跳出来看全局别陷在具体的活里出不来，这是老板的必修课。",industryId:"general",builtin:!0},{id:"traffic_75",category:"traffic",name:"流量75-差评万能公式",content:"今天分享一个应对差评的万能公式：道歉加改进加补偿加跟进。先真诚道歉再说明改进措施然后给补偿方案最后跟进确认满意。四步走完百分之九十的差评都能转化为好评。差评不可怕可怕的是你不会处理，处理好了差评变好评处理不好好评变差评。这就是服务行业的生存之道，学会了吗？",industryId:"general",builtin:!0},{id:"traffic_76",category:"traffic",name:"流量76-完播率",content:"做短视频记住一个数据：完播率。完播率低说明你的视频中途被划走了。怎么提高完播率？节奏要快信息要密，三秒一个钩子五秒一个转折，让观众没时间划走。别铺垫太长别废话太多每一秒都要有信息量。完播率上去了平台才会给你推流，推流上去了你才有可能火。完播率是短视频的生命线，盯紧它。",industryId:"general",builtin:!0},{id:"traffic_77",category:"traffic",name:"流量77-培养店长",content:"今天说说怎么培养店长。自己干一辈子永远是作坊，培养出店长才能开分店。怎么培养？先给责任再给权力最后给股份。让他管一个班次管好了管一天管好了管一周，慢慢放手让他独立运营你只看数据不干预细节。培养一个店长至少半年但这半年的投入能让你解放出来做更大的事。授人以渔才能做大。",industryId:"general",builtin:!0},{id:"traffic_78",category:"traffic",name:"流量78-走出舒适区",content:"创业最大的敌人不是对手不是市场，是你的舒适区。生意稍微好一点就松懈了不想创新了不想拼了，但市场不等人你停了别人就追上来了。我每个月给自己定一个新目标逼自己走出舒适区。做新的菜品试新的营销学新的技能。舒适区是温水煮青蛙，等你发现水烫了已经跳不出来了。",industryId:"general",builtin:!0},{id:"traffic_79",category:"traffic",name:"流量79-社群运营",content:"今天聊一个被低估的营销方法：社群运营。把老顾客拉到一个群里，定期发菜品动态发优惠活动发美食知识。别天天发广告多互动多聊天。社群是你的私域流量池池子建好了，发个活动马上就有响应比花钱打广告有效多了。社群不是广告群是朋友圈，把群当朋友对待群友才会把你当朋友。",industryId:"general",builtin:!0},{id:"traffic_80",category:"traffic",name:"流量80-复盘",content:"为什么你的店开了两年还是老样子？因为你没复盘。每天忙完就累得不想动了但不复盘就会重复犯错。每天花十五分钟想想今天哪里做得好哪里做得不好怎么改进。每周花一小时看看数据哪道菜卖得好哪个时段客流大。复盘是进步的加速器不复盘就是原地踏步。别用战术上的勤奋掩盖战略上的懒惰。",industryId:"general",builtin:!0},{id:"traffic_81",category:"traffic",name:"流量81-心态管理",content:"今天说说创业的心态管理。创业就是过山车今天赚明天亏心态不好容易崩溃。我的方法是赚了不飘亏了不慌把情绪和经营分开。数据好分析为什么好数据差分析为什么差，用理性代替感性。创业拼的不只是能力更是心态，心态稳了决策才不会变形。能控制情绪的人才能控制生意，这是过来人的经验。",industryId:"general",builtin:!0},{id:"traffic_82",category:"traffic",name:"流量82-要不要日更",content:"做短视频要不要日更？看你的内容储备和精力。能日更当然好但别为了日更牺牲质量。我的建议是一周三到五条高质量比每天一条低质量强。质量不稳定会掉粉质量稳定才能涨粉。先保证质量再追求数量顺序别搞反。宁可少发一条也别发一条垃圾，你的主页就是你的门面每一条都要对得起观众。",industryId:"general",builtin:!0},{id:"traffic_83",category:"traffic",name:"流量83-仪式感",content:"今天分享一个增加顾客粘性的方法：仪式感。来店里过生日的送碗长寿面，第一次来的送个小甜品，老顾客来了主动打招呼叫出名字。这些小小的仪式感让顾客觉得自己被重视被记住。人性就是渴望被关注的，你给了他关注他就给了你忠诚。不需要花什么钱只需要花点心，用心比用钱更管用。",industryId:"general",builtin:!0},{id:"traffic_84",category:"traffic",name:"流量84-慢就是快",content:"创业五年最大的感悟：慢就是快。别急着扩张别急着赚钱，把基础打好把品质做稳把口碑建起来。基础不牢地动山摇，好多店倒就倒在扩张太快上。一家店做好了再开第二家第二家稳了再开第三家。每一步都走扎实了你走得慢但走得远。创业不是比谁快是比谁久，活到最后的才是赢家，记住这句话。",industryId:"general",builtin:!0},{id:"deal_1",category:"deal",name:"团购套餐模板",content:"天津的宝妈注意啦！这家少儿游泳馆春季招生开始啦！专业教练一对一教学，恒温泳池四季舒适，安全设施全程保障。现在报名享春季特惠价，原价三千九百九的季度套餐现在只要一千九百九！还送三节体验课和一套游泳装备！名额有限先到先得，点击下方链接立即抢购！让孩子学会游泳给他一个安全的未来！",industryId:"kids_edu",builtin:!0},{id:"custom_1",category:"custom",name:"奋斗理智模板",content:"干餐饮虽然很辛苦，但是我还是喜欢这份事业。因为每一道菜端上桌看到顾客满意的笑容，那一刻所有的疲惫都值了。做餐饮不只是为了赚钱，更是为了那份被人认可的成就感。有人问我后不后悔选这条路？我说不后悔，因为这条路虽然累但充实，虽然苦但有希望。每一个在餐饮路上坚持的人都是在用双手创造幸福。",industryId:"catering",builtin:!0}],Fw="zhuge_voice_clone",Qt="voices",Ow=1;let Uo=null;function Mo(){return Uo?Promise.resolve(Uo):new Promise((e,t)=>{const n=indexedDB.open(Fw,Ow);n.onupgradeneeded=()=>{const s=n.result;s.objectStoreNames.contains(Qt)||s.createObjectStore(Qt,{keyPath:"id"})},n.onsuccess=()=>{Uo=n.result,e(Uo)},n.onerror=()=>t(n.error)})}async function Bw(e,t,n,s){const i=await Mo();return new Promise((o,r)=>{const a=i.transaction(Qt,"readwrite");a.objectStore(Qt).put({id:e,name:t,blob:n,duration:s,createdAt:Date.now()}),a.oncomplete=()=>o(),a.onerror=()=>r(a.error)})}async function nh(){const e=await Mo();return new Promise((t,n)=>{const o=e.transaction(Qt,"readonly").objectStore(Qt).getAll();o.onsuccess=()=>{const r=
