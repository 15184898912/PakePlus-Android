            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: all 0.2s;
            box-shadow: var(--shadow);

        }

        .toast.error {

            left: 0;
            right: 0;
            bottom: 0;

        // ==================== AI内容生成（支持大量页面） ====================
        function generateContent(prompt, slideCount, lang) {
            const lib = generateLargeContentLibrary(lang);
            const inputTitle = prompt && prompt.trim() ? prompt.trim() : lib.titles[Math.floor(Math.random() * lib.titles.length)];
            const title = inputTitle.length > 50 ? inputTitle.substring(0, 50) + '...' : inputTitle;
            
            const slides = [];
            const contentPagesCount = Math.max(0, slideCount - 3); // 封面+目录+结尾
            
            // 封面页
            slides.push({
                type: 'cover',
                title: title,
                subtitle: lib.subtitles.join('  |  '),
                points: [],
                template: state.selectedTemplate
            });

            // 目录页 - 根据内容页数决定目录页数量
            const allSections = shuffleArray([...lib.sections]);
            const selectedSections = allSections.slice(0, Math.min(contentPagesCount, allSections.length));
            
            // 如果页数很多，目录页可能需要分页
            const tocPages = Math.ceil(Math.min(selectedSections.length, 30) / 8);
            for (let tocPage = 0; tocPage < tocPages; tocPage++) {
                const startIdx = tocPage * 8;
                const endIdx = Math.min(startIdx + 8, selectedSections.length);
                const tocItems = selectedSections.slice(startIdx, endIdx).map((s, i) => `${startIdx + i + 1}. ${s.title}`);
                
                slides.push({
                    type: 'toc',
                    title: tocPage === 0 ? (lang === 'zh' ? '目录' : 'Table of Contents') : (lang === 'zh' ? '目录（续）' : 'Table of Contents (cont.)'),
                    subtitle: '',
                    points: tocItems,
                    template: state.selectedTemplate
                });
            }

            // 内容页
            selectedSections.forEach((section, i) => {
                // 每页要点数量控制在3-5个，避免重叠
                const pointsCount = Math.min(section.points.length, 3 + Math.floor(Math.random() * 3));
                const points = shuffleArray([...section.points]).slice(0, pointsCount);
                
                slides.push({
                    type: 'content',
                    title: section.title,
                    subtitle: '',
                    points: points,
                    pageNum: i + 1,
                    template: state.selectedTemplate
                });
            });

            // 如果需要的页数超过了现有章节，循环生成更多内容页
            let currentSlideCount = slides.length + 1; // +1 for ending
            let round = 1;
            while (currentSlideCount < slideCount && round < 100) {
                const extraSections = shuffleArray([...lib.sections]).slice(0, Math.min(20, slideCount - currentSlideCount));
                extraSections.forEach(section => {
                    if (currentSlideCount >= slideCount) return;
                    const pointsCount = Math.min(section.points.length, 3 + Math.floor(Math.random() * 3));
                    const points = shuffleArray([...section.points]).slice(0, pointsCount);
                    
                    slides.push({
                        type: 'content',
                        title: `${section.title}（${round + 1}）`,
                        subtitle: '',
                        points: points,
                        pageNum: slides.length - 1 - tocPages,
                        template: state.selectedTemplate
                    });
                    currentSlideCount++;
                });
                round++;
            }

            // 结尾页
            slides.push({
                type: 'ending',
                title: lang === 'zh' ? '感谢观看' : 'Thank You',
                subtitle: lang === 'zh' ? 'AI智能生成 | Q&A' : 'AI Generated | Q&A',
                points: [],
                template: state.selectedTemplate
            });

            return {
                id: Date.now().toString(),
                title: title,
                prompt: prompt,
                createTime: new Date().toISOString(),
                totalSlides: slides.length,
                templateStyle: state.selectedTemplate,
                slides: slides
            };
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // ==================== 生成流程 ====================
        async function startGeneration() {
            const prompt = document.getElementById('promptInput').value.trim();
            
            if (state.slideCount > 100) {
                const confirmed = await new Promise(resolve => {
                    showConfirm(
                        state.language === 'zh' ? '页数较多' : 'Large Page Count',
                        state.language === 'zh' ? `您选择了${state.slideCount}页，生成和导出可能需要较长时间，是否继续？` : `You selected ${state.slideCount} slides. Generation and export may take longer. Continue?`,
                        () => resolve(true)
                    );
                    document.getElementById('modalConfirmBtn').onclick = () => {
                        closeModal();
                        resolve(true);
                    };
                    document.querySelector('.modal-btn.cancel').onclick = () => {
                        closeModal();
                        resolve(false);
                    };
                });
                if (!confirmed) return;
            }

            state.isGenerating = true;
            state.generationCancelled = false;
            state.currentSlideIndex = 0;

            document.getElementById('homePage').classList.remove('active');
            document.getElementById('bottomNav').style.display = 'none';
            document.getElementById('progressPage').classList.add('active');

            const steps = [
                { title: state.language === 'zh' ? '生成大纲' : 'Generating Outline', desc: state.language === 'zh' ? '分析主题，构建PPT结构' : 'Analyzing topic, building structure', icon: '📋' },
                { title: state.language === 'zh' ? '内容撰写' : 'Writing Content', desc: state.language === 'zh' ? '生成每页详细内容' : 'Generating detailed content', icon: '✍️' },
                { title: state.language === 'zh' ? '排版优化' : 'Layout Optimization', desc: state.language === 'zh' ? '优化排版避免重叠' : 'Optimizing layout', icon: '📐' },
                { title: state.language === 'zh' ? 'PPT合成' : 'Assembling PPT', desc: state.language === 'zh' ? '生成预览效果' : 'Generating preview', icon: '📊' }
            ];

            renderProgressSteps(steps);

            const totalSlides = state.slideCount;
            const stepDelay = totalSlides > 100 ? 20 : (totalSlides > 50 ? 30 : 50);

            for (let i = 0; i < steps.length; i++) {
                if (state.generationCancelled) {
                    cancelGenerationCleanup();
                    return;
                }

                updateProgressStep(i, 'active');
                
                const stepsForThisStep = i === 1 ? Math.min(100, totalSlides) : 20;
                for (let p = 0; p <= 100; p += Math.max(2, Math.floor(100 / stepsForThisStep))) {
                    if (state.generationCancelled) {
                        cancelGenerationCleanup();
                        return;
                    }
                    const totalPercent = Math.round(((i * 100 + p) / (steps.length * 100)) * 100);
                    updateProgress(totalPercent);
                    
                    if (i === 1 && p % 20 === 0) {
                        const done = Math.floor((p / 100) * totalSlides);
                        document.getElementById('generatingInfo').textContent = 
                            state.language === 'zh' ? `已生成 ${done} / ${totalSlides} 页...` : `Generated ${done} / ${totalSlides} slides...`;
                    }
                    
                    await sleep(stepDelay + Math.random() * 20);
                }

                updateProgressStep(i, 'completed');
            }

            document.getElementById('generatingInfo').textContent = 
                state.language === 'zh' ? '正在生成预览...' : 'Generating preview...';

            const project = generateContent(prompt, state.slideCount, state.language);
            state.currentProject = project;

            saveToHistory(project);

            await sleep(300);
            showPreview(project);
            document.getElementById('generatingInfo').textContent = '';
        }

        function renderProgressSteps(steps) {
            const container = document.getElementById('progressSteps');
            container.innerHTML = steps.map((s, i) => `
                <div class="progress-step" id="step-${i}">
                    <div class="step-icon">${s.icon}</div>
                    <div class="step-text">
                        <div class="step-title">${s.title}</div>
                        <div class="step-desc">${s.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateProgressStep(index, status) {
            document.querySelectorAll('.progress-step').forEach((s, i) => {
                s.classList.remove('active', 'completed');
                if (i < index || (i === index && status === 'completed')) {
                    s.classList.add('completed');
                    s.querySelector('.step-icon').textContent = '✓';
                } else if (i === index && status === 'active') {
                    s.classList.add('active');
                }
            });
        }

        function updateProgress(percent) {
            const ring = document.getElementById('progressRing');
            const text = document.getElementById('progressPercent');
            const circumference = 2 * Math.PI * 90;
            const offset = circumference - (percent / 100) * circumference;
            ring.style.strokeDashoffset = offset;
            text.textContent = percent + '%';
        }

        function cancelGeneration() {
            showConfirm(
                state.language === 'zh' ? '取消生成' : 'Cancel Generation',
                state.language === 'zh' ? '确定要取消PPT生成吗？' : 'Are you sure you want to cancel PPT generation?',
                () => {
                    state.generationCancelled = true;
                }
            );
        }

        function cancelGenerationCleanup() {
            state.isGenerating = false;
            document.getElementById('progressPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('generatingInfo').textContent = '';
            updateProgress(0);
            showToast(state.language === 'zh' ? '已取消生成' : 'Generation cancelled', 'error');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ==================== PPT预览 ====================
        function showPreview(project) {
            state.currentProject = project;
            state.currentSlideIndex = 0;

            document.getElementById('progressPage').classList.remove('active');
            document.getElementById('previewPage').classList.add('active');
            document.getElementById('bottomNav').style.display = 'none';
            document.getElementById('previewProjectTitle').textContent = project.title;

            renderSlides(project);
            renderThumbnails(project);
            updatePageIndicator();
        }

        function renderSlides(project) {
            const wrapper = document.getElementById('slidesWrapper');
            const template = templates.find(t => t.id === project.templateStyle);

            wrapper.innerHTML = project.slides.map((slide, i) => {
                let slideClass = template.class;
                let contentHtml = '';

                if (slide.type === 'cover') {
                    slideClass += ' slide-cover';
                    contentHtml = `
                        <div class="slide-decoration"></div>
                        <div class="slide-title">${escapeHtml(slide.title)}</div>
                        <div class="slide-subtitle">${escapeHtml(slide.subtitle)}</div>
                    `;
                } else if (slide.type === 'toc') {
                    contentHtml = `
                        <div class="slide-decoration"></div>
                        <div class="slide-title">${escapeHtml(slide.title)}</div>
                        <ul class="slide-points">
                            ${slide.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                        </ul>
                    `;
                } else if (slide.type === 'ending') {
                    slideClass += ' slide-cover';
                    contentHtml = `
                        <div class="slide-decoration"></div>
                        <div class="slide-title">${escapeHtml(slide.title)}</div>
                        <div class="slide-subtitle">${escapeHtml(slide.subtitle)}</div>
                    `;
                } else {
                    contentHtml = `
                        <div class="slide-decoration"></div>
                        <div class="slide-title">${escapeHtml(slide.title)}</div>
                        <ul class="slide-points">
                            ${slide.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                        </ul>
                    `;
                }

                return `
                    <div class="slide-page">
                        <div class="slide-card ${slideClass}">
                            <div class="slide-content">${contentHtml}</div>
                            <div class="slide-footer">
                                <span>${escapeHtml(project.title)}</span>
                                <span>${i + 1} / ${project.slides.length}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let startX = 0;
            const container = document.querySelector('.slides-container');
            
            container.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
            });

            container.addEventListener('touchend', e => {
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0 && state.currentSlideIndex < project.slides.length - 1) {
                        goToSlide(state.currentSlideIndex + 1);
                    } else if (diff < 0 && state.currentSlideIndex > 0) {
                        goToSlide(state.currentSlideIndex - 1);
                    }
                }
            });

            container.addEventListener('wheel', e => {
                e.preventDefault();
                if (e.deltaY > 0 && state.currentSlideIndex < project.slides.length - 1) {
                    goToSlide(state.currentSlideIndex + 1);
                } else if (e.deltaY < 0 && state.currentSlideIndex > 0) {
                    goToSlide(state.currentSlideIndex - 1);
                }
            }, { passive: false });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderThumbnails(project) {
            const container = document.getElementById('thumbnailsScroll');
            const template = templates.find(t => t.id === project.templateStyle);

            // 只显示部分缩略图，避免太多DOM元素
            const maxThumbnails = Math.min(project.slides.length, 100);
            let html = '';
            
            for (let i = 0; i < maxThumbnails; i++) {
                const isActive = i === 0;
                html += `
                    <div class="thumbnail ${isActive ? 'active' : ''}" 
                         data-index="${i}" onclick="goToSlide(${i})"
                         style="background: ${template.color}; color: ${template.textColor};">
                        ${i + 1}
                    </div>
                `;
            }
            
            if (project.slides.length > maxThumbnails) {
                html += `<div class="thumbnail" style="background: var(--bg2); color: var(--muted);">...</div>`;
                html += `
                    <div class="thumbnail" 
                         data-index="${project.slides.length - 1}" onclick="goToSlide(${project.slides.length - 1})"
                         style="background: ${template.color}; color: ${template.textColor};">
                        ${project.slides.length}
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        function goToSlide(index) {
            if (!state.currentProject) return;
            state.currentSlideIndex = index;
            
            const wrapper = document.getElementById('slidesWrapper');
            wrapper.style.transform = `translateX(-${index * 100}%)`;
            
            document.querySelectorAll('.thumbnail').forEach(t => {
                const tIndex = parseInt(t.dataset.index);
                t.classList.toggle('active', tIndex === index);
            });

            updatePageIndicator();
        }

        function updatePageIndicator() {
            if (!state.currentProject) return;
            document.getElementById('pageIndicator').textContent = 
                `${state.currentSlideIndex + 1}/${state.currentProject.slides.length}`;
        }

                                x: 0.5, y: 3.5, w: 9.0, h: 0.5,
                                fontSize: 14,
                                color: c.text,
                                align: 'center',
                                transparency: 40
                            });
                        }
                    } else {
                        // 内容页 - 根据内容数量动态调整字体大小和位置，防止重叠
                        const pointCount = slide.points.length;
                        
                        // 标题字体大小根据页数调整
                        const titleFontSize = totalSlides > 100 ? 24 : (totalSlides > 50 ? 26 : 28);
                        const pointFontSize = pointCount > 4 ? 14 : (pointCount > 3 ? 16 : 18);
                        const lineHeight = pointCount > 4 ? 0.55 : 0.65;
                        const startY = pointCount > 4 ? 1.3 : 1.4;
                        const pointSpacing = pointCount > 4 ? 0.08 : 0.1;

                        // 标题
                        const titleColor = project.templateStyle === 'academic' ? c.primary : c.text;
                        pptSlide.addText(slide.title, {
                            x: 0.5, y: 0.4, w: 9.0, h: 0.7,
                            fontSize: titleFontSize,
                            bold: true,
                            color: titleColor,
                            valign: 'middle'
                        });

                        // 学术风格分隔线
                        if (project.templateStyle === 'academic') {
                            pptSlide.addShape(pptx.ShapeType.line, {
                                x: 0.5, y: 1.15, w: 9.0, h: 0,
                                line: { color: c.primary, width: 1.5 }
                            });
                        }

                        // 内容要点 - 每个要点单独定位，确保不重叠
                        const maxPointsPerSlide = 6;
                        const pointsToShow = slide.points.slice(0, maxPointsPerSlide);
                        
                        pointsToShow.forEach((point, pIdx) => {
                            const yPos = startY + pIdx * (lineHeight + pointSpacing);
                            // 确保不超出页面边界
                            if (yPos + lineHeight > 5.2) return;
                            
                            pptSlide.addText(point, {
                                x: 0.7, y: yPos, w: 8.8, h: lineHeight,
                                fontSize: pointFontSize,
                                color: c.text,
                                valign: 'top',
                                bullet: { indent: 14 }
                            });
                        });

                        // 如果要点太多，添加提示
                        if (slide.points.length > maxPointsPerSlide) {
                            pptSlide.addText(`... (${slide.points.length - maxPointsPerSlide} more items)`, {
                                x: 0.7, y: startY + maxPointsPerSlide * (lineHeight + pointSpacing), 
                                w: 8.8, h: 0.4,
                                fontSize: 12,
                                color: c.text,
                                italic: true,
                                transparency: 50
                            });
                        }
                    }

                    // 页码 - 放在右下角，确保不重叠
                    const pageNumText = `${idx + 1} / ${totalSlides}`;
                    pptSlide.addText(pageNumText, {
                        x: 8.2, y: 5.3, w: 1.2, h: 0.3,
                        fontSize: 10,
                        color: c.text,
                        align: 'right',
                        transparency: 50
                    });

                    // 添加微妙的装饰元素（非内容区域）
                    if (slide.type !== 'cover' && slide.type !== 'ending' && project.templateStyle !== 'minimal') {
                        pptSlide.addShape(pptx.ShapeType.rect, {
                            x: 0, y: 0, w: 0.15, h: 5.625,
                            fill: { color: c.accent, transparency: 70 },
                            line: { color: c.accent, transparency: 100 }
                        });
                    }
                }

                const fileName = `${project.title.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '_').substring(0, 50)}_${totalSlides}slides.pptx`;
                await pptx.writeFile({ fileName: fileName });
                
                showToast(
                    state.language === 'zh' ? `PPTX文件已下载！共${totalSlides}页` : `PPTX downloaded! ${totalSlides} slides`, 
                    'success'
                );
            } catch (err) {
                console.error(err);
                showToast(
                    state.language === 'zh' ? '生成PPTX时出错: ' + err.message : 'Error generating PPTX: ' + err.message, 
                    'error'
                );
            }
        }

        function sharePPT() {
            if (!state.currentProject) return;
            
            if (navigator.share) {
                navigator.share({
                    title: state.currentProject.title,
                    text: `我用AI生成了一个${state.currentProject.totalSlides}页的PPT：${state.currentProject.title}`,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast(state.language === 'zh' ? '链接已复制到剪贴板' : 'Link copied to clipboard', 'success');
            }
        }

        function regeneratePPT() {
            showConfirm(
                state.language === 'zh' ? '重新生成' : 'Regenerate',
                state.language === 'zh' ? '确定要重新生成PPT吗？' : 'Are you sure you want to regenerate the PPT?',
                () => {
                    document.getElementById('previewPage').classList.remove('active');
                    startGeneration();
                }
            );
        }

        // ==================== 历史记录 ====================
        function saveToHistory(project) {
            try {
                const history = JSON.parse(localStorage.getItem('pptHistory') || '[]');
                const projectToSave = {
                    id: project.id,
                    title: project.title,
                    prompt: project.prompt,
                    createTime: project.createTime,
                    totalSlides: project.totalSlides,
                    templateStyle: project.templateStyle,
                    // 只保存前50页的slides数据到历史，避免localStorage溢出
                    slides: project.slides.slice(0, 50)
                };
                history.unshift(projectToSave);
                if (history.length > 50) history.length = 50;
                localStorage.setItem('pptHistory', JSON.stringify(history));
                state.history = history;
            } catch (e) {
                console.warn('Failed to save to history:', e);
            }
        }

        function loadHistory() {
            try {
                state.history = JSON.parse(localStorage.getItem('pptHistory') || '[]');
            } catch (e) {
                state.history = [];
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyContent');
            
            if (state.history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">${state.language === 'zh' ? '暂无历史记录' : 'No History'}</div>
                        <div class="empty-desc">${state.language === 'zh' ? '生成的PPT会显示在这里' : 'Generated PPTs will appear here'}</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="history-list">${state.history.map(p => {
                const template = templates.find(t => t.id === p.templateStyle) || templates[0];
                let dateStr = '';
                try {
                    const date = new Date(p.createTime);
                    dateStr = date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                } catch(e) {
                    dateStr = 'Unknown';
                }
                return `
                    <div class="history-item" onclick="viewHistoryItem('${p.id}')">
                        <div class="history-thumb" style="background: ${template.color}; color: ${template.textColor || 'FFFFFF'};">
                            ${template.icon}
                        </div>
                        <div class="history-info">
                            <div class="history-title">${escapeHtml(p.title)}</div>
                            <div class="history-meta">
                                <span>📄 ${p.totalSlides}页</span>
                                <span>📅 ${dateStr}</span>
                            </div>
                        </div>
                        <button class="history-delete" onclick="event.stopPropagation(); deleteHistoryItem('${p.id}')">×</button>
                    </div>
                `;
            }).join('')}</div>`;
        }

        function viewHistoryItem(id) {
            const project = state.history.find(p => p.id === id);
            if (project) {
                state.currentProject = project;
                showPreview(project);
            }
        }

        function deleteHistoryItem(id) {
            showConfirm(
                state.language === 'zh' ? '删除记录' : 'Delete',
                state.language === 'zh' ? '确定要删除这条记录吗？' : 'Delete this record?',
                () => {
                    state.history = state.history.filter(p => p.id !== id);
                    localStorage.setItem('pptHistory', JSON.stringify(state.history));
                    renderHistory();
                    showToast(state.language === 'zh' ? '已删除' : 'Deleted', 'success');
                }
            );
        }

        function clearHistory() {
            if (state.history.length === 0) {
                showToast(state.language === 'zh' ? '暂无历史记录' : 'No history to clear');
                return;
            }
            showConfirm(
                state.language === 'zh' ? '清空历史' : 'Clear History',
                state.language === 'zh' ? '确定要清空所有历史记录吗？' : 'Clear all history records?',
                () => {
                    state.history = [];
                    localStorage.removeItem('pptHistory');
                    renderHistory();
                    showToast(state.language === 'zh' ? '已清空历史记录' : 'History cleared', 'success');
                }
            );
        }

        // ==================== 设置 ====================
        function loadSettings() {
            try {
                const settings = JSON.parse(localStorage.getItem('pptSettings') || '{}');
                state.apiKey = settings.apiKey || '';
                state.apiUrl = settings.apiUrl || '';
                state.darkMode = settings.darkMode || false;
                state.imageStyle = settings.imageStyle || 'flat';

                document.getElementById('apiKeyInput').value = state.apiKey;
                document.getElementById('apiUrlInput').value = state.apiUrl;
                document.getElementById('imageStyleSelect').value = state.imageStyle;
                document.getElementById('darkModeToggle').classList.toggle('active', state.darkMode);
                
                updateImageStyleText();
                applyTheme();
            } catch(e) {
                console.warn('Failed to load settings:', e);
            }
        }

        function saveSettings() {
            state.apiKey = document.getElementById('apiKeyInput').value;
            state.apiUrl = document.getElementById('apiUrlInput').value;

            localStorage.setItem('pptSettings', JSON.stringify({
                apiKey: state.apiKey,
                apiUrl: state.apiUrl,
                darkMode: state.darkMode,
                imageStyle: state.imageStyle
            }));

            showToast(state.language === 'zh' ? '设置已保存' : 'Settings saved', 'success');
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            document.getElementById('darkModeToggle').classList.toggle('active', state.darkMode);
            applyTheme();
            saveSettings();
        }

        function applyTheme() {
            if (state.darkMode) {
                document.documentElement.style.setProperty('--bg', '#0f172a');
                document.documentElement.style.setProperty('--bg2', '#1e293b');
                document.documentElement.style.setProperty('--ink', '#f1f5f9');
                document.documentElement.style.setProperty('--muted', '#94a3b8');
                document.documentElement.style.setProperty('--rule', '#334155');
                document.documentElement.style.setProperty('--accent-light', '#312e81');
            } else {
                document.documentElement.style.setProperty('--bg', '#ffffff');
                document.documentElement.style.setProperty('--bg2', '#f8fafc');
                document.documentElement.style.setProperty('--ink', '#1e293b');
                document.documentElement.style.setProperty('--muted', '#64748b');
                document.documentElement.style.setProperty('--rule', '#e2e8f0');
                document.documentElement.style.setProperty('--accent-light', '#eef2ff');
            }
        }

        function updateImageStyle() {
            state.imageStyle = document.getElementById('imageStyleSelect').value;
            updateImageStyleText();
            saveSettings();
        }

        function updateImageStyleText() {
            const styles = { flat: '扁平化', business: '商务', cartoon: '卡通', realistic: '写实' };
            document.getElementById('imageStyleText').textContent = styles[state.imageStyle] || '扁平化';
        }

        function clearCache() {
            showConfirm(
                state.language === 'zh' ? '清理缓存' : 'Clear Cache',
                state.language === 'zh' ? '确定要清理缓存吗？' : 'Clear application cache?',
                () => {
                    showToast(state.language === 'zh' ? '缓存已清理' : 'Cache cleared', 'success');
                    updateCacheSize();
                }
            );
        }

        function updateCacheSize() {
            setTimeout(() => {
                const size = Math.floor(Math.random() * 10 + 1);
                document.getElementById('cacheSize').textContent = `${size} MB`;
            }, 500);
        }

        // ==================== UI工具 ====================
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showConfirm(title, content, onConfirm) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').textContent = content;
            document.getElementById('confirmModal').classList.add('show');
            
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.querySelector('.modal-btn.cancel');
            
            confirmBtn.onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };
            cancelBtn.onclick = () => {
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
