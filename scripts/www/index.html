<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>深圳手机回收评估报价单</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 18px;
    color: #333;
    background: #fff;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-text-size-adjust: 100%;
    -ms-content-zooming: zoom;
}

.app-wrapper {
    position: relative;
    width: 100%;
    min-height: 100vh;
    padding-bottom: 80px;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.app {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100vh;
    background: #fff;
}

.bottom-btns {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    gap: 1px;
}

.header {
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: #fff;
    text-align: center;
    padding: 16px 12px 12px;
}

.title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 4px;
}

.date {
    font-size: 18px;
    opacity: 0.9;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dashed;
    text-underline-offset: 4px;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    transition: background 0.2s;
}

.date:active {
    background: rgba(255,255,255,0.2);
}

/* 品牌标签栏 */
.brand-tabs {
    display: flex;
    overflow-x: auto;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 0 4px;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 0;
    z-index: 50;
    align-items: center;
}

.brand-tabs::-webkit-scrollbar {
    display: none;
}

.brand-tab {
    flex-shrink: 0;
    padding: 12px 14px;
    font-size: 16px;
    font-weight: 500;
    color: #666;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    position: relative;
}

.brand-tab.active {
    color: #2196F3;
    border-bottom-color: #2196F3;
    font-weight: bold;
    font-size: 17px;
}

.brand-tab .count {
    display: inline-block;
    background: #e0e0e0;
    color: #666;
    font-size: 11px;
    padding: 1px 5px;
    border-radius: 10px;
    margin-left: 3px;
    font-weight: normal;
}

.brand-tab.active .count {
    background: #2196F3;
    color: #fff;
}

.brand-add {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #999;
    cursor: pointer;
    margin-left: 4px;
    border-radius: 50%;
    transition: all 0.2s;
}

.brand-add:active {
    background: #f0f0f0;
    color: #2196F3;
}

.brand-manage {
    flex-shrink: 0;
    padding: 6px 10px;
    font-size: 13px;
    color: #666;
    background: #f5f5f5;
    border-radius: 4px;
    cursor: pointer;
    margin-left: 4px;
    margin-right: 4px;
}

.brand-manage:active {
    background: #e0e0e0;
}

.search-bar {
    background: #f0f0f0;
    padding: 8px;
    flex-shrink: 0;
}

.search-box {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    height: 48px;
    padding: 0 16px;
}

.search-icon {
    font-size: 22px;
    color: #999;
    margin-right: 10px;
    flex-shrink: 0;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 18px;
    height: 100%;
    background: transparent;
    font-family: inherit;
}

.search-box input::placeholder {
    color: #999;
}

.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 720px;
}

thead th {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #333;
}

th {
    background: #333;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    padding: 18px 8px;
    border: 1px solid #ccc;
    height: 64px;
}

td {
    text-align: center;
    padding: 16px 8px;
    font-size: 19px;
    border: 1px solid #ccc;
    word-break: break-word;
    line-height: 1.5;
}

tbody tr {
    cursor: pointer;
}

tbody tr:nth-child(odd) {
    background: #fff;
}

tbody tr:nth-child(even) {
    background: #f5f5f5;
}

tbody tr:active {
    background: #e3f2fd !important;
}

th, td {
    width: 16.666%;
    min-width: 60px;
}

/* 品牌专属系列颜色 */
.series-oppo-find { background: #303f9f !important; color: #fff !important; font-weight: bold; }
.series-oppo-reno { background: #00897b !important; color: #fff !important; font-weight: bold; }
.series-oppo-a { background: #f57c00 !important; color: #fff !important; font-weight: bold; }
.series-oppo-k { background: #7b1fa2 !important; color: #fff !important; font-weight: bold; }
.series-oppo-r { background: #c62828 !important; color: #fff !important; font-weight: bold; }
.series-oppo-fold { background: #1565c0 !important; color: #FFD700 !important; font-weight: bold; }

.series-huawei-mate { background: #b71c1c !important; color: #fff !important; font-weight: bold; }
.series-huawei-p { background: #880e4f !important; color: #fff !important; font-weight: bold; }
.series-huawei-nova { background: #00695c !important; color: #fff !important; font-weight: bold; }
.series-huawei-enjoy { background: #ef6c00 !important; color: #fff !important; font-weight: bold; }
.series-huawei-fold { background: #311b92 !important; color: #FFD700 !important; font-weight: bold; }

.series-honor-magic { background: #0d47a1 !important; color: #fff !important; font-weight: bold; }
.series-honor-number { background: #1b5e20 !important; color: #fff !important; font-weight: bold; }
.series-honor-x { background: #e65100 !important; color: #fff !important; font-weight: bold; }
.series-honor-play { background: #4a148c !important; color: #fff !important; font-weight: bold; }

.series-xiaomi-mi { background: #ff6f00 !important; color: #fff !important; font-weight: bold; }
.series-xiaomi-redmi { background: #d84315 !important; color: #fff !important; font-weight: bold; }
.series-xiaomi-redmi-note { background: #ad1457 !important; color: #fff !important; font-weight: bold; }
.series-xiaomi-mix { background: #263238 !important; color: #FFD700 !important; font-weight: bold; }
.series-xiaomi-civi { background: #00838f !important; color: #fff !important; font-weight: bold; }
.series-xiaomi-fold { background: #1a237e !important; color: #FFD700 !important; font-weight: bold; }

.series-oneplus-number { background: #212121 !important; color: #f44336 !important; font-weight: bold; }
.series-oneplus-nord { background: #37474f !important; color: #fff !important; font-weight: bold; }
.series-oneplus-ace { background: #b71c1c !important; color: #fff !important; font-weight: bold; }

.price-high { color: #2E7D32 !important; font-weight: bold; }
.price-mid-high { color: #1565C0 !important; font-weight: 600; }
.price-mid { color: #EF6C00 !important; }
.price-low { color: #C62828 !important; }
.price-zero { color: #999 !important; font-style: italic; }

.model-cell { font-weight: 500; }

.btn-add {
    flex: 1;
    height: 64px;
    background: #2196F3;
    color: #fff;
    border: none;
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
}

.btn-add:active { background: #1976D2; }

.btn-batch {
    flex: 1;
    height: 64px;
    background: #4CAF50;
    color: #fff;
    border: none;
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
}

.btn-batch:active { background: #388E3C; }

.btn-manage {
    width: 70px;
    height: 64px;
    background: #FF9800;
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
}

.btn-manage:active { background: #F57C00; }

.batch-textarea {
    width: 100%;
    min-height: 220px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px;
    font-size: 16px;
    font-family: monospace;
    resize: vertical;
    outline: none;
    line-height: 1.6;
    -webkit-appearance: none;
}

.batch-textarea:focus { border-color: #2196F3; }

.mask {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.mask.show { display: flex; }

.dialog {
    background: #fff;
    border-radius: 8px;
    width: 100%;
    max-width: 380px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
}

.dialog-title {
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #eee;
    font-size: 22px;
    font-weight: bold;
}

.dialog-body {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
}

.form-item { margin-bottom: 16px; }

.form-item label {
    display: block;
    font-size: 16px;
    color: #666;
    margin-bottom: 6px;
}

.form-item input, .form-item select {
    width: 100%;
    height: 52px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 0 16px;
    font-size: 18px;
    outline: none;
    font-family: inherit;
    -webkit-appearance: none;
    background: #fff;
}

.form-item input:focus, .form-item select:focus { border-color: #2196F3; }

.dialog-footer {
    display: flex;
    padding: 16px 20px;
    border-top: 1px solid #eee;
    gap: 16px;
}

.btn-cancel, .btn-ok {
    flex: 1;
    height: 52px;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    font-family: inherit;
}

.btn-cancel { background: #f0f0f0; color: #666; }
.btn-cancel:active { background: #e0e0e0; }

.btn-ok { background: #2196F3; color: #fff; }
.btn-ok:active { background: #1976D2; }

.btn-del { background: #f44336; }
.btn-del:active { background: #d32f2f; }

.del-text {
    text-align: center;
    font-size: 18px;
    color: #666;
    padding: 24px 0;
}

.tip {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 16px 32px;
    border-radius: 32px;
    font-size: 16px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
}

.tip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* 品牌管理列表 */
.brand-list {
    max-height: 300px;
    overflow-y: auto;
}

.brand-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    font-size: 17px;
}

.brand-item:last-child { border-bottom: none; }

.brand-item-name {
    font-weight: 500;
    flex: 1;
}

.brand-item-count {
    color: #999;
    font-size: 14px;
    margin-right: 12px;
}

.brand-item-del {
    color: #f44336;
    font-size: 14px;
    padding: 4px 12px;
    cursor: pointer;
}

.brand-item-del:active {
    background: #ffebee;
    border-radius: 4px;
}

.brand-item-default {
    color: #999;
    font-size: 12px;
}

    </style>
</head>
<body>
    <div class="app-wrapper" id="appWrapper">
        <div class="app" id="app">
            <div class="header">
                <div class="title" id="title">深圳手机回收评估报价单</div>
                <div class="date" id="date" onclick="editDate()"></div>
            </div>
            
            <!-- 品牌标签栏 -->
            <div class="brand-tabs" id="brandTabs"></div>

            <div class="search-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索系列或型号">
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>系列</th>
                            <th>型号</th>
                            <th>开机屏坏</th>
                            <th>不开机</th>
                            <th>废板</th>
                            <th>整机</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="bottom-btns">
            <button class="btn-manage" id="manageBtn">品牌</button>
            <button class="btn-batch" id="batchBtn">批量导入</button>
            <button class="btn-add" id="addBtn">添加</button>
        </div>
    </div>

    <!-- 编辑/添加对话框 -->
    <div class="mask" id="editMask">
        <div class="dialog">
            <div class="dialog-title" id="editTitle">添加新机型</div>
            <div class="dialog-body">
                <div class="form-item">
                    <label>品牌</label>
                    <select id="fBrand"></select>
                </div>
                <div class="form-item">
                    <label>系列</label>
                    <input type="text" id="fSeries" placeholder="请输入系列">
                </div>
                <div class="form-item">
                    <label>型号</label>
                    <input type="text" id="fModel" placeholder="请输入型号">
                </div>
                <div class="form-item">
                    <label>开机屏坏价格</label>
                    <input type="number" id="fP1" placeholder="请输入价格" min="0">
                </div>
                <div class="form-item">
                    <label>不开机价格</label>
                    <input type="number" id="fP2" placeholder="请输入价格" min="0">
                </div>
                <div class="form-item">
                    <label>废板价格</label>
                    <input type="number" id="fP3" placeholder="请输入价格" min="0">
                </div>
                <div class="form-item">
                    <label>整机价格</label>
                    <input type="number" id="fP4" placeholder="请输入价格" min="0">
                </div>
            </div>
            <div class="dialog-footer" style="gap:8px;">
                <button class="btn-cancel" id="cancelBtn" style="flex:1;">取消</button>
                <button class="btn-ok" id="addMoreBtn" style="flex:1.2; background:#4CAF50;">保存并继续</button>
                <button class="btn-ok" id="okBtn" style="flex:1;">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div class="mask" id="delMask">
        <div class="dialog" style="max-width:300px">
            <div class="dialog-title">确认删除</div>
            <div class="dialog-body">
                <p class="del-text" id="delText">确定要删除该机型吗？</p>
            </div>
            <div class="dialog-footer">
                <button class="btn-cancel" id="delCancel">取消</button>
                <button class="btn-ok btn-del" id="delOk">确认删除</button>
            </div>
        </div>
    </div>

    <!-- 批量导入对话框 -->
    <div class="mask" id="batchMask">
        <div class="dialog" style="max-width:500px;">
            <div class="dialog-title">批量导入机型</div>
            <div class="dialog-body">
                <div class="form-item">
                    <label>导入到品牌</label>
                    <select id="batchBrand"></select>
                </div>
                <p style="font-size:14px;color:#666;margin-bottom:10px;line-height:1.6;">
                    粘贴Excel或表格数据，每行一个机型，格式：<br>
                    <strong style="color:#333;">系列 型号 开机屏坏 不开机 废板 整机</strong><br>
                    支持空格、制表符、逗号分隔
                </p>
                <textarea id="batchText" class="batch-textarea" placeholder="示例：
Find系列 Find X7 2200 1000 500 4000
Reno系列 Reno11 800 300 80 1800
A系列 A97 300 100 30 800"></textarea>
                <p id="batchResult" style="font-size:14px;color:#4CAF50;margin-top:10px;display:none;"></p>
            </div>
            <div class="dialog-footer">
                <button class="btn-cancel" id="batchCancel">取消</button>
                <button class="btn-ok" id="batchOk">导入数据</button>
            </div>
        </div>
    </div>

    <!-- 添加品牌对话框 -->
    <div class="mask" id="addBrandMask">
        <div class="dialog" style="max-width:320px;">
            <div class="dialog-title">添加品牌</div>
            <div class="dialog-body">
                <div class="form-item">
                    <label>品牌名称</label>
                    <input type="text" id="newBrandName" placeholder="请输入品牌名称">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-cancel" id="addBrandCancel">取消</button>
                <button class="btn-ok" id="addBrandOk">添加</button>
            </div>
        </div>
    </div>

    <!-- 品牌管理对话框 -->
    <div class="mask" id="manageMask">
        <div class="dialog" style="max-width:400px;">
            <div class="dialog-title">品牌管理</div>
            <div class="dialog-body">
                <div class="brand-list" id="brandList"></div>
                <button class="btn-ok" style="width:100%;margin-top:16px;height:48px;" id="addBrandBtn">+ 添加新品牌</button>
            </div>
            <div class="dialog-footer">
                <button class="btn-ok" id="manageOk" style="width:100%;">完成</button>
            </div>
        </div>
    </div>

    <!-- 日期编辑对话框 -->
    <div class="mask" id="dateMask">
        <div class="dialog" style="max-width:320px;">
            <div class="dialog-title">设置日期</div>
            <div class="dialog-body">
                <div class="form-item">
                    <label>选择日期</label>
                    <input type="date" id="dateInput">
                </div>
                <div class="form-item">
                    <label>或自定义文字</label>
                    <input type="text" id="dateCustom" placeholder="如：2024年1月15日 更新">
                </div>
            </div>
            <div class="dialog-footer">
                <button class="btn-cancel" id="dateCancel">取消</button>
                <button class="btn-ok" id="dateOk">确定</button>
            </div>
        </div>
    </div>

    <div class="tip" id="tip"></div>

    <script>

// ============ 全局状态 ============
let allData = {}; // {品牌名: [数据数组]}
let brands = [];
let currentBrand = 'OPPO';
let editIndex = -1;
let delIndex = -1;
let scale = 1;

// ============ 初始化 ============
function init() {
    loadData();
    renderBrandTabs();
    renderTable();
    updateDate();
    bindEvents();
    bindZoom();
}

// 加载数据
function loadData() {
    // 加载品牌列表
    const savedBrands = localStorage.getItem(BRANDS_KEY);
    if (savedBrands) {
        brands = JSON.parse(savedBrands);
    } else {
        brands = [...DEFAULT_BRANDS];
        localStorage.setItem(BRANDS_KEY, JSON.stringify(brands));
    }

    // 加载数据
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        allData = JSON.parse(savedData);
        // 确保所有品牌都有数据数组
        brands.forEach(b => {
            if (!allData[b]) {
                allData[b] = PRESET_DATA[b] || [];
            }
        });
    } else {
        // 初始化预置数据
        brands.forEach(b => {
            allData[b] = PRESET_DATA[b] || [];
        });
        saveData();
    }

    // 加载当前品牌
    const savedBrand = localStorage.getItem(CURRENT_BRAND_KEY);
    if (savedBrand && brands.includes(savedBrand)) {
        currentBrand = savedBrand;
    }
}

// 保存数据
function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
    localStorage.setItem(BRANDS_KEY, JSON.stringify(brands));
    localStorage.setItem(CURRENT_BRAND_KEY, currentBrand);
}

// 更新日期显示
function updateDate() {
    const savedDate = localStorage.getItem(DATE_KEY);
    if (savedDate) {
        document.getElementById('date').textContent = savedDate;
    } else {
        const now = new Date();
        const dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
        document.getElementById('date').textContent = dateStr;
        localStorage.setItem(DATE_KEY, dateStr);
    }
}

// ============ 渲染品牌标签 ============
function renderBrandTabs() {
    const container = document.getElementById('brandTabs');
    let html = '';
    
    brands.forEach(brand => {
        const count = (allData[brand] || []).length;
        const active = brand === currentBrand ? 'active' : '';
        html += `<div class="brand-tab ${active}" data-brand="${brand}">${brand}<span class="count">${count}</span></div>`;
    });
    
    html += `<div class="brand-add" id="addBrandTab" title="添加品牌">+</div>`;
    html += `<div class="brand-manage" id="manageBrandTab">管理</div>`;
    
    container.innerHTML = html;

    // 绑定品牌切换事件
    container.querySelectorAll('.brand-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            currentBrand = this.dataset.brand;
            saveData();
            renderBrandTabs();
            renderTable();
            document.getElementById('searchInput').value = '';
        });
    });

    document.getElementById('addBrandTab').addEventListener('click', showAddBrandDialog);
    document.getElementById('manageBrandTab').addEventListener('click', showManageDialog);

    // 更新表单中的品牌选择
    updateBrandSelects();
}

// 更新品牌下拉选择
function updateBrandSelects() {
    const fBrand = document.getElementById('fBrand');
    const batchBrand = document.getElementById('batchBrand');
    
    let options = brands.map(b => `<option value="${b}" ${b === currentBrand ? 'selected' : ''}>${b}</option>`).join('');
    
    if (fBrand) fBrand.innerHTML = options;
    if (batchBrand) batchBrand.innerHTML = options;
}

// ============ 渲染表格 ============
function renderTable(filterText) {
    const tbody = document.getElementById('tbody');
    const data = allData[currentBrand] || [];
    
    let filtered = data;
    if (filterText) {
        filtered = data.filter(item => 
            item.series.includes(filterText) || item.model.includes(filterText)
        );
    }

    let html = '';
    filtered.forEach((item, idx) => {
        const realIdx = data.indexOf(item);
        const seriesClass = getSeriesClass(item.series, currentBrand);
        html += `<tr data-idx="${realIdx}">
            <td class="${seriesClass}">${item.series}</td>
            <td class="model-cell">${item.model}</td>
            <td class="${getPriceClass(item.p1)}">${item.p1 || '-'}</td>
            <td class="${getPriceClass(item.p2)}">${item.p2 || '-'}</td>
            <td class="${getPriceClass(item.p3)}">${item.p3 || '-'}</td>
            <td class="${getPriceClass(item.p4)}">${item.p4 || '-'}</td>
        </tr>`;
    });

    tbody.innerHTML = html;

    // 绑定行点击事件
    tbody.querySelectorAll('tr').forEach(tr => {
        tr.addEventListener('click', function() {
            editIndex = parseInt(this.dataset.idx);
            showEditDialog(editIndex);
        });
    });
}

// 获取系列样式类
function getSeriesClass(series, brand) {
    const s = series.toLowerCase();
    const b = brand.toLowerCase();
    
    // OPPO系列
    if (b === 'oppo' || brand === 'OPPO') {
        if (s.includes('find')) return 'series-oppo-find';
        if (s.includes('reno')) return 'series-oppo-reno';
        if (s.includes('a系列') || s === 'a') return 'series-oppo-a';
        if (s.includes('k系列') || s === 'k') return 'series-oppo-k';
        if (s.includes('r系列') || s === 'r') return 'series-oppo-r';
        if (s.includes('折叠') || s.includes('n2') || s.includes('n3')) return 'series-oppo-fold';
    }
    
    // 华为系列
    if (brand === '华为') {
        if (s.includes('mate')) return 'series-huawei-mate';
        if (s.includes('p系列') || s.includes('pura')) return 'series-huawei-p';
        if (s.includes('nova')) return 'series-huawei-nova';
        if (s.includes('畅享')) return 'series-huawei-enjoy';
        if (s.includes('折叠') || s.includes('x5') || s.includes('x3') || s.includes('xs')) return 'series-huawei-fold';
    }
    
    // 荣耀系列
    if (brand === '荣耀') {
        if (s.includes('magic')) return 'series-honor-magic';
        if (s.includes('数字') || /^\d{2,3}/.test(series)) return 'series-honor-number';
        if (s.includes('x系列')) return 'series-honor-x';
        if (s.includes('play')) return 'series-honor-play';
    }
    
    // 小米系列
    if (brand === '小米') {
        if (s.includes('mix')) return 'series-xiaomi-mix';
        if (s.includes('civi')) return 'series-xiaomi-civi';
        if (s.includes('折叠') || s.includes('fold') || s.includes('flip')) return 'series-xiaomi-fold';
        if (s.includes('数字')) return 'series-xiaomi-mi';
    }
    
    // 红米系列
    if (brand === '红米') {
        if (s.includes('k系列')) return 'series-xiaomi-mi';
        if (s.includes('note')) return 'series-xiaomi-redmi-note';
        return 'series-xiaomi-redmi';
    }
    
    // 一加/壹加系列
    if (brand === '壹加' || brand === '一加') {
        if (s.includes('ace')) return 'series-oneplus-ace';
        if (s.includes('nord')) return 'series-oneplus-nord';
        if (s.includes('折叠') || s.includes('open')) return 'series-xiaomi-fold';
        return 'series-oneplus-number';
    }
    
    // 默认
    return '';
}

// 获取价格样式类
function getPriceClass(price) {
    const p = parseInt(price) || 0;
    if (p === 0) return 'price-zero';
    if (p >= 2000) return 'price-high';
    if (p >= 1000) return 'price-mid-high';
    if (p >= 300) return 'price-mid';
    return 'price-low';
}

// 回车键导航
function bindEnterNavigation() {
    const inputs = ['fSeries', 'fModel', 'fP1', 'fP2', 'fP3', 'fP4'];
    inputs.forEach((id, i) => {
        const el = document.getElementById(id);
        el.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (i < inputs.length - 1) {
                    document.getElementById(inputs[i+1]).focus();
                } else {
                    saveEdit(false);
                }
            }
        });
    });
}

// ============ 缩放功能 ============
function bindZoom() {
    const app = document.getElementById('app');
    const wrapper = document.getElementById('appWrapper');
    
    let startDist = 0;
    let startScale = 1;
    let isPinching = false;
    let pinchStartScale = 1;

    function getDist(p1, p2) {
        const dx = p1.clientX - p2.clientX;
        const dy = p1.clientY - p2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function setTransform() {
        scale = Math.max(0.5, Math.min(scale, 4));
        app.style.transform = 'scale(' + scale + ')';
        app.style.transformOrigin = 'center top';
        wrapper.style.paddingBottom = (80 + app.offsetHeight * Math.max(0, scale - 1)) + 'px';
    }

    wrapper.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
            isPinching = true;
            pinchStartScale = scale;
            startDist = getDist(e.touches[0], e.touches[1]);
            startScale = scale;
        }
    }, {passive: true});

    wrapper.addEventListener('touchmove', function(e) {
        if (e.touches.length === 2 && isPinching) {
            e.preventDefault();
            e.stopPropagation();
            const dist = getDist(e.touches[0], e.touches[1]);
            scale = startScale * (dist / startDist);
            requestAnimationFrame(setTransform);
        }
    }, {passive: false, capture: true});

    wrapper.addEventListener('touchend', function(e) {
        if (e.touches.length < 2) {
            isPinching = false;
            if (scale < 1) {
                scale = 1;
                setTransform();
            }
        }
    }, {passive: true});

    wrapper.addEventListener('touchcancel', function(e) {
        isPinching = false;
    }, {passive: true});

    // 双击切换缩放
    let lastTouchTime = 0;
    let lastTouchX = 0;
    let lastTouchY = 0;
    
    wrapper.addEventListener('touchend', function(e) {
        if (isPinching || e.changedTouches.length !== 1) return;
        const touch = e.changedTouches[0];
        const now = Date.now();
        const dx = Math.abs(touch.clientX - lastTouchX);
        const dy = Math.abs(touch.clientY - lastTouchY);
        
        if (now - lastTouchTime < 300 && dx < 20 && dy < 20) {
            if (scale > 1.1) {
                scale = 1;
            } else {
                scale = 2;
            }
            setTransform();
        }
        lastTouchTime = now;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
    }, {passive: true});

    setTransform();
}

// ============ 对话框操作 ============
function showMask(id) {
    document.getElementById(id).classList.add('show');
}

function hideMask(id) {
    document.getElementById(id).classList.remove('show');
}

// 显示编辑对话框
function showEditDialog(idx) {
    const title = document.getElementById('editTitle');
    const fBrand = document.getElementById('fBrand');
    const fSeries = document.getElementById('fSeries');
    const fModel = document.getElementById('fModel');
    const fP1 = document.getElementById('fP1');
    const fP2 = document.getElementById('fP2');
    const fP3 = document.getElementById('fP3');
    const fP4 = document.getElementById('fP4');

    updateBrandSelects();

    if (idx >= 0) {
        title.textContent = '编辑机型';
        const item = allData[currentBrand][idx];
        fBrand.value = currentBrand;
        fSeries.value = item.series;
        fModel.value = item.model;
        fP1.value = item.p1;
        fP2.value = item.p2;
        fP3.value = item.p3;
        fP4.value = item.p4;
    } else {
        title.textContent = '添加新机型';
        fBrand.value = currentBrand;
        fSeries.value = '';
        fModel.value = '';
        fP1.value = '';
        fP2.value = '';
        fP3.value = '';
        fP4.value = '';
    }

    showMask('editMask');
    setTimeout(() => fSeries.focus(), 100);
}

// 保存编辑
function saveEdit(continueAdd) {
    const brand = document.getElementById('fBrand').value;
    const series = document.getElementById('fSeries').value.trim();
    const model = document.getElementById('fModel').value.trim();
    const p1 = parseInt(document.getElementById('fP1').value) || 0;
    const p2 = parseInt(document.getElementById('fP2').value) || 0;
    const p3 = parseInt(document.getElementById('fP3').value) || 0;
    const p4 = parseInt(document.getElementById('fP4').value) || 0;

    if (!series || !model) {
        showTip('请填写系列和型号');
        return;
    }

    if (!allData[brand]) {
        allData[brand] = [];
    }

    const item = {series, model, p1, p2, p3, p4};

    if (editIndex >= 0 && brand === currentBrand) {
        allData[brand][editIndex] = item;
        showTip('修改成功');
    } else {
        allData[brand].push(item);
        showTip('添加成功');
    }

    saveData();
    currentBrand = brand;
    renderBrandTabs();
    renderTable();

    if (continueAdd) {
        document.getElementById('fSeries').value = '';
        document.getElementById('fModel').value = '';
        document.getElementById('fP1').value = '';
        document.getElementById('fP2').value = '';
        document.getElementById('fP3').value = '';
        document.getElementById('fP4').value = '';
        document.getElementById('fSeries').focus();
        editIndex = -1;
    } else {
        hideMask('editMask');
    }
}

// 删除
function doDelete() {
    if (delIndex >= 0) {
        allData[currentBrand].splice(delIndex, 1);
        saveData();
        renderBrandTabs();
        renderTable();
        showTip('删除成功');
    }
    hideMask('delMask');
    delIndex = -1;
}

// 批量导入
function doBatchImport() {
    const brand = document.getElementById('batchBrand').value;
    const text = document.getElementById('batchText').value.trim();
    
    if (!text) {
        showTip('请粘贴数据');
        return;
    }

    const lines = text.split('\n').filter(l => l.trim());
    let count = 0;

    lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        
        // 支持多种分隔符：制表符、多个空格、逗号、中文逗号
        const parts = line.split(/[\t,，\s]+/).filter(p => p);
        
        if (parts.length >= 6) {
            const item = {
                series: parts[0],
                model: parts[1],
                p1: parseInt(parts[2]) || 0,
                p2: parseInt(parts[3]) || 0,
                p3: parseInt(parts[4]) || 0,
                p4: parseInt(parts[5]) || 0
            };
            if (!allData[brand]) allData[brand] = [];
            allData[brand].push(item);
            count++;
        }
    });

    if (count > 0) {
        saveData();
        currentBrand = brand;
        renderBrandTabs();
        renderTable();
        document.getElementById('batchResult').textContent = `成功导入 ${count} 条数据`;
        document.getElementById('batchResult').style.display = 'block';
        showTip(`成功导入 ${count} 条数据`);
        setTimeout(() => hideMask('batchMask'), 800);
    } else {
        showTip('未识别到有效数据，请检查格式');
    }
}

// ============ 品牌管理 ============
function showAddBrandDialog() {
    document.getElementById('newBrandName').value = '';
    showMask('addBrandMask');
    setTimeout(() => document.getElementById('newBrandName').focus(), 100);
}

function doAddBrand() {
    const name = document.getElementById('newBrandName').value.trim();
    if (!name) {
        showTip('请输入品牌名称');
        return;
    }
    if (brands.includes(name)) {
        showTip('该品牌已存在');
        return;
    }
    
    brands.push(name);
    allData[name] = [];
    currentBrand = name;
    saveData();
    renderBrandTabs();
    renderTable();
    hideMask('addBrandMask');
    showTip(`已添加品牌：${name}`);
}

function showManageDialog() {
    const list = document.getElementById('brandList');
    let html = '';
    
    brands.forEach((brand, idx) => {
        const count = (allData[brand] || []).length;
        const isDefault = DEFAULT_BRANDS.includes(brand);
        html += `<div class="brand-item">
            <span class="brand-item-name">${brand}</span>
            <span class="brand-item-count">${count}款</span>
            ${!isDefault ? `<span class="brand-item-del" data-idx="${idx}">删除</span>` : `<span class="brand-item-default">预置</span>`}
        </div>`;
    });
    
    list.innerHTML = html;
    
    // 绑定删除事件
    list.querySelectorAll('.brand-item-del').forEach(btn => {
        btn.addEventListener('click', function() {
            const idx = parseInt(this.dataset.idx);
            const brand = brands[idx];
            if (confirm(`确定要删除品牌"${brand}"及其所有数据吗？`)) {
                brands.splice(idx, 1);
                delete allData[brand];
                if (currentBrand === brand) {
                    currentBrand = brands[0] || 'OPPO';
                }
                saveData();
                renderBrandTabs();
                renderTable();
                showManageDialog();
                showTip(`已删除品牌：${brand}`);
            }
        });
    });
    
    showMask('manageMask');
}

// ============ 日期编辑 ============
function editDate() {
    const now = new Date();
    const dateInput = document.getElementById('dateInput');
    dateInput.value = now.toISOString().split('T')[0];
    document.getElementById('dateCustom').value = '';
    showMask('dateMask');
}

function doSetDate() {
    const dateInput = document.getElementById('dateInput').value;
    const custom = document.getElementById('dateCustom').value.trim();
    
    let dateStr;
    if (custom) {
        dateStr = custom;
    } else if (dateInput) {
        const d = new Date(dateInput);
        dateStr = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
    } else {
        const now = new Date();
        dateStr = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日';
    }
    
    document.getElementById('date').textContent = dateStr;
    localStorage.setItem(DATE_KEY, dateStr);
    hideMask('dateMask');
    showTip('日期已更新');
}

    }
});
