let data = [];
let brands = {};
let currentBrand = '全部';
let selectMode = false;
let selectedRows = new Set();
let editingRowIndex = -1;
let insertPosition = -1; // -1 = append at end
let zoomLevel = 1;
let searchKeyword = '';

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    data = s ? JSON.parse(s) : seedRows();
  } catch(e) { data = seedRows(); }
  try {
    const s = localStorage.getItem(BRAND_COLORS_KEY);
    brands = s ? { ...DEFAULT_BRANDS, ...JSON.parse(s) } : { ...DEFAULT_BRANDS };
  } catch(e) { brands = { ...DEFAULT_BRANDS }; }
  try {
    const s = localStorage.getItem(DATE_KEY);
    if (s) document.getElementById('dateDisplay').textContent = s;
  } catch(e) {}
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function saveBrands() { localStorage.setItem(BRAND_COLORS_KEY, JSON.stringify(brands)); }
function saveDate(d) { localStorage.setItem(DATE_KEY, d); }

function getBrandList() {
  const s = new Set(data.map(r => r.brand));
  // Also include user-added brands (those in brands but not in DEFAULT_BRANDS)
  Object.keys(brands).forEach(b => {
    if (!DEFAULT_BRANDS[b]) s.add(b); // only add custom brands without data
  });
  return ['全部', ...Array.from(s).sort((a,b)=>a.localeCompare(b,'zh'))];
}
function getBrandCount(b) { return b==='全部'?data.length:data.filter(r=>r.brand===b).length; }

function getFilteredIndices() {
  let indices = data.map((_,i)=>i);
  if (currentBrand !== '全部') indices = indices.filter(i => data[i].brand === currentBrand);
  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    indices = indices.filter(i => {
      const r = data[i];
      return r.brand.toLowerCase().includes(kw) || r.series.toLowerCase().includes(kw) || r.model.toLowerCase().includes(kw);
    });
  }
  return indices;
}

function getSortedData() {
  const indices = getFilteredIndices();
  const brandOrder = getBrandList();
  indices.sort((a,b) => {
    const ra = data[a], rb = data[b];
    const bi = brandOrder.indexOf(ra.brand) - brandOrder.indexOf(rb.brand);
    if (bi !== 0) return bi;
    if (ra.series !== rb.series) return ra.series.localeCompare(rb.series,'zh');
    return ra.model.localeCompare(rb.model,'zh');
  });
  return indices;
}

function getBrandColor(brand) {
  const b = BRAND_ALIASES[brand] || brand;
  if (brands[b]) return brands[b];
  const hue = Math.abs(hashCode(b)) % 360;
  return { bg:hslToHex(hue,60,92), series:hslToHex(hue,60,42), text:hslToHex(hue,60,25) };
}
function hashCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h;}
function hslToHex(h,s,l){
  s/=100;l/=100;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(c*255).toString(16).padStart(2,'0');};
  return '#'+f(0)+f(8)+f(4);
}
function hexToHue(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0;
  if(max!==min){const d=max-min;if(max===r)h=((g-b)/d+(g<b?6:0));else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}
  return h;
}

function renderHeader() {
  const hr = document.getElementById('headerRow');
  const showBrand = currentBrand === '全部';
  let html = '';
  if (selectMode) {
    const allChecked = getFilteredIndices().length > 0 && getFilteredIndices().every(i => selectedRows.has(i));
    html += `<th class="col-check"><input type="checkbox" class="select-all-cb" id="selAll" ${allChecked?'checked':''}></th>`;
  }
  html += `<th class="col-brand" id="thBrand" style="${showBrand?'':'display:none'}">品牌</th>`;
  html += `<th class="col-series">系列</th><th class="col-model">型号</th>`;
  html += `<th class="col-price">开机屏坏</th><th class="col-price">不开机</th><th class="col-price">废板</th><th class="col-price">整机</th>`;
  hr.innerHTML = html;
  const selAll = document.getElementById('selAll');
  if (selAll) {
    selAll.addEventListener('change', () => {
      const indices = getFilteredIndices();
      if (selAll.checked) indices.forEach(i => selectedRows.add(i));
      else indices.forEach(i => selectedRows.delete(i));
      renderTable();
      updateSelectionUI();
    });
  }
}

function renderTable() {
  renderHeader();
  const tbody = document.getElementById('tableBody');
  const indices = getSortedData();
  const showBrand = currentBrand === '全部';
  tbody.innerHTML = '';
  
  indices.forEach(realIdx => {
    const row = data[realIdx];
    const tr = document.createElement('tr');
    tr.dataset.idx = realIdx;
    const bc = getBrandColor(row.brand);
    const isHL = searchKeyword && (row.brand.toLowerCase().includes(searchKeyword.toLowerCase())||row.series.toLowerCase().includes(searchKeyword.toLowerCase())||row.model.toLowerCase().includes(searchKeyword.toLowerCase()));
    if (isHL && searchKeyword) tr.className = 'highlight-row';
    
    if (selectMode) {
      const td = document.createElement('td');
      td.className = 'check-cell';
      td.innerHTML = `<input type="checkbox" class="row-checkbox" data-idx="${realIdx}" ${selectedRows.has(realIdx)?'checked':''}>`;
      tr.appendChild(td);
    }
    
    if (showBrand) {
      const td = document.createElement('td');
      td.className = 'col-brand';
      td.style.cssText = `background:${bc.bg};color:${bc.text};font-weight:600`;
      td.textContent = row.brand;
      tr.appendChild(td);
    }
    
    const tdS = document.createElement('td');
    tdS.className = 'col-series';
    tdS.style.cssText = `background:${bc.series};color:#fff;font-weight:700`;
    tdS.textContent = row.series;
    tr.appendChild(tdS);
    
    const tdM = document.createElement('td');
    tdM.className = 'col-model editable';
    tdM.textContent = row.model;
    tdM.addEventListener('click', () => {
      if (selectMode) { toggleSelection(realIdx); return; }
      startInlineEdit(tdM, realIdx, 'model');
    });
    tr.appendChild(tdM);
    
    const prices = [
      {k:'priceOn',c:'price-on'},{k:'priceOff',c:'price-off'},
      {k:'priceBroken',c:'price-broken'},{k:'priceWhole',c:'price-whole'}
    ];
    prices.forEach(p => {
      const td = document.createElement('td');
      td.className = `col-price editable ${p.c}`;
      td.textContent = fmt(row[p.k]);
      td.addEventListener('click', () => {
        if (selectMode) { toggleSelection(realIdx); return; }
        startInlineEdit(td, realIdx, p.k);
      });
      tr.appendChild(td);
    });
    
    attachLongPress(tr, realIdx);
    tbody.appendChild(tr);
  });
  applyZoom();
}

function fmt(v) {
  if (v==null||v===''||isNaN(v)) return '0';
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/,'');
}

function render() {
  renderBrandTabs();
  renderTable();
  updateSelectionUI();
}

// ==================== INLINE EDIT ====================
function startInlineEdit(td, idx, field) {
  const row = data[idx];
  const oldVal = row[field];
  const inp = document.createElement('input');
  inp.type = field==='model'?'text':'number';
  inp.className = 'cell-edit-input';
  if (field!=='model') { inp.step='0.01'; inp.inputMode='decimal'; }
  inp.value = oldVal;
  td.textContent = '';
  td.appendChild(inp);
  inp.focus();
  if (inp.type==='text') inp.select();
  else { inp.select(); }
  
  let done=false;
  const finish=(save)=>{
    if(done)return;done=true;
    if(save){
      let v = inp.value.trim();
      if(field!=='model'){ v=Math.round((parseFloat(v)||0)*100)/100; }
      if(v!==oldVal){ data[idx][field]=v; saveData(); showToast('已保存'); }
    }
    renderTable();
  };
  inp.addEventListener('blur',()=>finish(true));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    if(e.key==='Escape'){finish(false);}
  });
}

document.getElementById('btnBatchAddConfirm').addEventListener('click',()=>{
  const text=document.getElementById('batchData').value.trim();
  if(!text){showToast('请输入数据');return;}
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let added=0,failed=0;
  lines.forEach(line=>{
    const parts=line.split(/[\s\t]+/);
    if(parts.length<7){failed++;return;}
    data.push({
      brand:parts[0],series:parts[1],model:parts[2],
      priceOn:parseFloat(parts[3])||0,
      priceOff:parseFloat(parts[4])||0,
      priceBroken:parseFloat(parts[5])||0,
      priceWhole:parseFloat(parts[6])||0
    });
    added++;
  });
  saveData();
  closeModal('modalBatchAdd');
  document.getElementById('batchData').value='';
  render();
  showToast(`成功导入${added}条${failed?'，失败'+failed+'条':''}`);
});

  const pct=parseFloat(document.getElementById('adjustPercent').value);

  if(scope==='all') indices=data.map((_,i)=>i);
  else if(scope==='selected') indices=Array.from(selectedRows);
  else if(scope==='brand') indices=data.map((r,i)=>(currentBrand==='全部'||r.brand===currentBrand)?i:-1).filter(i=>i>=0);
  indices.forEach(i=>{
    fields.forEach(f=>{ data[i][f]=Math.round(data[i][f]*mult*100)/100; });
  });
  saveData();closeModal('modalAdjust');exitSelectMode();render();
  showToast(`已调整${indices.length}条数据`);
});

// Update preview when scope changes
document.getElementById('adjustScope').addEventListener('change',()=>{
  const s=document.getElementById('adjustScope').value;
  const p=document.getElementById('adjustPreview');
  if(s==='all') p.textContent='将对全部数据进行价格调整';
  else if(s==='selected') p.textContent=`将对选中的${selectedRows.size}条数据进行调整`;
  else if(s==='brand') p.textContent=`将对${currentBrand==='全部'?'所有品牌':'品牌「'+currentBrand+'」'}的数据进行调整`;
});

// ==================== BRAND MANAGE ====================
function renderBrandManageList(){
  const list=document.getElementById('brandManageList');
  const names=getBrandList().filter(b=>b!=='全部');
  list.innerHTML=names.map(b=>{
    const c=getBrandColor(b);
    const isDef=!!DEFAULT_BRANDS[b];
    return `<div class="brand-manage-item">
      <div class="brand-name-display">
        <span class="brand-color-dot" style="background:${c.bg};border-color:${c.series}"></span>
        <span>${b}</span>
        <span style="color:#9ca3af;font-size:12px">(${getBrandCount(b)}个型号)</span>
      </div>
      <div class="brand-manage-actions">
        <input type="color" value="${c.bg}" data-brand="${b}" style="width:32px;height:32px;padding:1px;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer" title="修改颜色">
        ${!isDef?`<button class="icon-btn btn-del-brand" data-brand="${b}">×</button>`:''}
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('input[type=color]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const b=inp.dataset.brand;
      const hue=hexToHue(inp.value);
      brands[b]={bg:inp.value,series:hslToHex(hue,65,40),text:hslToHex(hue,65,25)};
      saveBrands();renderBrandManageList();render();
    });
  });
  list.querySelectorAll('.btn-del-brand').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const b=btn.dataset.brand;
      if(getBrandCount(b)>0){if(!confirm(`品牌"${b}"下还有${getBrandCount(b)}个型号，确定删除颜色设置吗？（数据不会删除）`))return;}
      delete brands[b];saveBrands();renderBrandManageList();render();showToast('已删除品牌设置');
    });
  });
}

document.getElementById('btnAddBrand').addEventListener('click',()=>{
  const name=document.getElementById('newBrandName').value.trim();
  if(!name){showToast('请输入品牌名称');return;}
  if(brands[name]){showToast('品牌已存在');return;}
  const c=document.getElementById('newBrandColor').value;
  const hue=hexToHue(c);
  brands[name]={bg:c,series:hslToHex(hue,65,40),text:hslToHex(hue,65,25)};
  saveBrands();document.getElementById('newBrandName').value='';renderBrandManageList();render();showToast('品牌已添加');
});

// ==================== DATE ====================
function initDatePicker(){
  const y=document.getElementById('dateYear'),m=document.getElementById('dateMonth'),d=document.getElementById('dateDay');
  for(let i=2020;i<=2035;i++) y.innerHTML+=`<option value="${i}">${i}年</option>`;
  for(let i=1;i<=12;i++) m.innerHTML+=`<option value="${i}">${i}月</option>`;
  for(let i=1;i<=31;i++) d.innerHTML+=`<option value="${i}">${i}日</option>`;
}
function updateDays(){
  const y=parseInt(document.getElementById('dateYear').value),m=parseInt(document.getElementById('dateMonth').value);
  const days=new Date(y,m,0).getDate();
  const d=document.getElementById('dateDay');const cur=d.value;
  d.innerHTML='';for(let i=1;i<=days;i++)d.innerHTML+=`<option value="${i}">${i}日</option>`;
  if(cur&&parseInt(cur)<=days) d.value=cur;
}
document.getElementById('dateYear').addEventListener('change',updateDays);
document.getElementById('dateMonth').addEventListener('change',updateDays);
document.getElementById('btnDate').addEventListener('click',()=>{
  const t=document.getElementById('dateDisplay').textContent;
  const m=t.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  if(m){
    document.getElementById('dateYear').value=+m[1];
    document.getElementById('dateMonth').value=+m[2];
    updateDays();
    document.getElementById('dateDay').value=+m[3];
  }
  openModal('modalDate');
});
document.getElementById('btnSaveDate').addEventListener('click',()=>{
  const y=document.getElementById('dateYear').value;
  const m=document.getElementById('dateMonth').value.padStart(2,'0');
  const d=document.getElementById('dateDay').value.padStart(2,'0');
  const s=`${y}年${m}月${d}日`;
  document.getElementById('dateDisplay').textContent=s;saveDate(s);closeModal('modalDate');
});

// ==================== SEARCH ====================
document.getElementById('searchInput').addEventListener('input',e=>{
  searchKeyword=e.target.value.trim();renderTable();
});

// ==================== MENU ====================
const fabMenu=document.getElementById('fabMenu');
document.addEventListener('click',e=>{if(!fabMenu.contains(e.target)&&!e.target.closest('#btnMenu')&&!e.target.closest('#btnAdd'))fabMenu.classList.remove('show');});

fabMenu.querySelectorAll('.fab-menu-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const a=item.dataset.action;fabMenu.classList.remove('show');
    switch(a){
      case'addRow':openAddForm();break;
      case'batchAdd':openModal('modalBatchAdd');break;
      case'batchDelete':enterSelectMode();break;
      case'priceAdjust':document.getElementById('adjustScope').value=currentBrand!=='全部'?'brand':'all';document.getElementById('adjustPreview').textContent=currentBrand!=='全部'?`将对品牌「${currentBrand}」的数据进行调整`:'将对全部数据进行价格调整';openModal('modalAdjust');break;
      case'manageBrands':renderBrandManageList();openModal('modalBrands');break;
    }
  });
});
document.getElementById('btnAdd').addEventListener('click',()=>openAddForm());
document.getElementById('btnMenu').addEventListener('click',e=>{e.stopPropagation();fabMenu.classList.toggle('show');});

// ==================== CONTEXT MENU ====================
let pressTimer=null,pressIdx=-1;
function attachLongPress(tr,idx){
  const start=e=>{
    if(selectMode)return;
    pressIdx=idx;
    pressTimer=setTimeout(()=>{
      const t=e.touches?e.touches[0]:e;
      showCtxMenu(t,idx);
    },450);
  };
  const end=()=>{if(pressTimer)clearTimeout(pressTimer);};
  tr.addEventListener('touchstart',start,{passive:true});
  tr.addEventListener('touchend',end);tr.addEventListener('touchmove',end);
  tr.addEventListener('mousedown',start);tr.addEventListener('mouseup',end);tr.addEventListener('mouseleave',end);
}
const ctxMenu=document.getElementById('contextMenu');
function showCtxMenu(e,idx){
  const x=Math.min((e.clientX||e.pageX),window.innerWidth-165);
  const y=Math.min((e.clientY||e.pageY),window.innerHeight-150);
  ctxMenu.style.left=x+'px';ctxMenu.style.top=y+'px';
  ctxMenu.classList.add('show');ctxMenu.dataset.idx=idx;
  if(navigator.vibrate)navigator.vibrate(40);
}
document.addEventListener('click',()=>ctxMenu.classList.remove('show'));
ctxMenu.querySelectorAll('.context-menu-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const idx=parseInt(ctxMenu.dataset.idx);
    const a=item.dataset.action;ctxMenu.classList.remove('show');
    switch(a){
      case'edit':openEditForm(idx);break;
      case'insertAfter':openAddForm(idx);break;
      case'delete':
        if(confirm('确定删除此行数据？')){data.splice(idx,1);saveData();render();showToast('已删除');}
        break;
    }
  });
});

// ==================== PINCH ZOOM ====================
let initDist=0,initZoom=1;
const zoomInd=document.getElementById('zoomIndicator'),tWrap=document.getElementById('tableWrap');

function applyZoom(){
  tWrap.style.transform=`scale(${zoomLevel})`;
  tWrap.style.width=`${100/zoomLevel}%`;
  zoomInd.textContent=Math.round(zoomLevel*100)+'%';
  zoomInd.classList.add('show');
  clearTimeout(zoomInd._t);
  zoomInd._t=setTimeout(()=>zoomInd.classList.remove('show'),1500);
}
function dist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
const cont=document.getElementById('tableContainer');
cont.addEventListener('touchstart',e=>{if(e.touches.length===2){initDist=dist(e.touches);initZoom=zoomLevel;e.preventDefault();}},{passive:false});
cont.addEventListener('touchmove',e=>{if(e.touches.length===2){zoomLevel=Math.max(0.5,Math.min(2.5,initZoom*(dist(e.touches)/initDist)));applyZoom();e.preventDefault();}},{passive:false});
let lastTap=0;
cont.addEventListener('touchend',e=>{
  if(e.touches.length<2)initDist=0;
  const now=Date.now();
  if(now-lastTap<300&&e.changedTouches.length===1){zoomLevel=1;applyZoom();}
  lastTap=now;
});
cont.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoomLevel=Math.max(0.5,Math.min(2.5,zoomLevel-e.deltaY*0.005));applyZoom();}},{passive:false});

// ==================== TOAST ====================
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

// ==================== INIT ====================
initDatePicker();loadData();render();
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
