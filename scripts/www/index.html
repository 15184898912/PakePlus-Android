<body>
    <!-- 主页面 -->
    <div id="homePage" class="page active">
        <div class="header">
            <h1>AI PPT生成器</h1>
            <div class="subtitle">智能生成，一键导出</div>

                    <button class="page-btn" data-pages="15">15页</button>

                </div>
            </div>

            <div class="card">
                <div class="card-title">选择风格</div>
                <div class="style-selector">
                    <button class="style-btn active" data-style="business">
                        <span class="style-icon">💼</span>
                        <span>专业商务</span>
                    </button>
                    <button class="style-btn" data-style="creative">
                        <span class="style-icon">🎨</span>
                        <span>创意设计</span>
                    </button>
                    <button class="style-btn" data-style="education">
                        <span class="style-icon">📖</span>
                        <span>学术教育</span>
                    </button>
                    <button class="style-btn" data-style="minimal">
                        <span class="style-icon">🌿</span>
                        <span>简约清新</span>
                    </button>
                </div>
            </div>

            <button class="generate-btn" onclick="generatePPT()">一键生成PPT</button>

            <div class="history-entry" onclick="showHistory()">
                <span>📋</span>
                <span>历史记录</span>
            </div>
        </div>

        <div class="preview-header">
            <button class="back-btn" onclick="goHome()">←</button>
            <h2>PPT预览</h2>
            <button class="save-btn" onclick="showExportModal()">导出</button>
        </div>
        <div class="preview-container">
            <div class="thumbnail-list" id="thumbnailList"></div>
            <div class="slide-editor">
                <div id="slideContainer" class="slide-container">
                    <div class="slide-title" contenteditable="true" id="slideTitle"></div>
                    <div class="slide-content" id="slideContent"></div>
                </div>
            </div>
        </div>
        <div class="preview-toolbar">
            <button class="toolbar-btn" id="prevBtn" onclick="prevPage()">上一页</button>
            <span class="page-indicator" id="pageIndicator">1/10</span>
            <button class="toolbar-btn" id="nextBtn" onclick="nextPage()">下一页</button>
        </div>
    </div>

    <!-- 历史记录页面 -->

            <div class="modal-title">选择导出格式</div>

                    <div class="option-desc">导出为PDF文档，适合打印分享</div>
                </div>
            </div>
            <div class="export-option" onclick="exportImage()">
                <div class="option-icon">🖼️</div>
                <div class="option-text">
                    <div class="option-title">图片导出</div>
                    <div class="option-desc">导出为图片，适合社交分享</div>
                </div>
            </div>

                <div class="option-text">
                    <div class="option-title">复制全部文本</div>
                    <div class="option-desc">复制所有文字内容到剪贴板</div>

    <script>
        // 全局状态
        let currentSlides = [];
        let currentPage = 0;
        let selectedPages = 10;
        let selectedStyle = 'business';
        let currentTheme = '';

        // 页数选择
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedPages = parseInt(this.dataset.pages);

        // 判断主题类型
        function detectThemeType(theme) {
            const techKeywords = ['AI', '人工智能', '大数据', '云计算', '区块链', '元宇宙', '5G', '芯片', '算法', '编程', '软件', '互联网', '科技', '技术', '智能', '数字', '机器人', '物联网', 'VR', 'AR', '机器学习', '深度学习'];
            const eduKeywords = ['教育', '学习', '教学', '课程', '培训', '考试', '知识', '学生', '老师', '学校', '大学', '研究', '方法', '思维', '记忆', '阅读', '写作', '数学', '语文', '英语', '学术'];
            const bizKeywords = ['商业', '创业', '融资', '市场', '营销', '销售', '管理', '企业', '公司', '项目', '投资', '财务', '运营', '产品', '客户', '盈利', '商业模式', 'BP', '商业计划', '战略', '品牌'];

            for (let keyword of techKeywords) {
                if (theme.includes(keyword)) return 'tech';
            }
            for (let keyword of eduKeywords) {
                if (theme.includes(keyword)) return 'education';
            }
            for (let keyword of bizKeywords) {
                if (theme.includes(keyword)) return 'business';
            }
            return 'general';
        }

        // 生成PPT内容
        function generatePPTContent(theme, pageCount, style) {
            const themeType = detectThemeType(theme);
            const template = contentTemplates[themeType];
            const slides = [];

            // 封面页
            slides.push({
                type: 'cover',
                title: theme,
                subtitle: getSubtitle(style)
            });

            // 目录页
            const contentPages = pageCount - 3; // 封面+目录+总结+致谢 = 4，内容页数 = pageCount - 4
            const actualContentPages = Math.max(1, contentPages);
            const chapters = [];
            for (let i = 0; i < actualContentPages; i++) {
                chapters.push(template.chapters[i % template.chapters.length]);
            }

            slides.push({
                type: 'toc',
                title: '目录',
                chapters: chapters
            });

            // 内容页
            for (let i = 0; i < actualContentPages; i++) {
                const chapterTitle = chapters[i];
                const pointSet = template.points[i % template.points.length];
                const pointCount = 3 + Math.floor(Math.random() * 3); // 3-5个要点
                const points = [];
                for (let j = 0; j < pointCount; j++) {
                    points.push(generatePoint(chapterTitle, pointSet[j % pointSet.length], theme, j));
                }
                slides.push({
                    type: 'content',
                    title: chapterTitle,
                    points: points
                });
            }

            // 总结页
            slides.push({
                type: 'summary',
                title: '核心总结',
                points: [
                    `${theme}具有重要的现实意义和广阔的发展前景`,
                    '需要我们持续学习、深入理解、积极实践',
                    '把握机遇，应对挑战，创造价值',
                    '期待与大家共同探索，携手前行'
                ]
            });

            // 致谢页
            slides.push({
                type: 'thanks',
                title: '感谢聆听',
                subtitle: 'THANK YOU'
            });

            return slides;
        }

        function getSubtitle(style) {
            const subtitles = {
                business: '专业 · 高效 · 价值',
                creative: '创意 · 灵感 · 设计',
                education: '学习 · 思考 · 成长',
                minimal: '简洁 · 清晰 · 专注'
            };
            return subtitles[style] || '智能生成演示文稿';
        }

        function generatePoint(chapter, pointBase, theme, index) {
            const prefixes = ['深入理解', '全面掌握', '重点关注', '积极探索', '系统学习', '充分认识', '有效运用', '科学规划'];
            const suffixes = ['', '的重要性', '的关键方法', '的核心要点', '的实践路径', '的发展方向'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            return `${pointBase}：${prefix}${theme}相关领域中${chapter}${suffix}`;
        }

        // 生成PPT
        function generatePPT() {
            const theme = document.getElementById('themeInput').value.trim();
            if (!theme) {
                showToast('请输入PPT主题');
                return;
            }

            currentTheme = theme;
            document.getElementById('loadingOverlay').classList.add('show');

            // 模拟AI生成延迟
            setTimeout(() => {
                currentSlides = generatePPTContent(theme, selectedPages, selectedStyle);
                currentPage = 0;
                
                // 保存到历史记录
                saveToHistory(theme, selectedPages, selectedStyle, currentSlides);
                
                document.getElementById('loadingOverlay').classList.remove('show');
                showPreview();
            }, 2000);
        }

        // 渲染缩略图
        function renderThumbnails() {
            const container = document.getElementById('thumbnailList');
            container.innerHTML = '';
            
            currentSlides.forEach((slide, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail-item' + (index === currentPage ? ' active' : '');
                thumb.innerHTML = `
                    <div class="thumb-num">${index + 1}</div>
                    <div class="thumb-title">${slide.title}</div>
                `;
                thumb.addEventListener('click', () => {
                    currentPage = index;
                    renderThumbnails();
                    renderCurrentSlide();
                });
                container.appendChild(thumb);
            });
        }

        // 渲染当前幻灯片
        function renderCurrentSlide() {
            const slide = currentSlides[currentPage];
            const container = document.getElementById('slideContainer');
            const titleEl = document.getElementById('slideTitle');
            const contentEl = document.getElementById('slideContent');

            // 设置容器类型
            container.className = 'slide-container ' + slide.type;

            if (slide.type === 'cover') {
                titleEl.textContent = slide.title;
                titleEl.contentEditable = 'true';
                contentEl.innerHTML = `<div class="slide-subtitle" contenteditable="true">${slide.subtitle}</div>`;
            } else if (slide.type === 'toc') {
                titleEl.textContent = slide.title;
                titleEl.contentEditable = 'true';
                let tocHtml = '<ul>';
                slide.chapters.forEach((chapter, i) => {
                    tocHtml += `<li contenteditable="true">${i + 1}. ${chapter}</li>`;
                });
                tocHtml += '</ul>';
                contentEl.innerHTML = tocHtml;
            } else if (slide.type === 'content' || slide.type === 'summary') {
                titleEl.textContent = slide.title;
                titleEl.contentEditable = 'true';
                let contentHtml = '<ul>';
                slide.points.forEach(point => {
                    contentHtml += `<li contenteditable="true">${point}</li>`;
                });
                contentHtml += '</ul>';
                contentEl.innerHTML = contentHtml;
            } else if (slide.type === 'thanks') {
                titleEl.textContent = slide.title;
                titleEl.contentEditable = 'true';
                contentEl.innerHTML = `<div class="slide-subtitle" contenteditable="true">${slide.subtitle}</div>`;
            }

            // 更新页码
            document.getElementById('pageIndicator').textContent = `${currentPage + 1}/${currentSlides.length}`;
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentPage === 0;
            document.getElementById('nextBtn').disabled = currentPage === currentSlides.length - 1;

            // 监听编辑事件
            attachEditListeners();
        }

        // 监听编辑
        function attachEditListeners() {
            const titleEl = document.getElementById('slideTitle');
            const contentEl = document.getElementById('slideContent');

            titleEl.addEventListener('blur', () => {
                currentSlides[currentPage].title = titleEl.textContent;
                renderThumbnails();
            });

            const editableItems = contentEl.querySelectorAll('[contenteditable="true"]');
            editableItems.forEach((item, index) => {
                item.addEventListener('blur', () => {
                    const slide = currentSlides[currentPage];
                    if (slide.type === 'toc') {
                        slide.chapters[index] = item.textContent.replace(/^\d+\.\s*/, '');
                    } else if (slide.type === 'cover' || slide.type === 'thanks') {
                        slide.subtitle = item.textContent;
                    } else {
                        slide.points[index] = item.textContent;
                    }
                    renderThumbnails();
                });
            });
        }

                currentPage--;
                renderThumbnails();
                renderCurrentSlide();

            if (currentPage < currentSlides.length - 1) {

        // 复制全部文本
        function copyAllText() {
            hideExportModal();
            
            let text = `${currentTheme}\n\n`;
            currentSlides.forEach((slide, index) => {
                text += `===== 第${index + 1}页：${slide.title} =====\n`;
                if (slide.subtitle) {
                    text += slide.subtitle + '\n';
                }
                if (slide.chapters) {
                    slide.chapters.forEach((c, i) => {
                        text += `${i + 1}. ${c}\n`;
                    });
                }
                if (slide.points) {
                    slide.points.forEach(p => {
                        text += `• ${p}\n`;
                    });
                }
                text += '\n';
            });

            navigator.clipboard.writeText(text).then(() => {
                showToast('文本已复制到剪贴板！');
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('文本已复制到剪贴板！');
            });
        }

        // 历史记录相关
        function getHistoryKey() {
            return 'ai_ppt_history';
        }

        function saveToHistory(theme, pages, style, slides) {
            const history = getHistory();
            const record = {
                id: Date.now(),
                theme: theme,
                pages: pages,
                style: style,
                styleName: getStyleName(style),
                slides: JSON.parse(JSON.stringify(slides)),
                createTime: new Date().toLocaleString('zh-CN')
            };
            history.unshift(record);
            // 最多保存20条
            if (history.length > 20) {
                history.pop();
            }
            localStorage.setItem(getHistoryKey(), JSON.stringify(history));
        }

        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem(getHistoryKey())) || [];
            } catch (e) {
                return [];
            }
        }

        function getStyleName(style) {
            const names = {
                business: '专业商务',
                creative: '创意设计',
                education: '学术教育',
                minimal: '简约清新'
            };
            return names[style] || '通用';
        }

        function showHistory() {
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('previewPage').classList.remove('active');
            document.getElementById('historyPage').classList.add('active');
            renderHistoryList();
        }

        function renderHistoryList() {
            const container = document.getElementById('historyList');
            const history = getHistory();

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-history">
                        <div class="empty-icon">📭</div>
                        <p>暂无历史记录</p>
                        <p style="margin-top:8px;font-size:12px;">生成的PPT会自动保存在这里</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            history.forEach(record => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-card-content">
                        <div class="history-card-theme">${record.theme}</div>
                        <div class="history-card-meta">
                            <span>📄 ${record.pages}页</span>
                            <span>🎨 ${record.styleName}</span>
                            <span>🕐 ${record.createTime}</span>
                        </div>
                    </div>
                    <button class="history-delete">删除</button>
                `;

                // 点击查看
                card.querySelector('.history-card-content').addEventListener('click', () => {
                    currentSlides = JSON.parse(JSON.stringify(record.slides));
                    currentTheme = record.theme;
                    selectedStyle = record.style;
                    selectedPages = record.pages;
                    currentPage = 0;
                    showPreview();
                });

                // 删除按钮
                card.querySelector('.history-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteHistory(record.id);
                });

                // 左滑删除
                let startX = 0;
                let currentX = 0;
                let isSwiping = false;

                card.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isSwiping = true;
                });

                card.addEventListener('touchmove', (e) => {
                    if (!isSwiping) return;
                    currentX = e.touches[0].clientX;
                    const diff = startX - currentX;
                    if (diff > 0 && diff < 80) {
                        card.querySelector('.history-card-content').style.transform = `translateX(-${diff}px)`;
                        card.querySelector('.history-delete').style.transform = `translateX(${80 - diff}px)`;
                    }
                });

                card.addEventListener('touchend', () => {
                    isSwiping = false;
                    const diff = startX - currentX;
                    if (diff > 40) {
                        card.classList.add('swiped');
                    } else {
                        card.classList.remove('swiped');
                        card.querySelector('.history-card-content').style.transform = '';
                        card.querySelector('.history-delete').style.transform = '';
                    }
                });

                container.appendChild(card);
            });
        }

        function deleteHistory(id) {
            let history = getHistory();
            history = history.filter(r => r.id !== id);
            localStorage.setItem(getHistoryKey(), JSON.stringify(history));
            renderHistoryList();
            showToast('已删除');
        }

        // 键盘快捷键（PC端调试用）
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('previewPage').classList.contains('active')) {
                if (e.key === 'ArrowLeft') prevPage();
                if (e.key === 'ArrowRight') nextPage();
            }
        });
    </script>
</body>
</html>
