function getSeriesColor(brand, series) {
  const bc = BRAND_CONFIG[brand];
  if (bc && bc.series && bc.series[series]) return bc.series[series];
  if (bc) return bc.main;
  // 新品牌随机颜色
  let hash = 0;
  for (let i = 0; i < (brand + series).length; i++) hash = (hash * 31 + (brand + series).charCodeAt(i)) & 0xffffff;
  const colors = ['#283593','#c62828','#1565c0','#ef6c00','#546e7a','#00796b','#9c27b0','#e65100','#2e7d32','#ad1457'];
  return colors[hash % colors.length];
}

function getBrandMainColor(brand) {
  return BRAND_CONFIG[brand] ? BRAND_CONFIG[brand].main : '#666';
}

function loadData() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { quotes = JSON.parse(stored); }
    catch(e) { initDefault(); }
  } else {
    initDefault();
  }
  // 加载自定义品牌
  const cb = localStorage.getItem(CUSTOM_BRANDS_KEY);
  if (cb) {
    try {
      const custom = JSON.parse(cb);
      custom.forEach(b => { if (!BRAND_CONFIG[b.name]) BRAND_CONFIG[b.name] = b.config; });
    } catch(e) {}
  }
  // 加载可见品牌
  const vb = localStorage.getItem(BRAND_VISIBLE_KEY);
  if (vb) {
    try { currentVisibleBrands = JSON.parse(vb); } catch(e) {}
  } else {
    currentVisibleBrands = Object.keys(BRAND_CONFIG);
  }
}
function initDefault() {
  quotes = DEFAULT_DATA.map((q, i) => ({ id: i+1, ...q }));
  saveData();
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes)); }
function saveCustomBrands() {
  const custom = [];
  Object.keys(BRAND_CONFIG).forEach(b => {
    if (!['OPPO','华为','荣耀','小米','红米','壹加','vivo','真我'].includes(b)) {
      custom.push({ name: b, config: BRAND_CONFIG[b] });
    }
  });
  localStorage.setItem(CUSTOM_BRANDS_KEY, JSON.stringify(custom));
}

const CUSTOM_DATE_KEY = 'recycle_custom_date';
let useCustomDate = false;

function showDate() {
  const customDate = localStorage.getItem(CUSTOM_DATE_KEY);
  const dateEl = document.getElementById('dateDisplay');
  if (customDate) {
    dateEl.textContent = customDate;
    useCustomDate = true;
  } else {
    const d = new Date();
    dateEl.textContent = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
    useCustomDate = false;
  }
}

function openDateEditor() {
  const customDate = localStorage.getItem(CUSTOM_DATE_KEY);
  const d = new Date();
  const todayStr = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  document.getElementById('dateInput').value = customDate || todayStr;
  document.getElementById('dateModal').classList.add('show');
  setTimeout(() => document.getElementById('dateInput').focus(), 100);
}

document.getElementById('dateDisplay').addEventListener('click', openDateEditor);
document.getElementById('dateCancel').addEventListener('click', () => {
  document.getElementById('dateModal').classList.remove('show');
});
document.getElementById('dateConfirm').addEventListener('click', () => {
  const val = document.getElementById('dateInput').value.trim();
  if (val) {
    localStorage.setItem(CUSTOM_DATE_KEY, val);
    showDate();
    toast('日期已更新');
  }
  document.getElementById('dateModal').classList.remove('show');
});
document.getElementById('dateToday').addEventListener('click', () => {
  const d = new Date();
  document.getElementById('dateInput').value = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
});
document.getElementById('dateReset').addEventListener('click', () => {
  localStorage.removeItem(CUSTOM_DATE_KEY);
  showDate();
  document.getElementById('dateModal').classList.remove('show');
  toast('已恢复自动更新日期');
});
document.getElementById('dateModal').addEventListener('click', e => {
  if (e.target.id === 'dateModal') document.getElementById('dateModal').classList.remove('show');
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function getBrandCount(brand) {
  return quotes.filter(q => q.brand === brand).length;
}

function getSeriesList(brand) {
  const s = new Set();
  quotes.filter(q => q.brand === brand).forEach(q => s.add(q.series));
  return [...s];
}

// ========== 渲染品牌Tab ==========
function renderBrandTabs() {
  const container = document.getElementById('brandTabs');
  container.innerHTML = '';
  currentVisibleBrands.forEach(brand => {
    const tab = document.createElement('div');
    tab.className = 'brand-tab' + (brand === currentBrand ? ' active' : '');
    const color = getBrandMainColor(brand);
    tab.innerHTML = `${brand} <span class="count">${getBrandCount(brand)}</span>`;
    tab.addEventListener('click', () => {
      currentBrand = brand;
      renderBrandTabs();
      render();
    });
    container.appendChild(tab);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'brand-add';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', showAddBrandDialog);
  container.appendChild(addBtn);
}

// ========== 渲染表格 ==========
function getFiltered() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  return quotes
    .filter(q => q.brand === currentBrand)
    .filter(q => !kw || q.series.toLowerCase().includes(kw) || q.model.toLowerCase().includes(kw))
    .sort((a,b) => {
      if (a.series !== b.series) return a.series.localeCompare(b.series, 'zh');
      // 尝试数字排序
      const na = a.model.match(/\d+/);
      const nb = b.model.match(/\d+/);
      if (na && nb) {
        const diff = parseInt(nb[0]) - parseInt(na[0]);
        if (diff !== 0) return -diff;
      }
      return a.model.localeCompare(b.model, 'zh');
    });
}

function render() {
  const tbody = document.getElementById('tableBody');
  const data = getFiltered();
  tbody.innerHTML = '';
  let lastSeries = '';
  data.forEach(q => {
    const tr = document.createElement('tr');
    const seriesBg = getSeriesColor(q.brand, q.series);
    tr.innerHTML = `
      <td class="series-cell" style="background:${seriesBg}">${q.series}</td>
      <td class="model-cell">${q.model}</td>
      <td class="price-screen">${Math.round(q.s)}</td>
      <td class="price-notboot">${Math.round(q.n)}</td>
      <td class="price-board">${Math.round(q.b)}</td>
      <td class="price-full">${Math.round(q.f)}</td>
    `;
    tr.addEventListener('click', () => openEdit(q.id));
    let pressTimer;
    tr.addEventListener('touchstart', e => {
      // 双指操作时不启动长按
      if (e.touches.length > 1) {
        clearTimeout(pressTimer);
        return;
      }
      pressTimer = setTimeout(() => openDelete(q.id), 500);
    }, {passive: true});
    tr.addEventListener('touchend', () => clearTimeout(pressTimer));
    tr.addEventListener('touchmove', () => clearTimeout(pressTimer));
    tr.addEventListener('contextmenu', e => { e.preventDefault(); openDelete(q.id); });
    tbody.appendChild(tr);
    lastSeries = q.series;
  });
  applyScale();
  updateBrandSelect();
}

function applyScale() {
  const wrapper = document.getElementById('tableWrapper');
  // 使用CSS zoom进行真实布局缩放，sticky表头能正常工作
  wrapper.style.zoom = scale;
  const hint = document.getElementById('scaleHint');
  hint.textContent = '缩放: ' + Math.round(scale * 100) + '%';
  hint.classList.add('show');
  clearTimeout(hint._t);
  hint._t = setTimeout(() => hint.classList.remove('show'), 1200);
}

// 双指缩放（使用CSS zoom整体缩放，表头正常固定）
let initialDist = 0, initialScale = 1;
let isPinching = false;
const tableContainer = document.getElementById('tableContainer');

tableContainer.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isPinching = true;
    const t1 = e.touches[0], t2 = e.touches[1];
    initialDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    initialScale = scale;
  }
}, {passive: true});

tableContainer.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
    if (initialDist > 0) {
      scale = Math.max(0.5, Math.min(initialScale * (dist / initialDist), 3));
      applyScale();
    }
  }
}, {passive: false});

tableContainer.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    isPinching = false;
    initialDist = 0;
  }
}, {passive: true});

// 双击重置缩放
let lastTap = 0;
tableContainer.addEventListener('touchend', e => {
  if (e.touches.length === 0 && e.changedTouches.length === 1 && !isPinching) {
    const now = Date.now();
    if (now - lastTap < 300) {
      scale = 1;
      applyScale();
    }
    lastTap = now;
  }
});

// Ctrl+滚轮缩放（电脑端）
tableContainer.addEventListener('wheel', e => {
  if (e.ctrlKey) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.max(0.5, Math.min(scale * delta, 3));
    applyScale();
  }
}, {passive: false});

// ========== 添加/编辑 ==========
function updateBrandSelect() {
  const sel = document.getElementById('editBrand');
  if (!sel) return;
  const val = sel.value;
  sel.innerHTML = '';
  Object.keys(BRAND_CONFIG).forEach(b => {
    const opt = document.createElement('option');
    opt.value = b;
    opt.textContent = b;
    if (b === currentBrand) opt.selected = true;
    sel.appendChild(opt);
  });
  if (val && BRAND_CONFIG[val]) sel.value = val;
}

function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '添加机型';
  updateBrandSelect();
  document.getElementById('editBrand').value = currentBrand;
  document.getElementById('editSeries').value = '';
  document.getElementById('editModel').value = '';
  document.getElementById('editScreen').value = '';
  document.getElementById('editNotBoot').value = '';
  document.getElementById('editBoard').value = '';
  document.getElementById('editFull').value = '';
  document.getElementById('editModal').classList.add('show');
}

function openEdit(id) {
  const q = quotes.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '编辑机型';
  updateBrandSelect();
  document.getElementById('editBrand').value = q.brand;
  document.getElementById('editSeries').value = q.series;
  document.getElementById('editModel').value = q.model;
  document.getElementById('editScreen').value = q.s;
  document.getElementById('editNotBoot').value = q.n;
  document.getElementById('editBoard').value = q.b;
  document.getElementById('editFull').value = q.f;
  document.getElementById('editModal').classList.add('show');
}

function closeEdit() { document.getElementById('editModal').classList.remove('show'); }

function saveEdit() {
  const brand = document.getElementById('editBrand').value;
  const series = document.getElementById('editSeries').value.trim();
  const model = document.getElementById('editModel').value.trim();
  const s = parseInt(document.getElementById('editScreen').value) || 0;
  const n = parseInt(document.getElementById('editNotBoot').value) || 0;
  const b = parseInt(document.getElementById('editBoard').value) || 0;
  const f = parseInt(document.getElementById('editFull').value) || 0;
  if (!series) { toast('请输入系列'); return; }
  if (!model) { toast('请输入型号'); return; }
  if (editingId) {
    const q = quotes.find(x => x.id === editingId);
    if (q) { q.brand = brand; q.series = series; q.model = model; q.s = s; q.n = n; q.b = b; q.f = f; }
    toast('修改成功');
  } else {
    const newId = quotes.length ? Math.max(...quotes.map(x => x.id)) + 1 : 1;
    quotes.push({ id: newId, brand, series, model, s, n, b, f });
    toast('添加成功');
  }
  saveData();
  closeEdit();
  currentBrand = brand;
  renderBrandTabs();
  render();
}

// ========== 删除 ==========
function openDelete(id) {
  const q = quotes.find(x => x.id === id);
  if (!q) return;
  deleteId = id;
  document.getElementById('deleteMsg').textContent = `确定要删除 ${q.brand} ${q.series} ${q.model} 吗？`;
  document.getElementById('deleteModal').classList.add('show');
}
function closeDelete() { document.getElementById('deleteModal').classList.remove('show'); deleteId = null; }
function confirmDelete() {
  quotes = quotes.filter(x => x.id !== deleteId);
  saveData();
  closeDelete();
  toast('删除成功');
  renderBrandTabs();
  render();
}

// ========== 品牌管理 ==========
function openBrandDialog() {
  const list = document.getElementById('brandList');
  list.innerHTML = '';
  Object.keys(BRAND_CONFIG).forEach(b => {
    const div = document.createElement('label');
    div.className = 'checkbox-item';
    const checked = currentVisibleBrands.includes(b) ? 'checked' : '';
    const color = getBrandMainColor(b);
    div.innerHTML = `<input type="checkbox" value="${b}" ${checked}> <span class="color-dot" style="background:${color}"></span><span>${b}</span>`;
    list.appendChild(div);
  });
  document.getElementById('brandDialog').classList.add('show');
}
document.getElementById('brandConfirm').addEventListener('click', () => {
  const checked = [...document.querySelectorAll('#brandList input:checked')].map(i => i.value);
  currentVisibleBrands = checked.length ? checked : Object.keys(BRAND_CONFIG);
  localStorage.setItem(BRAND_VISIBLE_KEY, JSON.stringify(currentVisibleBrands));
  if (!currentVisibleBrands.includes(currentBrand)) {
    currentBrand = currentVisibleBrands[0] || 'OPPO';
  }
  document.getElementById('brandDialog').classList.remove('show');
  renderBrandTabs();
  render();
});

// ========== 添加自定义品牌 ==========
function showAddBrandDialog() {
  newBrandSelectedColor = COLOR_PALETTE[0];
  document.getElementById('newBrandName').value = '';
  const picker = document.getElementById('colorPicker');
  picker.innerHTML = '';
  COLOR_PALETTE.forEach(c => {
    const dot = document.createElement('div');
    dot.style.cssText = `width:36px;height:36px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c === newBrandSelectedColor ? '#333' : 'transparent'};`;
    dot.dataset.color = c;
    dot.addEventListener('click', () => {
      newBrandSelectedColor = c;
      [...picker.children].forEach(ch => ch.style.border = '3px solid transparent');
      dot.style.border = '3px solid #333';
    });
    picker.appendChild(dot);
  });
  document.getElementById('addBrandModal').classList.add('show');
}
document.getElementById('addBrandCancel').addEventListener('click', () => {
  document.getElementById('addBrandModal').classList.remove('show');
});
document.getElementById('addBrandConfirm').addEventListener('click', () => {
  const name = document.getElementById('newBrandName').value.trim();
  if (!name) { toast('请输入品牌名称'); return; }
  if (BRAND_CONFIG[name]) { toast('该品牌已存在'); return; }
  BRAND_CONFIG[name] = { main: newBrandSelectedColor, series: {} };
  currentVisibleBrands.push(name);
  currentBrand = name;
  saveCustomBrands();
  localStorage.setItem(BRAND_VISIBLE_KEY, JSON.stringify(currentVisibleBrands));
  document.getElementById('addBrandModal').classList.remove('show');
  renderBrandTabs();
  render();
  toast('品牌添加成功');
});

// ========== 批量调价 ==========
function openAdjustDialog() {
  pendingAdjustBrand = null;
  pendingAdjustSeries = null;
  const list = document.getElementById('adjustList');
  list.innerHTML = '<div class="title">选择调整范围</div>';
  const allItem = document.createElement('div');
  allItem.className = 'item';
  allItem.textContent = '全部品牌全部系列';
  allItem.addEventListener('click', () => {
    pendingAdjustBrand = null;
    pendingAdjustSeries = null;
    document.getElementById('adjustDialog').classList.remove('show');
    document.getElementById('percentDialog').classList.add('show');
  });
  list.appendChild(allItem);
  const curBrand = document.createElement('div');
  curBrand.className = 'item';
  curBrand.innerHTML = `<span class="color-dot" style="background:${getBrandMainColor(currentBrand)}"></span>${currentBrand}（全部系列）`;
  curBrand.addEventListener('click', () => {
    pendingAdjustBrand = currentBrand;
    pendingAdjustSeries = null;
    document.getElementById('adjustDialog').classList.remove('show');
    document.getElementById('percentDialog').classList.add('show');
  });
  list.appendChild(curBrand);
  // 系列列表
  const seriesList = getSeriesList(currentBrand);
  seriesList.forEach(s => {
    const item = document.createElement('div');
    item.className = 'item';
    const sc = getSeriesColor(currentBrand, s);
    item.innerHTML = `<span class="color-dot" style="background:${sc}"></span>${currentBrand} - ${s}`;
    item.addEventListener('click', () => {
      pendingAdjustBrand = currentBrand;
      pendingAdjustSeries = s;
      document.getElementById('adjustDialog').classList.remove('show');
      document.getElementById('percentDialog').classList.add('show');
    });
    list.appendChild(item);
  });
  document.getElementById('adjustTitle').textContent = '选择调整范围';
  document.getElementById('adjustDialog').classList.add('show');
}

document.querySelectorAll('#percentDialog .item[data-percent]').forEach(item => {
  item.addEventListener('click', () => {
    const p = item.dataset.percent;
    document.getElementById('percentDialog').classList.remove('show');
    if (p === 'custom') {
      document.getElementById('customPercentInput').value = '';
      document.getElementById('customPercentModal').classList.add('show');
    } else {
      applyAdjust(parseFloat(p));
    }
  });
});

document.getElementById('customCancel').addEventListener('click', () => {
  document.getElementById('customPercentModal').classList.remove('show');
});
document.getElementById('customConfirm').addEventListener('click', () => {
  const val = parseInt(document.getElementById('customPercentInput').value);
  if (!val || val <= 0) { toast('请输入有效数字'); return; }
  document.getElementById('customPercentModal').classList.remove('show');
  applyAdjust(val / 100);
});

function applyAdjust(percent) {
  let count = 0;
  quotes.forEach(q => {
    if (pendingAdjustBrand && q.brand !== pendingAdjustBrand) return;
    if (pendingAdjustSeries && q.series !== pendingAdjustSeries) return;
    q.s = Math.round(q.s * percent);
    q.n = Math.round(q.n * percent);
    q.b = Math.round(q.b * percent);
    q.f = Math.round(q.f * percent);
    count++;
  });
  saveData();
  render();
  toast(`已调整 ${count} 条记录`);
}

// ========== 批量导入 ==========
function openImportDialog() {
  document.getElementById('importText').value = '';
  document.getElementById('importModal').classList.add('show');
}
document.getElementById('importCancel').addEventListener('click', () => {
  document.getElementById('importModal').classList.remove('show');
});
document.getElementById('importConfirm').addEventListener('click', () => {
  const text = document.getElementById('importText').value.trim();
  if (!text) { toast('请输入数据'); return; }
  const lines = text.split('\n').filter(l => l.trim());
  let count = 0, maxId = quotes.length ? Math.max(...quotes.map(x => x.id)) : 0;
  lines.forEach(line => {
    const parts = line.split(/[,，\t|]/).map(p => p.trim());
    if (parts.length >= 3) {
      const brand = parts[0];
      const series = parts[1];
      const model = parts[2];
      const s = parseInt(parts[3]) || 0;
      const n = parseInt(parts[4]) || 0;
      const b = parseInt(parts[5]) || 0;
      const f = parseInt(parts[6]) || 0;
      if (brand && series && model) {
        maxId++;
        quotes.push({ id: maxId, brand, series, model, s, n, b, f });
        // 如果是新品牌，添加默认颜色
        if (!BRAND_CONFIG[brand]) {
          let hash = 0;
          for (let i = 0; i < brand.length; i++) hash = (hash * 31 + brand.charCodeAt(i)) & 0xffffff;
          const colors = ['#283593','#c62828','#1565c0','#ef6c00','#546e7a','#00796b','#9c27b0','#e65100','#2e7d32','#ad1457'];
          BRAND_CONFIG[brand] = { main: colors[hash % colors.length], series: {} };
          if (!currentVisibleBrands.includes(brand)) currentVisibleBrands.push(brand);
          saveCustomBrands();
        }
        count++;
      }
    }
  });
  saveData();
  localStorage.setItem(BRAND_VISIBLE_KEY, JSON.stringify(currentVisibleBrands));
  document.getElementById('importModal').classList.remove('show');
  renderBrandTabs();
  render();
  toast(`成功导入 ${count} 条记录`);
});

// 点击遮罩关闭子对话框
document.querySelectorAll('.sub-dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d) d.classList.remove('show'); });
});

// ========== 顶部按钮 & 浮动按钮事件 ==========
document.getElementById('topAddBtn').addEventListener('click', openAdd);
document.getElementById('fabAdd').addEventListener('click', openAdd);
document.getElementById('topMenuBtn').addEventListener('click', e => {
  e.stopPropagation();
  const rect = e.target.getBoundingClientRect();
  const menu = document.getElementById('popupMenu');
  menu.style.top = rect.bottom + 4 + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.style.left = 'auto';
  menu.classList.toggle('show');
});

// 弹出菜单点击
document.getElementById('popupMenu').addEventListener('click', e => {
  const action = e.target.dataset.action;
  if (!action) return;
  document.getElementById('popupMenu').classList.remove('show');
  switch(action) {
    case 'add': openAdd(); break;
    case 'brand': openBrandDialog(); break;
    case 'adjust': openAdjustDialog(); break;
    case 'import': openImportDialog(); break;
    case 'addBrand': showAddBrandDialog(); break;
    case 'reset':
      if (confirm('确定要重置所有数据吗？这将恢复到初始预置数据。')) {
        initDefault();
        currentBrand = 'OPPO';
        currentVisibleBrands = Object.keys(BRAND_CONFIG);
        localStorage.setItem(BRAND_VISIBLE_KEY, JSON.stringify(currentVisibleBrands));
        renderBrandTabs();
        render();
        toast('数据已重置');
      }
      break;
  }
});
document.addEventListener('click', () => document.getElementById('popupMenu').classList.remove('show'));

// ========== 模态框按钮事件 ==========
document.getElementById('modalCancel').addEventListener('click', closeEdit);
document.getElementById('modalConfirm').addEventListener('click', saveEdit);
document.getElementById('deleteCancel').addEventListener('click', closeDelete);
document.getElementById('deleteConfirm').addEventListener('click', confirmDelete);
document.getElementById('searchInput').addEventListener('input', render);

// 点击遮罩关闭模态框
document.getElementById('editModal').addEventListener('click', e => { if (e.target.id === 'editModal') closeEdit(); });
document.getElementById('deleteModal').addEventListener('click', e => { if (e.target.id === 'deleteModal') closeDelete(); });
document.getElementById('importModal').addEventListener('click', e => { if (e.target.id === 'importModal') document.getElementById('importModal').classList.remove('show'); });
document.getElementById('customPercentModal').addEventListener('click', e => { if (e.target.id === 'customPercentModal') document.getElementById('customPercentModal').classList.remove('show'); });
document.getElementById('addBrandModal').addEventListener('click', e => { if (e.target.id === 'addBrandModal') document.getElementById('addBrandModal').classList.remove('show'); });

// ========== 初始化 ==========
loadData();
showDate();
renderBrandTabs();
render();
</script>
