let state = {
  brands: [],
  items: [],
  activeBrandId: null,
  searchQuery: '',
  batchMode: false,
  selectedIds: new Set(),
  dateStr: '',
  scale: 1,
  history: [],
  importUnlocked: false,
  longPressTimer: null,
  longPressTriggered: false
};

function genId() { return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5); }
function genBrandId() { return 'b_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 5); }

function formatDate(d) {
  return d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日';
}

// ==================== 持久化 ====================
function saveData() {
  try {
    const data = {
      brands: state.brands,
      items: state.items,
      dateStr: state.dateStr,
      history: state.history,
      importUnlocked: state.importUnlocked
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.error('saveData error:', e); }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.brands = data.brands || [...DEFAULT_BRANDS];
      state.items = data.items || [];
      state.dateStr = data.dateStr || formatDate(new Date());
      state.history = data.history || [];
      state.importUnlocked = data.importUnlocked || false;
    } else {
      state.brands = [...DEFAULT_BRANDS];
      state.items = generateSampleData();
      state.dateStr = formatDate(new Date());
      state.history = [];
    }
    state.activeBrandId = state.brands[0]?.id || null;
  } catch(e) {
    console.error('loadData error:', e);
    state.brands = [...DEFAULT_BRANDS];
    state.items = generateSampleData();
    state.dateStr = formatDate(new Date());
    state.activeBrandId = state.brands[0].id;
  }
}

function saveSnapshot(label) {
  const snapshot = {
    time: new Date().toLocaleString('zh-CN'),
    label: label || '自动保存',
    brands: JSON.parse(JSON.stringify(state.brands)),
    items: JSON.parse(JSON.stringify(state.items))
  };
  state.history.unshift(snapshot);
  if (state.history.length > 5) state.history = state.history.slice(0, 5);
  saveData();
}

// ==================== 工具函数 ====================
function getBrand(id) { return state.brands.find(b => b.id === id); }
function getBrandCount(id) { return state.items.filter(i => i.brandId === id).length; }

function getFilteredItems() {
  let items = state.items;
  if (state.activeBrandId) {
    items = items.filter(i => i.brandId === state.activeBrandId);
  }
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    const brandMap = {};
    state.brands.forEach(b => brandMap[b.id] = b.name.toLowerCase());
    items = items.filter(i => {
      return (i.series && i.series.toLowerCase().includes(q)) ||
             (i.model && i.model.toLowerCase().includes(q)) ||
             (brandMap[i.brandId] && brandMap[i.brandId].includes(q));
    });
  }
  return items;
}

// 颜色工具 - 调整亮度用于系列列背景
function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + amount;
  let g = ((num >> 8) & 0xff) + amount;
  let b = (num & 0xff) + amount;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// ==================== 渲染 ====================
function renderBrands() {
  const container = document.getElementById('brandTabs');
  container.innerHTML = '';
  state.brands.forEach(brand => {
    const tab = document.createElement('div');
    tab.className = 'brand-tab' + (brand.id === state.activeBrandId ? ' active' : '');
    tab.innerHTML = `<span class="brand-name" style="color:${brand.id === state.activeBrandId ? brand.color : 'inherit'}">${brand.name}</span><span class="badge">${getBrandCount(brand.id)}</span>`;
    tab.onclick = (e) => {
      if (state.longPressTriggered) { state.longPressTriggered = false; return; }
      state.activeBrandId = brand.id;
      state.selectedIds.clear();
      renderBrands();
      renderTable();
    };
    // 长按品牌标签进入品牌管理
    let lpTimer;
    tab.addEventListener('touchstart', () => {
      lpTimer = setTimeout(() => {
        state.longPressTriggered = true;
        openBrandManager();
      }, 600);
    });
    tab.addEventListener('touchend', () => clearTimeout(lpTimer));
    tab.addEventListener('touchmove', () => clearTimeout(lpTimer));
    container.appendChild(tab);
  });
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const items = getFilteredItems();
  const brand = getBrand(state.activeBrandId);
  const showCheckbox = state.batchMode;

  document.getElementById('thCheckbox').classList.toggle('show', showCheckbox);

  tbody.innerHTML = '';

  if (items.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="${showCheckbox ? 7 : 6}" style="text-align:center;padding:60px 20px;color:#999;">
      <div style="font-size:48px;margin-bottom:12px;opacity:0.4;">📱</div>
      <p>暂无数据，点击右上角 + 添加</p>
    </td>`;
    tbody.appendChild(tr);
    updateSelectedInfo();
    if (window._syncHeader) setTimeout(window._syncHeader, 30);
    return;
  }

  // 按系列分组排序
  const seriesMap = {};
  items.forEach(item => {
    if (!seriesMap[item.series]) seriesMap[item.series] = [];
    seriesMap[item.series].push(item);
  });

  const sortedSeries = Object.keys(seriesMap);

  sortedSeries.forEach(seriesName => {
    const seriesItems = seriesMap[seriesName];
    seriesItems.forEach((item, idx) => {
      const tr = document.createElement('tr');
      tr.dataset.id = item.id;
      const isFirstInSeries = idx === 0;

      // 系列列颜色：使用品牌色，稍微调整
      const seriesBgColor = brand ? adjustColor(brand.color, -20) : '#1e40af';
      const seriesBgColor2 = brand ? adjustColor(brand.color, -10) : '#2563eb';

      let checkHtml = '';
      if (showCheckbox) {
        const checked = state.selectedIds.has(item.id) ? 'checked' : '';
        checkHtml = `<td class="cell-checkbox show"><input type="checkbox" ${checked} onchange="toggleSelect('${item.id}', this.checked)"></td>`;
      }

      tr.innerHTML = `
        ${checkHtml}
        <td class="cell-series" style="background:linear-gradient(135deg,${seriesBgColor},${seriesBgColor2});" data-field="series">${item.series || ''}</td>
        <td class="cell-model" data-field="model">${item.model || ''}</td>
        <td class="cell-price p1" data-field="p1">${item.p1 != null ? item.p1 : ''}</td>
        <td class="cell-price p2" data-field="p2">${item.p2 != null ? item.p2 : ''}</td>
        <td class="cell-price p3" data-field="p3">${item.p3 != null ? item.p3 : ''}</td>
        <td class="cell-price p4" data-field="p4">${item.p4 != null ? item.p4 : ''}</td>
      `;

      // 单元格点击编辑
      tr.querySelectorAll('td[data-field]').forEach(td => {
        td.addEventListener('click', (e) => {
          if (state.batchMode) return;
          startEdit(td, item.id, td.dataset.field);
        });
      });

      // 长按行删除
      let longPressTimer;
      let longPressFired = false;
      tr.addEventListener('touchstart', (e) => {
        if (state.batchMode) return;
        longPressFired = false;
        longPressTimer = setTimeout(() => {
          longPressFired = true;
          if (navigator.vibrate) navigator.vibrate(50);
          confirmDeleteRow(item.id);
        }, 600);
      });
      tr.addEventListener('touchend', () => clearTimeout(longPressTimer));
      tr.addEventListener('touchmove', () => clearTimeout(longPressTimer));
      tr.addEventListener('click', (e) => {
        if (longPressFired) { e.preventDefault(); e.stopPropagation(); }
      });

      tbody.appendChild(tr);
    });
  });

  updateSelectedInfo();
  // 同步表头宽度和位置
  if (window._syncHeader) setTimeout(window._syncHeader, 30);
}

// ==================== 单元格编辑 ====================
let currentEditCell = null;

function startEdit(td, itemId, field) {
  if (currentEditCell) endEdit();
  currentEditCell = { td, itemId, field };
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  const value = item[field] != null ? item[field] : '';
  const isPrice = ['p1','p2','p3','p4'].includes(field);
  td.innerHTML = `<input class="cell-edit" type="${isPrice ? 'number' : 'text'}" value="${value}" style="text-align:${td.classList.contains('cell-model') ? 'left' : 'center'}">`;
  const input = td.querySelector('input');
  input.focus();
  if (isPrice) input.inputMode = 'numeric';
  // 选中文本
  setTimeout(() => {
    input.select();
  }, 50);

  input.addEventListener('blur', () => endEdit());
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Tab') { e.preventDefault(); input.blur(); }
  });
}

function endEdit() {
  if (!currentEditCell) return;
  const { td, itemId, field } = currentEditCell;
  const input = td.querySelector('input');
  if (input) {
    let val = input.value.trim();
    const item = state.items.find(i => i.id === itemId);
    if (item) {
      if (['p1','p2','p3','p4'].includes(field)) {
        val = val === '' ? '' : Math.round(Number(val)) || 0;
        item[field] = val === '' ? 0 : val;
        td.textContent = val;
        td.className = td.className; // keep classes
      } else {
        item[field] = val;
        td.textContent = val;
      }
      // 如果修改了品牌，需要重新渲染（但品牌是通过标签切换的，表格中不能直接改品牌）
      saveData();
      renderBrands(); // 更新计数
    }
  }
  currentEditCell = null;
}

// 智能分隔符检测
function detectDelimiter(line) {
  const delimiters = ['\t', '|', ',', ';', '\uff0c', '\u3001', '\uff5c'];
  let bestDelim = null;
  let bestCount = 0;
  for (let i = 0; i < delimiters.length; i++) {
    const d = delimiters[i];
    let count = 0;
    for (let j = 0; j < line.length; j++) {
      if (line[j] === d) count++;
    }
    if (count > bestCount) { bestCount = count; bestDelim = d; }
  }
  if (bestDelim && bestCount >= 2) return bestDelim;
  if (/\s{2,}/.test(line)) return '__MULTISPACE__';
  if (/[\uff0c\u3001]/.test(line)) return '\uff0c';
  return null;
}

function parsePrice(str) {
  if (!str) return 0;
  str = String(str).trim();
  if (str === '' || str === '-' || str === '/' || str === '--' || str.toLowerCase() === 'null' || str.toLowerCase() === 'nan' || str === '—') return 0;
  const cleaned = str.replace(/[^\d.-]/g, '');
  if (cleaned === '' || cleaned === '-' || cleaned === '.') return 0;
  const num = parseFloat(cleaned);
  if (isNaN(num)) return 0;
  return Math.round(num);
}

function isHeaderRow(parts) {
  if (parts.length < 3) return false;
  const headerKeywords = ['品牌','系列','型号','开机','不开机','废板','整机','价格','brand','series','model','price','产品','名称'];
  const joined = parts.join('').toLowerCase();
  for (let i = 0; i < headerKeywords.length; i++) {
    if (joined.indexOf(headerKeywords[i].toLowerCase()) !== -1) return true;
  }
  return false;
}

function matchBrand(name, brandNameMap, brands) {
  if (!name) return null;
  const lower = name.toLowerCase().trim();
  if (brandNameMap[lower]) return brandNameMap[lower];
  for (const key in brandNameMap) {
    if (key.indexOf(lower) !== -1 || lower.indexOf(key) !== -1) return brandNameMap[key];
  }
  const aliases = {'oppo':'OPPO','华为':'华为','huawei':'华为','hw':'华为','荣耀':'荣耀','honor':'荣耀','ry':'荣耀','小米':'小米','xiaomi':'小米','xm':'小米','红米':'红米','redmi':'红米','hm':'红米','一加':'一加','oneplus':'一加','1+':'一加','vivo':'vivo','真我':'真我','realme':'真我','iQOO':'vivo'};
  for (const alias in aliases) {
    if (lower.indexOf(alias.toLowerCase()) !== -1) {
      const tgt = aliases[alias];
      if (brandNameMap[tgt.toLowerCase()]) return brandNameMap[tgt.toLowerCase()];
      for (let i = 0; i < brands.length; i++) {
        if (brands[i].name === tgt) return brands[i];
      }
    }
  }
  return null;
}

const BRAND_COLORS_POOL = ['#7C3AED','#EC4899','#06B6D4','#84CC16','#6366F1','#F43F5E','#14B8A6','#A855F7','#F59E0B','#10B981','#3B82F6','#EF4444','#8B5CF6','#22C55E','#F97316','#0EA5E9'];
let _colorIdx = 0;
function getNextBrandColor() {
  return BRAND_COLORS_POOL[(_colorIdx++) % BRAND_COLORS_POOL.length];
}

function smartParseRow(parts) {
  if (parts.length < 3) return null;
  let startIdx = 0;
  if (/^\d{1,3}$/.test(parts[0].trim()) && parts.length >= 6) startIdx = 1;
  const eff = parts.slice(startIdx);
  const result = { brand:'', series:'', model:'', p1:0, p2:0, p3:0, p4:0 };

  if (eff.length >= 7) {
    result.brand = eff[0]; result.series = eff[1]; result.model = eff[2];
    result.p1 = parsePrice(eff[3]); result.p2 = parsePrice(eff[4]); result.p3 = parsePrice(eff[5]); result.p4 = parsePrice(eff[6]);
  } else if (eff.length === 6) {
    const bm = matchBrand(eff[0], null, state.brands);
    if (bm) {
      result.brand = eff[0]; result.series = eff[1]; result.model = eff[2];
      result.p1 = parsePrice(eff[3]); result.p2 = parsePrice(eff[4]); result.p3 = parsePrice(eff[5]);
    } else {
      result.series = eff[0]; result.model = eff[1];
      result.p1 = parsePrice(eff[2]); result.p2 = parsePrice(eff[3]); result.p3 = parsePrice(eff[4]); result.p4 = parsePrice(eff[5]);
    }
  } else if (eff.length === 5) {
    const bm = matchBrand(eff[0], null, state.brands);
    if (bm) {
      result.brand = eff[0]; result.model = eff[1];
      result.p1 = parsePrice(eff[2]); result.p2 = parsePrice(eff[3]); result.p3 = parsePrice(eff[4]);
    } else {
      result.series = eff[0]; result.model = eff[1];
      result.p1 = parsePrice(eff[2]); result.p2 = parsePrice(eff[3]); result.p4 = parsePrice(eff[4]);
    }
  } else if (eff.length === 4) {
    result.model = eff[0]; result.p1 = parsePrice(eff[1]); result.p2 = parsePrice(eff[2]); result.p3 = parsePrice(eff[3]);
  } else if (eff.length === 3) {
    result.model = eff[0]; result.p4 = parsePrice(eff[eff.length - 1]);
  }
  if (!result.model || result.model.trim() === '') return null;
  return result;
}

function doImport() {
  const text = document.getElementById('importText').value.trim();
  if (!text) { toast('请先粘贴数据'); return; }

  const mergeMode = document.getElementById('importModeMerge') && document.getElementById('importModeMerge').classList.contains('checked');
  const lines = text.split(/\r?\n/);
  const brandNameMap = {};
  state.brands.forEach(b => { brandNameMap[b.name.toLowerCase()] = b; });
  _colorIdx = state.brands.length;

  // 检测全局分隔符
  let delimCounts = {};
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l) continue;
    const d = detectDelimiter(l);
    if (d) delimCounts[d] = (delimCounts[d]||0) + 1;
  }
  let globalDelim = null;
  let maxCount = 0;
  for (const d in delimCounts) {
    if (delimCounts[d] > maxCount) { maxCount = delimCounts[d]; globalDelim = d; }
  }

  let parsed = [];
  let skipped = 0;
  let currentBrand = null;

  for (let li = 0; li < lines.length; li++) {
    let line = lines[li].trim();
    if (!line) continue;

    let delim = globalDelim || detectDelimiter(line);
    let parts;
    if (delim === '__MULTISPACE__') {
      parts = line.split(/\s{2,}/);
    } else if (delim) {
      parts = line.split(delim);
    } else {
      const sp = line.split(/\s+/);
      parts = sp.length >= 5 ? sp : [line];
    }
    parts = parts.map(function(p){return p.trim();}).filter(function(p){return p !== '';});
    if (parts.length < 2) { skipped++; continue; }

    if (isHeaderRow(parts)) continue;

    // 品牌分组行检测（只有品牌名无数字）
    let hasNumber = false;
    for (let pi = 0; pi < parts.length; pi++) { if (/\d/.test(parts[pi])) { hasNumber = true; break; } }
    if (!hasNumber && parts.length <= 2) {
      let b = matchBrand(parts[0], brandNameMap, state.brands);
      if (b) { currentBrand = b; continue; }
      const bn = parts[0].trim();
      if (bn.length <= 12 && bn.indexOf(' ') === -1) {
        let nb = brandNameMap[bn.toLowerCase()];
        if (!nb) { nb = { id: genBrandId(), name: bn, color: getNextBrandColor() }; state.brands.push(nb); brandNameMap[bn.toLowerCase()] = nb; }
        currentBrand = nb; continue;
      }
    }

    const prow = smartParseRow(parts);
    if (!prow) { skipped++; continue; }

    let brand = null;
    if (prow.brand) {
      brand = matchBrand(prow.brand, brandNameMap, state.brands);
      if (!brand) {
        brand = { id: genBrandId(), name: prow.brand.trim(), color: getNextBrandColor() };
        state.brands.push(brand);
        brandNameMap[prow.brand.toLowerCase().trim()] = brand;
      }
      currentBrand = brand;
    } else {
      brand = currentBrand || getBrand(state.activeBrandId) || state.brands[0];
    }
    if (!brand) { skipped++; continue; }

    parsed.push({ brandId: brand.id, series: (prow.series||'').trim(), model: (prow.model||'').trim(), p1: prow.p1, p2: prow.p2, p3: prow.p3, p4: prow.p4 });
  }

  if (parsed.length === 0) { toast('未能识别有效数据，请检查格式'); return; }

  saveSnapshot('批量导入前');

  let added = 0, updated = 0;

  if (mergeMode) {
    const existingMap = {};
    for (let i = 0; i < state.items.length; i++) {
      const item = state.items[i];
      const key = (item.brandId + '|' + (item.series||'') + '|' + (item.model||'')).toLowerCase();
      existingMap[key] = item;
    }
    for (let i = 0; i < parsed.length; i++) {
      const row = parsed[i];
      const key = (row.brandId + '|' + (row.series||'') + '|' + row.model).toLowerCase();
      if (existingMap[key]) {
        const ex = existingMap[key];
        if (row.p1 !== 0) ex.p1 = row.p1;
        if (row.p2 !== 0) ex.p2 = row.p2;
        if (row.p3 !== 0) ex.p3 = row.p3;
        if (row.p4 !== 0) ex.p4 = row.p4;
        if (row.series) ex.series = row.series;
        updated++;
      } else {
        const ni = { id: genId(), brandId: row.brandId, series: row.series, model: row.model, p1: row.p1, p2: row.p2, p3: row.p3, p4: row.p4 };
        state.items.push(ni);
        existingMap[key] = ni;
        added++;
      }
    }
  } else {
    for (let i = 0; i < parsed.length; i++) {
      const row = parsed[i];
      state.items.push({ id: genId(), brandId: row.brandId, series: row.series, model: row.model, p1: row.p1, p2: row.p2, p3: row.p3, p4: row.p4 });
      added++;
    }
  }

  // 智能排序
  const brandOrder = {};
  for (let i = 0; i < state.brands.length; i++) brandOrder[state.brands[i].id] = i;
  const brandSeriesOrder = {};
  for (let bi = 0; bi < state.brands.length; bi++) {
    const bid = state.brands[bi].id;
    brandSeriesOrder[bid] = [];
    for (let ii = 0; ii < state.items.length; ii++) {
      if (state.items[ii].brandId === bid && brandSeriesOrder[bid].indexOf(state.items[ii].series) === -1) {
        brandSeriesOrder[bid].push(state.items[ii].series);
      }
    }
  }

  function naturalCmp(a, b) {
    const ax = [], bx = [];
    (a.model||'').replace(/(\d+)|(\D+)/g, function(_, $1, $2){ ax.push([$1?parseInt($1):Infinity, $2||'']); });
    (b.model||'').replace(/(\d+)|(\D+)/g, function(_, $1, $2){ bx.push([$1?parseInt($1):Infinity, $2||'']); });
    while (ax.length && bx.length) {
      const an = ax.shift(), bn = bx.shift();
      const nn = (an[0]-bn[0]) || an[1].localeCompare(bn[1], 'zh-CN');
      if (nn) return nn;
    }
    return ax.length - bx.length;
  }

  state.items.sort(function(a, b) {
    const bo = (brandOrder[a.brandId]!=null?brandOrder[a.brandId]:999) - (brandOrder[b.brandId]!=null?brandOrder[b.brandId]:999);
    if (bo !== 0) return bo;
    const so = brandSeriesOrder[a.brandId] || [];
    const sai = so.indexOf(a.series), sbi = so.indexOf(b.series);
    const sv = (sai===-1?999:sai) - (sbi===-1?999:sbi);
    if (sv !== 0) return sv;
    return naturalCmp(a, b);
  });

  saveData();
  closeDialog();
  renderBrands();
  renderTable();

  let msg = '成功处理 ' + parsed.length + ' 条数据';
  if (mergeMode) msg += '（新增 ' + added + '，更新 ' + updated + '）';
  if (skipped > 0) msg += '，跳过 ' + skipped + ' 行';
  toast(msg);
}

    title: '恢复快照',
    body: `<p style="font-size:15px;color:#555;">确定要恢复到 ${snap.time} 的快照吗？当前数据将被覆盖。</p>`,
    buttons: [
      { text: '取消', class: 'btn-cancel', action: closeDialog },
      { text: '恢复', class: 'btn-confirm', action: () => {
        // 先保存当前状态
        const currentSnap = {
          time: new Date().toLocaleString('zh-CN'),
          label: '恢复前自动保存',
          brands: JSON.parse(JSON.stringify(state.brands)),
          items: JSON.parse(JSON.stringify(state.items))

        state.brands = JSON.parse(JSON.stringify(snap.brands));
        state.items = JSON.parse(JSON.stringify(snap.items));
        state.activeBrandId = state.brands[0]?.id || null;

        saveData();

// ==================== 双指捏合缩放 ====================
(function setupPinchZoom() {
  const container = document.getElementById('tableContainer');
  const wrapper = document.getElementById('tableWrapper');
  const scroll = document.getElementById('tableScroll');
  const headerFixed = document.getElementById('tableHeaderFixed');
  const headerInner = document.getElementById('headerInner');
  const headerTable = document.getElementById('headerTable');
  const dataTable = document.getElementById('dataTable');
  const spacer = document.getElementById('scaleSpacer');
  const hint = document.getElementById('zoomHint');
  let initialDistance = 0;
  let initialScale = 1;
  let currentScale = 1;
  let hintTimer;
  let isPinching = false;
  let lastTouchEndTime = 0;
  let lastTouchCount = 0;
  let pinchEndTime = 0;

  function getDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  function applyScale() {
    container.style.transform = 'scale(' + currentScale + ')';
    container.style.transformOrigin = '0 0';
    container.style.width = scroll.clientWidth + 'px';
    // 使用spacer撑开滚动区域到缩放后的尺寸
    requestAnimationFrame(function() {
      const tw = dataTable.offsetWidth;
      const th = dataTable.offsetHeight;
      spacer.style.width = Math.ceil(tw * currentScale) + 'px';
      spacer.style.height = Math.ceil(th * currentScale) + 'px';
      syncHeader();
    });
  }

  function syncHeader() {
    headerTable.style.width = dataTable.offsetWidth + 'px';
    headerFixed.style.width = scroll.clientWidth + 'px';
    headerInner.style.transform = 'translateX(-' + scroll.scrollLeft + 'px)';
  }

  function updateScale(newScale) {
    currentScale = Math.max(0.6, Math.min(3, newScale));
    applyScale();
    hint.textContent = Math.round(currentScale * 100) + '%';
    hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hint.classList.remove('show'); }, 1500);
  }

  // 同步表头水平滚动
  scroll.addEventListener('scroll', function() {
    syncHeader();
  });

  wrapper.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      isPinching = true;
      initialDistance = getDistance(e.touches);
      initialScale = currentScale;
      e.preventDefault();
    }
  }, { passive: false });

  wrapper.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      isPinching = true;
      var distance = getDistance(e.touches);
      var scale = initialScale * (distance / initialDistance);
      updateScale(scale);
      e.preventDefault();
    }
  }, { passive: false });

  wrapper.addEventListener('touchend', function(e) {
    if (isPinching) {
      // 双指操作结束，标记时间防止误触双击重置
      pinchEndTime = Date.now();
      if (e.touches.length < 2) {
        isPinching = false;
      }
      return;
    }
    // 双击重置：需要确保不是刚结束捏合，且是单指快速点击
    var now = Date.now();
    if (e.touches.length === 0 && now - pinchEndTime > 500) {
      if (now - lastTouchEndTime < 300 && lastTouchCount === 1) {
        updateScale(1);
        currentScale = 1;
        setTimeout(function(){ scroll.scrollLeft = 0; scroll.scrollTop = 0; }, 50);
      }
      lastTouchEndTime = now;
      lastTouchCount = e.changedTouches.length;
    }
  });

  wrapper.addEventListener('touchcancel', function() {
    isPinching = false;
  });

  // 鼠标滚轮缩放（桌面调试用）
  wrapper.addEventListener('wheel', function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      var delta = e.deltaY > 0 ? -0.1 : 0.1;
      updateScale(currentScale + delta);
    }
  }, { passive: false });

  // 窗口大小变化时同步
  window.addEventListener('resize', function() {
    setTimeout(function(){ applyScale(); }, 100);
  });

  // 暴露全局方法供渲染后调用
  window._syncHeader = function() { applyScale(); };
  window._resetZoom = function() { currentScale = 1; applyScale(); setTimeout(function(){ scroll.scrollLeft = 0; }, 50); };
})();

  renderBrands();
  renderTable();
  // 初始化缩放容器尺寸
  setTimeout(function() { if (window._syncHeader) window._syncHeader(); }, 200);
}

// 防止双击缩放
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// 启动
init();
</script>
</body>
</html>
