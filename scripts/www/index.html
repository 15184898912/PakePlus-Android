            `,
            youth: `
                <svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="bgg3" cx="50%" cy="30%" r="60%">
                            <stop offset="0%" style="stop-color:#00838F"/>
                            <stop offset="100%" style="stop-color:#0D1B2A"/>
                        </radialGradient>
                    </defs>
                    <rect width="200" height="260" fill="url(#bgg3)" rx="20"/>
                    <g class="eyes-open">
                        <ellipse cx="82" cy="95" rx="5" ry="4" fill="#1A1A1A"/>
                        <ellipse cx="118" cy="95" rx="5" ry="4" fill="#1A1A1A"/>
                    </g>
                    <g class="eyes-closed">
                        <line x1="75" y1="95" x2="89" y2="95" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
                        <line x1="111" y1="95" x2="125" y2="95" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
                    </g>
                    <ellipse cx="100" cy="95" rx="42" ry="48" fill="#FFCC99"/>
                    <path d="M56,80 C56,52 76,35 100,35 C124,35 144,52 144,80 C144,72 132,58 110,55 C90,53 76,60 66,72 C60,78 56,86 56,90Z" fill="#FFA726"/>
                    <ellipse cx="44" cy="95" rx="8" ry="12" fill="#212121"/>
                    <ellipse cx="156" cy="95" rx="8" ry="12" fill="#212121"/>
                    <path d="M88,122 Q100,126 112,122" stroke="#D84315" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M35,185 L100,145 L165,185 L165,260 L35,260Z" fill="#00BCD4"/>
                    <path d="M70,148 L100,138 L130,148 L124,165 L100,158 L76,165Z" fill="#0097A7"/>
                </svg>
            `
        };

        // 工具函数
        function showToast(message) {
            elements.toast.textContent = message;
            elements.toast.classList.add('show');
            setTimeout(() => elements.toast.classList.remove('show'), 2000);
        }

        function showLoading(text) {
            elements.loadingText.textContent = text;
            elements.loadingOverlay.classList.add('active');
        }

        function hideLoading() {
            elements.loadingOverlay.classList.remove('active');
        }

        function resetAvatarOptions() {
            elements.avatarOptions.forEach(opt => opt.classList.remove('selected'));
        }

        function selectAvatar(type, element) {
            resetAvatarOptions();
            element.classList.add('selected');
            state.selectedAvatar = type;
            
            showLoading('AI正在生成数字分身...');
            setTimeout(() => {
                hideLoading();
                elements.avatarSvg.innerHTML = avatarSvgs[type];
                state.isAvatarReady = true;
                state.isVideoComposed = false;
                elements.btnSave.disabled = true;
                elements.statusText.textContent = '数字分身已就绪';
                startBlinking();
            }, 2000);
        }

        function startSpeaking() {
            if (state.isPlaying) return;
            state.isPlaying = true;
            elements.playingIndicator.classList.add('active');
            
            // 嘴型动画
            let startTime = Date.now();
            function animateMouth() {
                if (!state.isPlaying) return;
                const elapsed = Date.now() - startTime;
                const amplitude = (Math.sin(elapsed / 80) * 0.5 + 0.5) * (Math.random() * 0.5 + 0.5);
                const scaleY = 1 + amplitude * 0.03;
                const scaleX = 1 + amplitude * 0.008;
                elements.avatar.style.transform = `scaleX(${scaleX}) scaleY(${scaleY})`;
                
                // 表情检测
                const text = elements.textInput.value.toLowerCase();
                let rotation = 0;
                if (text.includes('开心') || text.includes('快乐') || text.includes('高兴') || text.includes('哈哈')) {
                    rotation = 1;
                } else if (text.includes('难过') || text.includes('悲伤') || text.includes('伤心')) {
                    rotation = -1;
                }
                elements.avatar.style.transform += ` rotate(${rotation}deg)`;
                
                state.mouthAnimation = requestAnimationFrame(animateMouth);
            }
            animateMouth();

            // 自动停止
            const textLength = elements.textInput.value.length || 10;
            const duration = Math.max(textLength * 120, 3000);
            state.playTimeout = setTimeout(stopSpeaking, duration);
        }

        function stopSpeaking() {
            state.isPlaying = false;
            elements.playingIndicator.classList.remove('active');
            if (state.mouthAnimation) {
                cancelAnimationFrame(state.mouthAnimation);
                state.mouthAnimation = null;
            }
            elements.avatar.style.transform = '';
        }

        function startBlinking() {
            function scheduleBlink() {
                const delay = 3000 + Math.random() * 2000;
                state.blinkTimeout = setTimeout(() => {
                    elements.avatar.classList.add('blinking');
                    setTimeout(() => {
                        elements.avatar.classList.remove('blinking');
                        scheduleBlink();
                    }, 150);
                }, delay);
            }
            scheduleBlink();
        }

        function composeVideo() {
            if (!state.isAvatarReady) {
                showToast('请先选择数字人形象');
                return;
            }
            if (!state.isVoiceReady) {
                showToast('请先生成语音或上传音频');
                return;
            }

            state.isVideoComposed = false;
            elements.btnSave.disabled = true;
            elements.btnCompose.disabled = true;
            elements.progressOverlay.classList.add('active');
            elements.progressFill.style.width = '0%';
            
            startSpeaking();

            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 2;
                elements.progressFill.style.width = progress + '%';
                elements.progressText.textContent = `正在合成视频 ${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    elements.progressOverlay.classList.remove('active');
                    state.isVideoComposed = true;
                    elements.btnSave.disabled = false;
                    elements.btnCompose.disabled = false;
                    elements.statusText.textContent = '视频合成完成';
                    stopSpeaking();
                    
                    elements.avatar.style.transform = 'scale(1.05)';
                    setTimeout(() => elements.avatar.style.transform = '', 200);
                    
                    showToast('视频合成完成！');
                }
            }, 100);
        }

        // 事件绑定
        elements.btnAvatar1.addEventListener('click', () => selectAvatar('business', elements.btnAvatar1));
        elements.btnAvatar2.addEventListener('click', () => selectAvatar('lady', elements.btnAvatar2));
        elements.btnAvatar3.addEventListener('click', () => selectAvatar('youth', elements.btnAvatar3));

        elements.btnUploadPhoto.addEventListener('click', () => {
            elements.photoInput.click();
        });

        elements.photoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                resetAvatarOptions();
                elements.btnUploadPhoto.classList.add('selected');
                selectAvatar('business', elements.btnUploadPhoto);
                elements.statusText.textContent = '照片上传成功，AI正在生成数字分身...';
            }
        });

        elements.btnGenerateVoice.addEventListener('click', () => {
            const text = elements.textInput.value.trim();
            if (!text) {
                showToast('请先输入要说的话');
                return;
            }
            if (!state.isAvatarReady) {
                showToast('请先选择数字人形象');
                return;
            }
            showLoading('正在合成AI语音...');
            setTimeout(() => {
                hideLoading();
                state.isVoiceReady = true;
                elements.playbackControls.classList.add('active');
                elements.statusText.textContent = '语音已生成';
                startSpeaking();
            }, 1500);
        });

        elements.btnUploadAudio.addEventListener('click', () => {
            if (!state.isAvatarReady) {
                showToast('请先选择数字人形象');
                return;
            }
            elements.audioInput.click();
        });

        elements.audioInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                showLoading('正在处理音频...');
                setTimeout(() => {
                    hideLoading();
                    state.isVoiceReady = true;
                    elements.playbackControls.classList.add('active');
                    elements.statusText.textContent = '音频已加载';
                    startSpeaking();
                }, 1500);
            }
        });

        elements.btnPlay.addEventListener('click', startSpeaking);
        elements.btnStop.addEventListener('click', stopSpeaking);

        elements.bgOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                elements.bgOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                const color = opt.dataset.color;
                const name = opt.dataset.name;
                state.selectedBg = opt.dataset.bg;
                if (color.includes('gradient')) {
                    elements.previewBg.style.background = color;
                    elements.previewBg.style.backgroundColor = '';
                } else {
                    elements.previewBg.style.background = '';
                    elements.previewBg.style.backgroundColor = color;
                }
                elements.bgName.textContent = name;
            });
        });

        elements.btnCompose.addEventListener('click', composeVideo);

        elements.btnSave.addEventListener('click', () => {
            if (state.isVideoComposed) {
                showToast('已保存到相册');
                elements.statusText.textContent = '已保存到相册';
            }
        });

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            stopSpeaking();
            if (state.blinkTimeout) clearTimeout(state.blinkTimeout);
            if (state.playTimeout) clearTimeout(state.playTimeout);
        });
    </script>
</body>
</html>
