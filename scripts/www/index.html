            <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="white" opacity="0.9"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="white" opacity="0.9"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="white" opacity="0.9"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="white" opacity="0.5"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="white" opacity="0.9"/><path d="M5.5 8.5A3.5 3.5 0 0 1 10.5 8.5" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/><path d="M3.5 6A6.5 6.5 0 0 1 12.5 6" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/><path d="M1.5 3.5A9.5 9.5 0 0 1 14.5 3.5" stroke="white" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="2.5" stroke="white" stroke-opacity="0.9" stroke-width="1"/><rect x="2" y="2" width="16" height="8" rx="1" fill="white" opacity="0.9"/><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/></svg>
          </div>
        </div>
        <div class="page-hd"><h1>作品库</h1><p>您的AI创作作品集</p></div>
        <div class="empty-state">

            <rect x="10" y="14" width="60" height="52" rx="6" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
            <circle cx="32" cy="35" r="8" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
            <path d="M10 54l16-12 12 8 14-14 18 12v12a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V54Z" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
            <line x1="40" y1="70" x2="40" y2="78" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

          <div class="empty-title">暂无作品</div>

        </div>
      </div>
    </template>

    <!-- ========== 我的 ========== -->
    <template v-if="activeTab==='profile'">
      <div class="profile-page">
        <div class="status-bar">
          <span class="time">{{ nowTime }}</span>
          <div class="icons">
            <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="white" opacity="0.9"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="white" opacity="0.9"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="white" opacity="0.9"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="white" opacity="0.5"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="white" opacity="0.9"/><path d="M5.5 8.5A3.5 3.5 0 0 1 10.5 8.5" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/><path d="M3.5 6A6.5 6.5 0 0 1 12.5 6" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/><path d="M1.5 3.5A9.5 9.5 0 0 1 14.5 3.5" stroke="white" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0" y="0" width="22" height="12" rx="2.5" stroke="white" stroke-opacity="0.9" stroke-width="1"/><rect x="2" y="2" width="16" height="8" rx="1" fill="white" opacity="0.9"/><rect x="22.5" y="3.5" width="2" height="5" rx="1" fill="white" opacity="0.5"/></svg>
          </div>
        </div>
        <div class="profile-header glass-card">
          <div class="avatar">
            <svg width="36" height="36" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="white" stroke-width="1.5"/><path d="M4 20a8 8 0 0 1 16 0" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="user-name">生意人</div>
          <div class="user-id">ID: ZSZG20240708</div>
          <div class="tags"><span>基础版</span><span class="vip">升级VIP</span></div>
        </div>
        <div class="menu-group gg glass-card">
          <div class="menu-item" v-for="m in menus" :key="m.label" @click="clickMenu(m)">
            <div class="left"><div class="m-icon" v-html="m.icon"></div><span class="m-label">{{ m.label }}</span></div>
            <div class="right">
              <span class="badge" v-if="m.badge">{{ m.badge }}</span>
              <svg width="16" height="16" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ========== 底部导航栏 ========== -->
    <van-tabbar v-model="activeTab" :fixed="true" :border="true" :safe-area-inset-bottom="true" active-color="#E63946" inactive-color="rgba(255,255,255,0.45)">
      <van-tabbar-item name="home">
        <template #icon="p">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M12 2l8 3v7c0 5-5 8-8 10-3-2-8-5-8-10V5l8-3Z" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" fill="none"/>
            <line x1="8" y1="10" x2="16" y2="10" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8" y1="13" x2="13" y2="13" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </template>
        工作台
      </van-tabbar-item>
      <van-tabbar-item name="works">
        <template #icon="p">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M14 2v6h6" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="8" y1="13" x2="16" y2="13" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8" y1="17" x2="12" y2="17" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </template>
        作品库
      </van-tabbar-item>
      <van-tabbar-item name="profile">
        <template #icon="p">
          <svg width="24" height="24" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" fill="none"/>
            <path d="M4 20a8 8 0 0 1 16 0" :stroke="p.active?'#E63946':'rgba(255,255,255,0.45)'" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </template>
        我的
      </van-tabbar-item>
    </van-tabbar>

    <!-- 隐藏文件上传 -->
    <input type="file" ref="fileInput" style="display:none" @change="onFileChange" :accept="uploadAccept"/>

    <!-- ActionSheet: 更多 -->
    <van-action-sheet v-model:show="showMore" :actions="moreActions" cancel-text="取消" @select="onMoreSelect"/>
    <!-- ActionSheet: 设置 -->
    <van-action-sheet v-model:show="showSettings" :actions="settingsActions" cancel-text="取消" @select="onSettingsSelect"/>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted, onUnmounted } = Vue

const app = createApp({
  setup() {
    // ====== 状态 ======
    const activeTab = ref('home')
    const showMore = ref(false)
    const showSettings = ref(false)
    const nowTime = ref('9:42')
    const fileInput = ref(null)
    const uploadAccept = ref('')
    const uploadType = ref('')

    // ====== 时钟 ======
    let timer = null
    const updateTime = () => {
      const d = new Date()
      nowTime.value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
    }
    onMounted(() => { updateTime(); timer = setInterval(updateTime, 60000) })
    onUnmounted(() => { if(timer) clearInterval(timer) })

    // ====== 菜单数据 ======
    const moreActions = [
      { name: '分享给好友', color: '#fff' },
      { name: '关于正商诸葛AI', color: '#fff' },
      { name: '帮助与反馈', color: '#fff' },
    ]
    const settingsActions = [
      { name: '账号设置', color: '#fff' },
      { name: '通知管理', color: '#fff' },
      { name: '隐私政策', color: '#fff' },
      { name: '清除缓存', color: '#fff' },
    ]
    const menus = [
      { label:'我的智能体', badge:'', icon:'<svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="rgba(230,57,70,0.8)" stroke-width="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="rgba(230,57,70,0.8)" stroke-width="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="rgba(230,57,70,0.8)" stroke-width="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="rgba(230,57,70,0.8)" stroke-width="1.5"/></svg>' },
      { label:'我的订阅', badge:'', icon:'<svg width="20" height="20" viewBox="0 0 24 24"><polygon points="12,2 22,22 2,22" stroke="rgba(244,162,97,0.8)" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
      { label:'使用记录', badge:'', icon:'<svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/><polyline points="12,6 12,12 16,14" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/></svg>' },
      { label:'消息通知', badge:'3', icon:'<svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9Z" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round"/></svg>' },
      { label:'联系客服', badge:'', icon:'<svg width="20" height="20" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10Z" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    ]

    // ====== Toast 辅助 ======
    const toast = (msg, dur=1500) => {
      vant.showToast({ message: msg, duration: dur, position: 'middle' })
    }

    // ====== 上传文件 ======
    const openUpload = (type) => {
      uploadType.value = type
      if (type === 'archive') {
        uploadAccept.value = '.jpg,.jpeg,.png,.pdf,.doc,.docx'
      } else {
        uploadAccept.value = '.mp4,.mov,.avi,.mkv'
      }
      if (fileInput.value) fileInput.value.click()
    }
    const onFileChange = (e) => {
      const files = e.target.files
      if (files && files.length > 0) {
        const name = files[0].name
        const label = uploadType.value === 'archive' ? '档案' : '视频素材'
        toast(`✅ ${label}「${name}」上传成功`, 2000)
      }
      if (fileInput.value) fileInput.value.value = ''
    }

    // ====== 爆款云剪 ======
    const submitTask = () => {
      vant.showConfirmDialog({
        title: '任务确认',
        message: '确认启动「爆款云剪智能体」？\n系统将自动为您生成爆款短视频。',
        confirmButtonText: '一键启动',
        cancelButtonText: '取消',
        confirmButtonColor: '#E63946',
      }).then(() => {
        toast('🎬 智能体已启动，正在为您生成中...', 2500)
      }).catch(() => {})
    }

    // ====== 快捷工具 ======
    const clickTool = (type) => {
      if (type === 'template') {
        toast('📝 正在加载文案模版库...', 1500)
      } else if (type === 'watermark') {
        vant.showConfirmDialog({
          title: 'AI 去水印下载',
          message: '请输入视频链接，智能体将为您解析并去除水印后下载。\n\n（演示模式：模拟解析过程）',
          confirmButtonText: '开始解析',
          confirmButtonColor: '#E63946',
        }).then(() => {
          toast('🔍 正在解析视频...', 2000)
          setTimeout(() => toast('✅ 解析完成！无水印视频已准备就绪', 2000), 2000)
        }).catch(() => {})
      } else if (type === 'benchmark') {
        vant.showConfirmDialog({
          title: '同行账号对标分析',
          message: '📊 为您分析同类账号数据：\n\n• 粉丝增长趋势：+15.2%\n• 内容互动率：8.7%\n• 爆款视频类型：口播 > 测评\n• 建议优化方向：提升发布频率\n\n（演示数据，仅供参考）',
          confirmButtonText: '查看详细报告',
          confirmButtonColor: '#E63946',
        }).then(() => {
          toast('📈 详细报告生成中，请稍候...', 2000)
        }).catch(() => {})
      }
    }

    // ====== ActionSheet 回调 ======
    const onMoreSelect = (a) => { toast(`「${a.name}」功能开发中`); showMore.value = false }
    const onSettingsSelect = (a) => { toast(`「${a.name}」功能开发中`); showSettings.value = false }
    const clickMenu = (m) => { toast(`「${m.label}」功能开发中，敬请期待`) }

    return {
      activeTab, showMore, showSettings, nowTime, fileInput, uploadAccept,
      moreActions, settingsActions, menus,
      openUpload, onFileChange, submitTask, clickTool,
      onMoreSelect, onSettingsSelect, clickMenu,
    }
  }
})

// 注册 Vant 组件
app.use(vant.Tabbar)
app.use(vant.TabbarItem)
app.use(vant.ActionSheet)

app.mount('#app')
</script>
</body>
</html>
