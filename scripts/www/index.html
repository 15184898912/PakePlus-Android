<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seedance 2.0</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#0a0a0a;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
button{border:none;background:none;cursor:pointer;color:inherit;font-family:inherit}
input,textarea{font-family:inherit;outline:none;border:none;background:transparent;color:#fff}
img{display:block;max-width:100%}

/* Phone frame */
#phone-frame{width:100%;height:100%;max-width:420px;max-height:900px;background:#0a0a0a;position:relative;overflow:hidden;border-radius:0}
@media(min-width:480px){#phone-frame{height:92vh;max-height:850px;border-radius:40px;border:8px solid #222;box-shadow:0 25px 80px rgba(0,0,0,.8),0 0 0 2px #333}}
#app{width:100%;height:100%;position:relative;display:flex;flex-direction:column;background:#0a0a0a;overflow:hidden}

/* Status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;z-index:100}
.status-time{letter-spacing:.5px}
.status-icons{display:flex;align-items:center;gap:6px}
.status-5g{font-size:11px;font-weight:700}

/* Pages */
.page{position:absolute;top:0;left:0;right:0;bottom:60px;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .25s ease;background:#0a0a0a;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{opacity:1;pointer-events:auto;z-index:10}

/* Bottom nav */
.bottom-nav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:rgba(30,30,30,.95);backdrop-filter:blur(20px);border-radius:28px;padding:8px 32px;gap:48px;border:1px solid rgba(255,255,255,.06);z-index:200}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;color:#666;font-size:11px;font-weight:500;transition:color .2s}
.nav-item.active{color:#fff}

/* Icon button */
.icon-btn{width:36px;height:36px;border-radius:18px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s}
.icon-btn.dark{background:rgba(0,0,0,.3)}
.icon-btn:active{background:#333}

/* ===== Discovery ===== */
.discovery-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;position:sticky;top:0;background:#0a0a0a;z-index:50}
.discovery-header h1{font-size:22px;font-weight:700}
.category-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.category-tabs::-webkit-scrollbar{display:none}
.category-tab{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:16px;background:#1a1a1a;color:#888;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;border:none;transition:all .2s}
.category-tab.active{background:rgba(255,255,255,.15);color:#fff}
.discovery-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 140px}
.discovery-card{background:#1e1e1e;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:transform .2s}
.discovery-card:active{transform:scale(.97)}
.card-img-wrap{position:relative}
.card-img{width:100%;object-fit:cover;display:block;border-radius:16px 16px 0 0}
.card-badge{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.card-overlay{position:absolute;bottom:0;left:0;right:0;padding:8px;display:flex;justify-content:flex-end;gap:8px}
.card-action{display:flex;align-items:center;gap:3px;color:#fff;font-size:11px;font-weight:500}
.card-body{padding:10px 12px}
.card-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:12px;color:#aaa;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-btn{width:100%;padding:6px 0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:500;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.card-footer{display:flex;align-items:center;gap:6px}
.card-avatar{width:18px;height:18px;border-radius:9px;object-fit:cover}
.card-author{flex:1;font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-fav svg{width:14px;height:14px}
.card-play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.3);pointer-events:none}
.card-play-overlay svg{margin-left:3px}

.fab-container{position:absolute;bottom:72px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:150}
.fab-btn{display:flex;align-items:center;gap:8px;background:rgba(30,30,30,.95);backdrop-filter:blur(20px);padding:10px 24px;border-radius:28px;border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:600;pointer-events:auto;transition:transform .2s}
.fab-btn:active{transform:scale(.96)}

/* ===== Generator ===== */
.generator-top{display:flex;justify-content:center;padding:8px 0;flex-shrink:0}
.quality-selector{display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:12px;background:#1a1a1a;color:#aaa;font-size:13px}
.generator-title{text-align:center;padding:12px 0 16px;flex-shrink:0}
.generator-title h1{font-size:22px;font-weight:700;letter-spacing:1px}
.generator-bg{flex:1;position:relative;overflow:hidden;min-height:120px}
.blur-circles{position:relative;width:100%;height:100%}
.blur-circle{position:absolute;width:80px;height:80px;border-radius:40px;overflow:hidden;border:2px solid rgba(255,255,255,.08);filter:blur(12px)}
.blur-circle img{width:100%;height:100%;object-fit:cover}

.generator-bottom{padding:0 20px 24px;flex-shrink:0}
.avatar-scroll{display:flex;gap:12px;overflow-x:auto;padding:8px 4px;scrollbar-width:none}
.avatar-scroll::-webkit-scrollbar{display:none}
.avatar-item{width:52px;height:52px;border-radius:26px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid transparent;overflow:hidden;position:relative;transition:border-color .2s}
.avatar-item.active{border-color:#fff}
.avatar-item.add{border-style:dashed;border-color:rgba(255,255,255,.2);border-width:1.5px}
.avatar-item img{width:100%;height:100%;object-fit:cover}
.avatar-item svg{color:#aaa}

.prompt-box{background:#1a1a1a;border-radius:24px;padding:14px 20px;margin:8px 0 16px;border:1px solid rgba(255,255,255,.08)}
.prompt-box textarea{width:100%;color:#fff;font-size:15px;text-align:center;resize:none;line-height:22px;min-height:22px;overflow:hidden;scrollbar-width:none}
.prompt-box textarea::-webkit-scrollbar{display:none}
.prompt-box textarea::placeholder{color:rgba(255,255,255,.45);opacity:1}
.prompt-box textarea:focus{outline:none}
.prompt-box textarea:focus::placeholder{color:rgba(255,255,255,.25)}

.mode-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.mode-toggle{display:flex;align-items:center;background:#1a1a1a;border-radius:24px;padding:4px;border:1px solid rgba(255,255,255,.06)}
.mode-btn{padding:8px 20px;border-radius:20px;font-size:15px;font-weight:500;color:#888;transition:all .2s}
.mode-btn.active{color:#fff;background:rgba(255,255,255,.1)}
.generate-action-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:9px 18px;border-radius:24px;border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:600;transition:opacity .2s}
.generate-action-btn:disabled{opacity:.4;cursor:not-allowed}
.sub-modes{display:flex;justify-content:center;gap:20px}
.sub-mode{display:flex;align-items:center;gap:4px;padding:6px 12px;color:#888;font-size:13px}

/* ===== Detail ===== */
#page-detail{background:#000;padding-bottom:0}
.detail-media{position:absolute;top:0;left:0;right:0;bottom:0}
.detail-media img{width:100%;height:100%;object-fit:cover}
.detail-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.2)}
.detail-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.3);z-index:15;cursor:pointer;transition:transform .2s}
.detail-play-btn:active{transform:translate(-50%,-50%) scale(.92)}
.detail-play-btn svg{margin-left:4px}
.detail-topbar{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;z-index:20}
.detail-right-actions{position:absolute;right:16px;bottom:200px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:20}
.side-action{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:11px;font-weight:500}
.side-action svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

.detail-bottom{position:absolute;bottom:72px;left:0;right:0;padding:20px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.6),transparent);z-index:20}
.detail-author{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#detail-avatar{width:36px;height:36px;border-radius:18px;border:2px solid rgba(255,255,255,.3);object-fit:cover}
.detail-author-info{display:flex;align-items:center;flex:1}
#detail-author-name{font-size:15px;font-weight:600;color:#fff}
.detail-meta{font-size:13px;color:rgba(255,255,255,.7);margin-left:4px}
.follow-btn{width:28px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff}
.detail-desc{font-size:15px;color:rgba(255,255,255,.9);margin-bottom:10px;line-height:1.4}
.detail-collection{display:flex;align-items:center;gap:4px;align-self:flex-start;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:16px;margin-bottom:10px;font-size:13px;color:#fff;font-weight:500}
.detail-actions{display:flex;gap:10px}
.detail-action-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:7px 16px;border-radius:20px;color:#fff;font-size:13px;font-weight:500}

/* ===== Inpaint ===== */
#page-inpaint{background:#0a0a0a}
.inpaint-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;background:#0a0a0a;z-index:50}
.inpaint-header h2{font-size:17px;font-weight:600}
.inpaint-canvas-wrap{position:relative;margin:16px;background:#1a1a1a;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06);aspect-ratio:3/4}
.inpaint-canvas-wrap img{width:100%;height:100%;object-fit:contain}
#inpaint-canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair}
.processing-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.processing-overlay p{font-size:17px;font-weight:600}
.processing-overlay span{font-size:13px;color:rgba(255,255,255,.7)}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.inpaint-tools{display:flex;justify-content:center;gap:16px;margin:8px 0 12px}
.tool-btn{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;background:#1a1a1a;color:#888;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.tool-btn.active{border-color:rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08)}

.inpaint-options{padding:0 16px;margin-bottom:12px}
.inpaint-options h3{font-size:15px;font-weight:600;margin-bottom:10px}
.option-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:16px;background:#1a1a1a;color:#888;font-size:13px;border:1px solid rgba(255,255,255,.06);transition:all .2s}
.chip.active{border-color:rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.08)}

.inpaint-prompt{padding:0 16px;margin-bottom:12px}
.inpaint-prompt h3{font-size:15px;font-weight:600;margin-bottom:10px}
.prompt-area{background:#1a1a1a;border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.06)}
.prompt-area textarea{width:100%;color:#fff;font-size:15px;resize:none;line-height:1.5}
.prompt-area textarea::placeholder{color:#666}
.prompt-hint{font-size:12px;color:#888;margin-top:6px;line-height:1.4}

.inpaint-bottom{position:sticky;bottom:0;padding:12px 16px 20px;background:rgba(10,10,10,.95);border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:8px}
.inpaint-generate-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.15);padding:12px;border-radius:24px;border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:600;transition:opacity .2s}
.inpaint-generate-btn:disabled{opacity:.4;cursor:not-allowed}
.inpaint-save-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:#1a1a1a;padding:10px;border-radius:24px;border:1px solid rgba(255,255,255,.06);color:#fff;font-size:15px;font-weight:500}

/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(30,30,30,.95);backdrop-filter:blur(20px);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.1);opacity:0;transition:all .3s;z-index:1000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Result Page ===== */
.result-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:#0a0a0a;z-index:50;border-bottom:1px solid rgba(255,255,255,.06)}
.result-topbar h2{font-size:17px;font-weight:600}
.result-content{padding:16px;display:flex;align-items:center;justify-content:center}
.result-content img,.result-content video{width:100%;border-radius:16px;background:#1a1a1a}
.result-content video{max-height:50vh}
.result-loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 0}
.result-loading p{color:#aaa;font-size:14px}
.result-info{padding:0 16px 12px}
.result-prompt-label{font-size:12px;color:#888;margin-bottom:4px;font-weight:500}
.result-prompt{font-size:14px;color:#fff;line-height:1.5;margin-bottom:12px}
.result-meta-row{display:flex;gap:16px}
.result-meta-item{display:flex;align-items:center;gap:4px}
.meta-label{font-size:12px;color:#888}
.meta-value{font-size:12px;color:#fff;background:#1a1a1a;padding:2px 8px;border-radius:8px}
.result-actions{display:flex;gap:8px;padding:0 16px 12px}
.result-action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:24px;font-size:14px;font-weight:500;border:1px solid rgba(255,255,255,.06)}
.result-action-btn.secondary{background:#1a1a1a;color:#fff}
.result-action-btn.primary{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.1)}
.result-editing{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 16px 24px;border-top:1px solid rgba(255,255,255,.06);margin-top:8px}
.edit-option{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;background:transparent;color:#aaa;font-size:11px}
.edit-option svg{color:#aaa}

/* ===== Upload & Media Preview ===== */
.upload-row{display:flex;justify-content:center;gap:16px;margin-bottom:12px}
.upload-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;background:#1a1a1a;border:1px solid rgba(255,255,255,.08);color:#ccc;font-size:13px;font-weight:500;transition:all .2s}
.upload-btn:active{background:#2a2a2a;transform:scale(.96)}
.upload-btn svg{color:#ccc}
.media-preview{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.media-preview::-webkit-scrollbar{display:none}
.media-item{position:relative;flex-shrink:0;width:64px;height:64px;border-radius:12px;overflow:hidden;background:#1a1a1a;border:2px solid transparent}
.media-item.selected{border-color:#fff}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover}
.media-item .remove-btn{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:10px;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.media-item .video-badge{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 4px}
.media-item .video-badge svg{width:12px;height:12px;color:#fff}
.add-media-btn{flex-shrink:0;width:64px;height:64px;border-radius:12px;background:#1a1a1a;border:1.5px dashed rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#666}
</style>
</head>
<body>
<div id="phone-frame">
<div id="app">

<!-- Status Bar -->
<div class="status-bar">
  <span class="status-time" id="status-time">9:57</span>
  <div class="status-icons"><span class="status-5g">5G</span><svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M1 8h2v3H1zm4-2h2v5H5zm4-2h2v7H9zm4-2h2v9h-2z"/></svg><svg width="20" height="12" viewBox="0 0 20 12"><rect x="1" y="3" width="16" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="5" width="12" height="2" rx="1" fill="currentColor"/></svg></div>
</div>

<!-- ===== DISCOVERY ===== -->
<div class="page active" id="page-discovery">
  <div class="discovery-header"><h1>发现</h1><button class="icon-btn" onclick="showToast('搜索功能')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button></div>
  <div class="category-tabs" id="category-tabs"></div>
  <div class="discovery-grid" id="discovery-grid"></div>
  <div class="fab-container"><button class="fab-btn" onclick="switchTab('generator')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>开始生图/视频/音乐</span></button></div>
</div>

<!-- ===== GENERATOR ===== -->
<div class="page" id="page-generator">
  <div class="generator-top"><div class="quality-selector"><span>标清</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></div></div>
  <div class="generator-title"><h1>Seedance 2.0</h1></div>
  <div class="generator-bg"><div class="blur-circles" id="blur-circles"></div></div>
  <div class="generator-bottom">
    <div class="upload-row">
      <button class="upload-btn" onclick="document.getElementById('album-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        <span>相册</span>
      </button>
      <button class="upload-btn" onclick="document.getElementById('camera-input').click()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <span>拍照/录像</span>
      </button>
    </div>
    <div class="media-preview" id="media-preview"></div>
    <input type="file" id="album-input" accept="image/*,video/*" multiple style="display:none" onchange="handleMediaUpload(event)">
    <input type="file" id="camera-input" accept="image/*,video/*" capture="environment" style="display:none" onchange="handleMediaUpload(event)">
    <div class="avatar-scroll" id="avatar-scroll"></div>

/* ===== NAV ===== */
function switchTab(tab){
  prevPage=tab;
  navigateTo(tab);
}
function navigateTo(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t=document.getElementById('page-'+page);
  if(t)t.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab===page));
  const b=document.getElementById('bottom-nav');
  b.style.display=(page==='detail'||page==='inpaint'||page==='result')?'none':'flex';
}
function backFromDetail(){
  navigateTo(prevPage==='detail'?'discovery':prevPage);
}

/* ===== TOAST ===== */
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

/* ===== DETAIL ===== */
function openDetail(id){
  curItem=ITEMS.find(d=>d.id===id);if(!curItem)return;
  const imgEl=document.getElementById('detail-image');
  const vidEl=document.getElementById('detail-video');
  const playBtn=document.getElementById('detail-play-btn');
  const overlay=document.getElementById('detail-overlay');
  // Reset
  vidEl.pause();vidEl.currentTime=0;vidEl.style.display='none';
  imgEl.style.display='block';playBtn.style.display='none';overlay.style.display='block';
  imgEl.src=curItem.img;
  // Video type: show play button
  if(curItem.type==='video'){
    playBtn.style.display='flex';
    if(curItem.videoUrl){vidEl.src=curItem.videoUrl;}
  }
  document.getElementById('detail-avatar').src=curItem.avatar;
  document.getElementById('detail-author-name').textContent='@'+curItem.author;
  document.getElementById('detail-desc').textContent='@'+curItem.author+' '+curItem.desc;
  updateDetailUI();
  navigateTo('detail');
}
function playDetailVideo(){
  if(!curItem)return;
  const imgEl=document.getElementById('detail-image');
  const vidEl=document.getElementById('detail-video');
  const playBtn=document.getElementById('detail-play-btn');
  const overlay=document.getElementById('detail-overlay');
  if(curItem.videoUrl){
    imgEl.style.display='none';overlay.style.display='none';playBtn.style.display='none';
    vidEl.style.display='block';vidEl.muted=false;
    vidEl.play().catch(()=>{
      vidEl.muted=true;
      vidEl.play().catch(()=>{
        playBtn.style.display='flex';imgEl.style.display='block';vidEl.style.display='none';
        showToast('视频加载失败，请检查网络');
      });
    });
    vidEl.onended=function(){imgEl.style.display='block';overlay.style.display='block';playBtn.style.display='flex';vidEl.style.display='none';};
  } else {
    showToast('视频加载中...');
    setTimeout(()=>showToast('视频播放需接入AI生成接口'),1500);
  }
}
function updateDetailUI(){
  if(!curItem)return;
  const id=curItem.id;
  document.getElementById('detail-like-count').textContent=curItem.likes+(likes.has(id)?1:0);
  document.getElementById('detail-comment-count').textContent=curItem.comments;
  const lc=document.getElementById('detail-like-icon'),fc=document.getElementById('detail-fav-icon');
  lc.setAttribute('fill',likes.has(id)?'#ff3b30':'none');lc.setAttribute('stroke',likes.has(id)?'#ff3b30':'currentColor');
  fc.setAttribute('fill',favs.has(id)?'#ff9500':'none');fc.setAttribute('stroke',favs.has(id)?'#ff9500':'currentColor');

function toggleDetailLike(){if(!curItem)return;likes.has(curItem.id)?likes.delete(curItem.id):likes.add(curItem.id);updateDetailUI();}

/* ===== Media Upload ===== */
function handleMediaUpload(e){
  const files=Array.from(e.target.files||[]);
  files.forEach(file=>{
    const isVideo=file.type.startsWith('video/');
    const url=URL.createObjectURL(file);
    mediaList.push({url,type:isVideo?'video':'image',file});
  });
  if(selectedMediaIdx===-1&&mediaList.length>0)selectedMediaIdx=0;
  renderMediaPreview();
  e.target.value='';
}
function renderMediaPreview(){
  const container=document.getElementById('media-preview');
  let html=mediaList.map((m,i)=>`
    <div class="media-item ${i===selectedMediaIdx?'selected':''}" onclick="selectMedia(${i})">
      ${m.type==='video'
        ?`<video src="${m.url}" muted></video><div class="video-badge"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`
        :`<img src="${m.url}" alt="">`}
      <button class="remove-btn" onclick="event.stopPropagation();removeMedia(${i})">×</button>
    </div>`).join('');
  html+=`<button class="add-media-btn" onclick="document.getElementById('album-input').click()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>`;
  container.innerHTML=html;
}
function selectMedia(idx){selectedMediaIdx=idx;renderMediaPreview();}
function removeMedia(idx){
  URL.revokeObjectURL(mediaList[idx].url);
  mediaList.splice(idx,1);
  if(selectedMediaIdx>=mediaList.length)selectedMediaIdx=mediaList.length-1;
  renderMediaPreview();
}
function hasUploadedMedia(){return mediaList.length>0&&selectedMediaIdx>=0;}
function getSelectedMedia(){return selectedMediaIdx>=0?mediaList[selectedMediaIdx]:null;}

function showSimulatedVideo(container,hasMedia){
  const frames=[
    'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&h=800&fit=crop',
    'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&h=800&fit=crop',

    'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&h=800&fit=crop',
    'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&h=800&fit=crop'
  ];
  const frameHtml=frames.map((f,i)=>`<img src="${f}" class="sim-frame" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:${i===0?'1':'0'};transition:opacity .6s ease;border-radius:16px">`).join('');
  container.innerHTML=`
    <div style="width:100%;position:relative;padding-bottom:133%;border-radius:16px;overflow:hidden;background:#000">
      ${frameHtml}
      <div style="position:absolute;bottom:8px;left:8px;right:8px;display:flex;align-items:center;gap:8px;z-index:10">
        <button id="sim-play-btn" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);cursor:pointer">
          <svg id="sim-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="#fff" style="margin-left:2px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <div style="flex:1;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden">
          <div id="sim-progress" style="height:100%;width:0%;background:#fff;border-radius:2px;transition:width .1s linear"></div>
        </div>
        <span id="sim-time" style="color:#fff;font-size:11px;font-variant-numeric:tabular-nums">0:00</span>
      </div>
      <div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:4px 10px;border-radius:12px;font-size:11px;color:#fff;display:flex;align-items:center;gap:4px;z-index:10">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        AI生成视频
      </div>
      <div style="position:absolute;top:8px;right:8px;background:rgba(255,59,48,.9);padding:2px 8px;border-radius:8px;font-size:10px;color:#fff;z-index:10">● REC</div>
    </div>`;
  // Simulate video playback with frame animation
  let frameIdx=0,isPlaying=true;
  const frames2=container.querySelectorAll('.sim-frame');
  const progress=document.getElementById('sim-progress');
  const timeEl=document.getElementById('sim-time');
  const playBtn=document.getElementById('sim-play-btn');
  const playIcon=document.getElementById('sim-play-icon');
  let duration=5,elapsed=0;
  const tick=()=>{
    if(!isPlaying)return;
    elapsed+=0.1;
    if(elapsed>=duration){elapsed=0;frameIdx=0;}
    const pct=(elapsed/duration)*100;
    if(progress)progress.style.width=pct+'%';
    const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);
    if(timeEl)timeEl.textContent=m+':'+(s<10?'0':'')+s;
    const newFrame=Math.floor((elapsed/duration)*frames2.length)%frames2.length;
    if(newFrame!==frameIdx){
      frames2.forEach((f,i)=>f.style.opacity=i===newFrame?'1':'0');
      frameIdx=newFrame;
    }
  };
  const interval=setInterval(tick,100);
  if(playBtn){
    playBtn.addEventListener('click',()=>{
      isPlaying=!isPlaying;
      if(isPlaying){
        playIcon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      } else {
        playIcon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
      }
    });
  }
}

  const media=getSelectedMedia();

        'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&h=800&fit=crop',
        'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&h=800&fit=crop',
        'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&h=800&fit=crop',
        'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600&h=800&fit=crop',
      ];
      const resultImg=sampleImgs[Math.floor(Math.random()*sampleImgs.length)];
      rc.innerHTML='<img src="'+resultImg+'" alt="generated">';
    }
  },3000);
}
function backFromResult(){navigateTo('generator');}
function regenFromResult(){
  document.getElementById('prompt-input').value=document.getElementById('result-prompt-text').textContent;
  handleGenerate();
}
function openInpaintFromResult(){
  const img=document.querySelector('#result-content img');
  if(img){
    // Create a fake item for inpaint
    curItem={id:'gen-'+Date.now(),type:'image',img:img.src,author:'AI生成',likes:0,comments:0,desc:document.getElementById('result-prompt-text').textContent};
    document.getElementById('inpaint-image').src=img.src;
  }
  navigateTo('inpaint');
  setTimeout(()=>{const c=document.getElementById('inpaint-canvas'),w=c.parentElement;c.width=w.clientWidth;c.height=w.clientHeight;},100);
}

/* ===== INPAINT ===== */
function openInpaint(){
  if(!curItem)return;
  document.getElementById('inpaint-image').src=curItem.img;
  navigateTo('inpaint');
  setTimeout(()=>{const c=document.getElementById('inpaint-canvas'),w=c.parentElement;c.width=w.clientWidth;c.height=w.clientHeight;},100);
}
function initCanvas(){
  const c=document.getElementById('inpaint-canvas'),w=c.parentElement;
  c.width=w.clientWidth;c.height=w.clientHeight;
  const ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';
  function pos(e){const r=c.getBoundingClientRect(),x=e.touches?e.touches[0].clientX:e.clientX,y=e.touches?e.touches[0].clientY:e.clientY;return{x:x-r.left,y:y-r.top};}
  function start(e){painting=true;const p=pos(e);lx=p.x;ly=p.y;}
  function move(e){if(!painting)return;e.preventDefault();const p=pos(e);ctx.globalCompositeOperation=paintTool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=paintTool==='brush'?'rgba(255,255,255,0.5)':'transparent';ctx.lineWidth=paintTool==='brush'?18:28;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;}
  function end(){painting=false;}
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);c.addEventListener('mouseup',end);c.addEventListener('mouseleave',end);
  c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);
}
function setTool(t){paintTool=t;document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));}
function toggleChip(id){document.getElementById('chip-'+id).classList.toggle('active');}
function handleInpaint(){
  const p=document.getElementById('inpaint-prompt-input').value.trim();
  if(!p)return showToast('请输入修改描述');
  document.getElementById('processing-overlay').style.display='flex';
  document.getElementById('inpaint-generate-btn').disabled=true;
  setTimeout(()=>{
    document.getElementById('processing-overlay').style.display='none';
    document.getElementById('inpaint-generate-btn').disabled=false;
    document.getElementById('inpaint-save-btn').style.display='flex';
    showToast('局部重绘完成！');
  },2500);
}
function resetInpaint(){
  const c=document.getElementById('inpaint-canvas');c.getContext('2d').clearRect(0,0,c.width,c.height);
  document.getElementById('inpaint-prompt-input').value='';
  document.getElementById('inpaint-save-btn').style.display='none';
}

/* ===== CLOCK ===== */
function tick(){
  const n=new Date(),h=String(n.getHours()).padStart(2,'0'),m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('status-time').textContent=h+':'+m;
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded',()=>{
  renderCats();renderGrid();renderAvatars();renderBlur();initCanvas();tick();renderMediaPreview();
  setInterval(tick,30000);
  const pi=document.getElementById('prompt-input'),gb=document.getElementById('generate-btn');
  pi.addEventListener('input',()=>{
    gb.disabled=!pi.value.trim();
    pi.style.height='auto';
    pi.style.height=Math.min(pi.scrollHeight,120)+'px';
  });
  gb.disabled=true;
});

window.addEventListener('resize',()=>{
  const c=document.getElementById('inpaint-canvas');if(!c)return;
  const w=c.parentElement,temp=document.createElement('canvas');
  temp.width=c.width;temp.height=c.height;temp.getContext('2d').drawImage(c,0,0);
  c.width=w.clientWidth;c.height=w.clientHeight;c.getContext('2d').drawImage(temp,0,0);
});
</script>
