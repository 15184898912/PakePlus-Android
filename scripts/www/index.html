}

function priceClass(p) {
    p = Math.round(p);
    if (p===0) return 'price-zero';
    if (p>=1000) return 'price-high';
    if (p>=500) return 'price-mid-high';
    if (p>=200) return 'price-mid';
    return 'price-low';
}

function sortArr(a) {
    return a.sort(function(x,y){
        if (x.s !== y.s) return x.s.localeCompare(y.s,'zh-CN');
        return x.m.localeCompare(y.m,'zh-CN');
    });
}

function load() {
    var s = localStorage.getItem(DATA_KEY);
    if (s) {
        try { list = JSON.parse(s); } catch(e) { initData(); }
    } else {
        initData();
    }
    showList = sortArr(list.slice());
}

function initData() {
    list = INIT.map(function(i){
        return {id:uid(), s:i.s, m:i.m, p1:i.p1, p2:i.p2, p3:i.p3, p4:i.p4};
    });
    save();
}

function save() {
    localStorage.setItem(DATA_KEY, JSON.stringify(list));
}

function render() {
    var tb = document.getElementById('tbody');
    tb.innerHTML = '';
    for (var i=0; i<showList.length; i++) {
        (function(item, idx){
            var tr = document.createElement('tr');
            
            var td1 = document.createElement('td');
            td1.className = seriesClass(item.s);
            td1.textContent = item.s;
            
            var td2 = document.createElement('td');
            td2.className = 'model-cell';
            td2.textContent = item.m;
            
            var td3 = document.createElement('td');
            td3.className = priceClass(item.p1);
            td3.textContent = Math.round(item.p1);
            
            var td4 = document.createElement('td');
            td4.className = priceClass(item.p2);
            td4.textContent = Math.round(item.p2);
            
            var td5 = document.createElement('td');
            td5.className = priceClass(item.p3);
            td5.textContent = Math.round(item.p3);
            
            var td6 = document.createElement('td');
            td6.className = priceClass(item.p4);
            td6.textContent = Math.round(item.p4);
            
            tr.appendChild(td1);
            tr.appendChild(td2);
            tr.appendChild(td3);
            tr.appendChild(td4);
            tr.appendChild(td5);
            tr.appendChild(td6);
            
            tr.onclick = function(){ openEdit(item); };
            
            var timer;
            tr.addEventListener('touchstart', function(){
                timer = setTimeout(function(){ openDel(item.id); }, 500);
            });
            tr.addEventListener('touchend', function(){ clearTimeout(timer); });
            tr.addEventListener('touchmove', function(){ clearTimeout(timer); });
            tr.oncontextmenu = function(e){ e.preventDefault(); openDel(item.id); };
            
            tb.appendChild(tr);
        })(showList[i], i);
    }
}

function filter(kw) {
    if (!kw.trim()) {
        showList = sortArr(list.slice());
    } else {
        kw = kw.toLowerCase();
        showList = sortArr(list.filter(function(i){
            return i.s.toLowerCase().indexOf(kw)>-1 || i.m.toLowerCase().indexOf(kw)>-1;
        }));
    }
    render();
}

function openAdd() {
    editId = null;
    document.getElementById('editTitle').textContent = '添加新机型';
    document.getElementById('fSeries').value = '';
    document.getElementById('fModel').value = '';
    document.getElementById('fP1').value = '';
    document.getElementById('fP2').value = '';
    document.getElementById('fP3').value = '';
    document.getElementById('fP4').value = '';
    document.getElementById('editMask').classList.add('show');
}

function openEdit(item) {
    editId = item.id;
    document.getElementById('editTitle').textContent = '编辑机型';
    document.getElementById('fSeries').value = item.s;
    document.getElementById('fModel').value = item.m;
    document.getElementById('fP1').value = item.p1;
    document.getElementById('fP2').value = item.p2;
    document.getElementById('fP3').value = item.p3;
    document.getElementById('fP4').value = item.p4;
    document.getElementById('editMask').classList.add('show');
}

function closeEdit() {
    document.getElementById('editMask').classList.remove('show');
    editId = null;
}

function openDel(id) {
    delId = id;
    document.getElementById('delMask').classList.add('show');
}

function closeDel() {
    document.getElementById('delMask').classList.remove('show');
    delId = null;
}

function doSave() {
    var s = document.getElementById('fSeries').value.trim();
    var m = document.getElementById('fModel').value.trim();
    var p1 = parseInt(document.getElementById('fP1').value);
    var p2 = parseInt(document.getElementById('fP2').value);
    var p3 = parseInt(document.getElementById('fP3').value);
    var p4 = parseInt(document.getElementById('fP4').value);
    
    if (!s || !m) { showTip('请填写所有字段'); return; }
    if (isNaN(p1)||isNaN(p2)||isNaN(p3)||isNaN(p4)||p1<0||p2<0||p3<0||p4<0) {
        showTip('请输入有效的价格数字'); return;
    }
    
    if (editId) {
        for (var i=0; i<list.length; i++) {
            if (list[i].id === editId) {
                list[i].s = s; list[i].m = m; list[i].p1 = p1; list[i].p2 = p2; list[i].p3 = p3; list[i].p4 = p4;
                showTip('修改成功'); break;
            }
        }
    } else {
        list.push({id:uid(), s:s, m:m, p1:p1, p2:p2, p3:p3, p4:p4});
        showTip('添加成功');
    }
    save();
    filter(document.getElementById('searchInput').value);
    closeEdit();
}

function doDel() {
    if (!delId) return;
    for (var i=0; i<list.length; i++) {
        if (list[i].id === delId) {
            list.splice(i,1); break;
        }
    }
    save();
    filter(document.getElementById('searchInput').value);
    showTip('删除成功');
    closeDel();
}

// ========== 双指缩放+拖动平移实现 ==========
var currentZoom = 1.3;
var translateX = 0;
var translateY = 0;
var zoomLevelText = null;
var appContent = null;

// 手势状态
var state = {
    isDragging: false,
    isPinching: false,
    startX: 0,
    startY: 0,
    startTranslateX: 0,
    startTranslateY: 0,
    startDist: 0,
    startZoom: 0,
    lastTouchCount: 0
};

function getDistance(p1, p2) {
    var dx = p1.clientX - p2.clientX;
    var dy = p1.clientY - p2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
}

function getMidpoint(p1, p2) {
    return {
        x: (p1.clientX + p2.clientX) / 2,
        y: (p1.clientY + p2.clientY) / 2
    };
}

function applyTransform() {
    if (!appContent) return;
    var transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + currentZoom + ')';
    appContent.style.transform = transform;
    appContent.style.webkitTransform = transform;
    
    // 更新缩放容器高度
    var container = document.getElementById('zoom-container');
    if (container) {
        var rect = appContent.getBoundingClientRect();
        container.style.height = (rect.height / currentZoom + 100) + 'px';
    }
    
    // 更新百分比显示
    if (zoomLevelText) {
        zoomLevelText.textContent = Math.round(currentZoom * 100) + '%';
    }
    
    // 保存
    try {
        localStorage.setItem('oppo_zoom', JSON.stringify({
            z: currentZoom, x: translateX, y: translateY
        }));
    } catch(e) {}
}

function setZoom(z, centerX, centerY) {
    z = Math.max(1, Math.min(4, z));
    
    if (centerX !== undefined && centerY !== undefined) {
        // 以双指中心为缩放点
        var ratio = z / currentZoom;
        translateX = centerX - ratio * (centerX - translateX);
        translateY = centerY - ratio * (centerY - translateY);
    }
    
    currentZoom = z;
    
    // 限制平移范围
    var maxX = 0;
    var minX = window.innerWidth - appContent.offsetWidth * currentZoom;
    var maxY = 0;
    var minY = window.innerHeight - appContent.offsetHeight * currentZoom;
    
    translateX = Math.min(maxX, Math.max(minX, translateX));
    translateY = Math.min(maxY, Math.max(minY, translateY));
    
    if (currentZoom <= 1.01) {
        translateX = 0;
        translateY = 0;
    }
    
    applyTransform();
}

function zoomIn() {
    setZoom(currentZoom + 0.25);
}

function zoomOut() {
    setZoom(currentZoom - 0.25);
}

function zoomReset() {
    currentZoom = 1.3;
    translateX = 0;
    translateY = 0;
    applyTransform();
}

function initPinchZoom() {
    appContent = document.getElementById('appContent');
    zoomLevelText = document.getElementById('zoomReset');
    if (!appContent || !zoomLevelText) return;
    
    // 读取保存的状态
    try {
        var saved = JSON.parse(localStorage.getItem('oppo_zoom'));
        if (saved) {
            currentZoom = saved.z || 1.3;
            translateX = saved.x || 0;
            translateY = saved.y || 0;
        }
    } catch(e) {}
    
    // 按钮事件
    function bindBtn(id, fn) {
        var btn = document.getElementById(id);
        if (!btn) return;
        var handler = function(e) {
            e.preventDefault();
            e.stopPropagation();
            fn();
        };
        btn.addEventListener('touchstart', handler, {passive: false, capture: true});
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fn();
        }, true);
    }
    
    bindBtn('zoomIn', zoomIn);
    bindBtn('zoomOut', zoomOut);
    bindBtn('zoomReset', zoomReset);
    
    // 触摸事件处理 - 使用capture确保优先处理
    var el = document;
    
    el.addEventListener('touchstart', function(e) {
        // 忽略输入框和按钮上的触摸
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || 
            e.target.closest('.mask') || e.target.closest('.float-zoom')) {
            return;
        }
        
        if (e.touches.length === 1) {
            if (!state.isPinching) {
                state.isDragging = true;
                state.startX = e.touches[0].clientX;
                state.startY = e.touches[0].clientY;
                state.startTranslateX = translateX;
                state.startTranslateY = translateY;
            }
        } else if (e.touches.length === 2) {
            state.isDragging = false;
            state.isPinching = true;
            state.startDist = getDistance(e.touches[0], e.touches[1]);
            state.startZoom = currentZoom;
            state.startTranslateX = translateX;
            state.startTranslateY = translateY;
            state.startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            state.startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            e.preventDefault();
        }
        state.lastTouchCount = e.touches.length;
    }, {passive: false, capture: true});
    
    el.addEventListener('touchmove', function(e) {
        // 忽略输入框和按钮
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || 
            e.target.closest('.mask') || e.target.closest('.float-zoom')) {
            return;
        }
        
        if (e.touches.length === 2 && state.isPinching) {
            // 双指缩放
            var newDist = getDistance(e.touches[0], e.touches[1]);
            var mid = getMidpoint(e.touches[0], e.touches[1]);
            
            if (state.startDist > 0) {
                var newZoom = state.startZoom * (newDist / state.startDist);
                
                // 计算新的平移量，以双指中心为锚点
                var ratio = newZoom / state.startZoom;
                var newTx = mid.x - ratio * (mid.x - state.startTranslateX);
                var newTy = mid.y - ratio * (mid.y - state.startTranslateY);
                
                currentZoom = Math.max(1, Math.min(4, newZoom));
                translateX = newTx;
                translateY = newTy;
                
                // 边界限制
                if (currentZoom <= 1.01) {
                    currentZoom = 1;
                    translateX = 0;
                    translateY = 0;
                }
                
                applyTransform();
            }
            e.preventDefault();
            e.stopPropagation();
        } else if (e.touches.length === 1 && state.isDragging && currentZoom > 1.05) {
            // 单指拖动
            var dx = e.touches[0].clientX - state.startX;
            var dy = e.touches[0].clientY - state.startY;
            translateX = state.startTranslateX + dx;
            translateY = state.startTranslateY + dy;
            
            // 边界限制
            var maxX = 0;
            var minX = window.innerWidth - appContent.offsetWidth * currentZoom;
            var maxY = 0;
            var minY = window.innerHeight - appContent.offsetHeight * currentZoom;
            
            translateX = Math.min(maxX, Math.max(minX, translateX));
            translateY = Math.min(maxY, Math.max(minY, translateY));
            
            applyTransform();
            e.preventDefault();
        }
    }, {passive: false, capture: true});
    
    el.addEventListener('touchend', function(e) {
        if (e.touches.length === 0) {
            state.isDragging = false;
            state.isPinching = false;
        } else if (e.touches.length === 1 && state.isPinching) {
            // 从双指变成单指，停止缩放，准备拖动
            state.isPinching = false;
            state.isDragging = true;
            state.startX = e.touches[0].clientX;
            state.startY = e.touches[0].clientY;
            state.startTranslateX = translateX;
            state.startTranslateY = translateY;
        }
    }, {passive: true, capture: true});
    
    el.addEventListener('touchcancel', function(e) {
        state.isDragging = false;
        state.isPinching = false;
    }, true);
    
    // 双击重置
    var lastTap = 0;
    el.addEventListener('touchend', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || 
            e.target.closest('.mask') || e.target.closest('.float-zoom')) {
            return;
        }
        var now = Date.now();
        if (now - lastTap < 300 && e.touches.length === 0) {
            if (currentZoom > 1.1) {
                zoomReset();
            }
            lastTap = 0;
        } else {
            lastTap = now;
        }
    }, true);
    
    // 初始应用
    applyTransform();
}

document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('dateText').textContent = getDate();
    load();
    render();
    initPinchZoom();
    
    document.getElementById('searchInput').addEventListener('input', function(e){
        filter(e.target.value);
    });
    
    document.getElementById('addBtn').onclick = openAdd;
    document.getElementById('cancelBtn').onclick = closeEdit;
    document.getElementById('okBtn').onclick = doSave;
    document.getElementById('delCancel').onclick = closeDel;
    document.getElementById('delOk').onclick = doDel;
    
    document.getElementById('editMask').onclick = function(e){
        if (e.target === this) closeEdit();
    };
    document.getElementById('delMask').onclick = function(e){
        if (e.target === this) closeDel();
    };
});
